<script>
const DATA = {"title":"2000-2026 中国医学科研伦理事件编年史","subtitle":"医学伦理审查 · 科研诚信 · 相关判刑 · 事件编年","generated":"2026-09-19","events":[{"keywords":["肖传国","方舟子","肖氏反射弧","院士增选","学术不端","名誉权","寻衅滋事","方玄昌","手术争议","卫生部论证"],"summary":"2005年9月，华中科技大学同济医学院教授肖传国参选中国科学院院士增选期间，科普作家方舟子公开指控其存在“用会议摘要冒充论文”“履历造假”等学术不端行为，并质疑“肖氏反射弧”理论的学术价值，由此引发长期诉讼与舆论战。2010年6-8月，肖传国指使他人袭击方舟子及《财经》编辑方玄昌，2010年10月被以寻衅滋事罪判处拘役5个半月。卫生部组织专家论证认为“肖氏反射弧”手术安全性、有效性在循证医学上证据不足，不应在临床上使用。该案成为学术争议演变为刑事案件的典型案例。","timeline":[{"date":"2005-09","desc":"肖传国参选中国科学院院士增选期间，方舟子经《北京科技报》刊文指控其学术不端（“脚踏两只船”“用会议摘要冒充论文”“履历造假”），质疑“肖氏反射弧”理论学术价值。"},{"date":"2005","desc":"肖传国以名誉权受侵害为由起诉方舟子及北京科技报、搜狐网等机构。"},{"date":"2006-07","desc":"武汉法院一审判决方舟子败诉，需公开道歉并赔偿3万元。"},{"date":"2007-02-27","desc":"武汉市中级人民法院终审宣判，方舟子公开道歉并赔偿3万元抚慰金。"},{"date":"2010-06","desc":"肖传国指使他人袭击《财经》杂志编辑方玄昌。"},{"date":"2010-08","desc":"肖传国指使他人袭击方舟子，案件告破。"},{"date":"2010-10-10","desc":"北京市石景山区人民法院一审判决：肖传国犯寻衅滋事罪，判处拘役5个半月；二审维持原判。"},{"date":"2010","desc":"中国科学技术协会谴责肖传国行为并建议剥夺其“首席科学家”等荣誉头衔；科技部澄清其承担的973计划项目已于2008年结题，其不再是该项目首席科学家。"},{"date":"2011-03-17","desc":"肖传国刑满释放。"},{"date":"2019-06-27","desc":"深圳肖传国医院正式启动，其“肖氏反射弧”手术临床应用争议再度引发关注。"}],"ethics":"核心问题：1）“肖氏反射弧”手术在循证医学证据不足的情况下被推广应用于临床，卫生部专家论证认定其安全性、有效性证据不足，不应在临床使用；2）学术争议未能通过学术共同体机制解决，最终演变为刑事案件；3）院士增选与学术评价过程中的监督与申诉机制缺失；4）科学家个人荣誉头衔管理混乱。该事件深刻影响中国学术监督边界的讨论。","sources":[{"title":"百度百科：肖传国事件","url":"https://baike.baidu.com/item/%E8%82%96%E4%BC%A0%E5%9B%BD%E4%BA%8B%E4%BB%B6/2931089"}],"key":"xiao_chuanguo","name":"肖传国事件（肖氏反射弧争议与雇凶伤人案）","slug":"xiao-chuanguo","placements":[{"year":2005,"month":9},{"year":2006,"month":7},{"year":2007,"month":2},{"year":2010,"month":10},{"year":2011,"month":3},{"year":2019,"month":6}],"wordcloud":[["肖氏反射弧",4],["肖传国事件",1],["肖传国",1],["方舟子",1],["院士增选",1],["学术不端",1],["名誉权",1],["寻衅滋事",1],["方玄昌",1],["手术争议",1],["卫生部论证",1],["履历造假",1],["等学术不端行为",1],["并质疑",1],["理论的学术价值",1],["财经",1],["编辑方玄昌",1],["手术安全性",1],["不应在临床上使用",1],["核心问题",1],["有效性证据不足",1],["不应在临床使用",1]]},{"keywords":["黄金大米","转基因","伦理审查","知情同意","儿童试验","湖南衡南","汤光文","荫士安","学术不端","撤职"],"summary":"2008年5月20日至6月23日，美国塔夫茨大学汤光文等人在湖南省衡南县江口镇中心小学实施“儿童植物类胡萝卜素维生素A当量研究”项目，对6-8岁儿童开展转基因“黄金大米”人体试验。项目刻意隐瞒试验中使用转基因大米，未向学生家长提供完整知情同意书。2012年8月论文发表后遭“绿色和平”谴责，舆论哗然。2012年12月6日，中国疾控中心、浙江省医科院、湖南省疾控中心联合公布调查结果，认定该试验违反相关规定、科研伦理和科研诚信，多名责任人被撤职。","timeline":[{"date":"2008-05-20","desc":"黄金大米人体试验在湖南省衡南县江口镇中心小学实施，至6月23日结束。项目为汤光文主持的“儿童植物类胡萝卜素维生素A当量研究”，与荫士安在湖南开展的国内项目合并进行。"},{"date":"2008-05","desc":"课题组召开学生家长知情通报会，但未提及受试者食用的是转基因“黄金大米”；伦理审批与知情同意过程刻意隐瞒转基因事实。"},{"date":"2012-08-01","desc":"汤光文等在《美国临床营养杂志》发表论文《“黄金大米”中的β-胡萝卜素与油胶囊中β-胡萝卜素对儿童补充维生素A同样有效》。"},{"date":"2012-08","desc":"国际环保组织“绿色和平”谴责研究人员使用转基因大米对中国6至8岁儿童进行人体试验，事件公开化。"},{"date":"2012-12-06","desc":"中国疾控中心、浙江省医学科学院、湖南省疾控中心联合公布调查结果：项目所用黄金大米从境外带入未经申报批准，违反国务院农业转基因生物安全管理规定；伦理审批和知情同意刻意隐瞒转基因事实，未提供完整知情同意书，违反卫生部《涉及人的生物医学研究伦理审查办法（试行）》及科研伦理原则，存在学术不端行为；当事人在调查中隐瞒事实并提供虚假信息，严重违反科研诚信。"},{"date":"2012-12-07","desc":"人民网等发布通报报道：荫士安被撤销中国疾控中心营养食品所妇幼营养室主任职务，技术职称从二级研究员降至三级，3年内不得主持科研工作，取消博士生导师资格，撤销党内职务；王茵被撤销浙江省医科院科技处处长等职务并受党内警告处分。"}],"ethics":"核心伦理问题：1）儿童（6-8岁）作为受试者的特殊保护未得到落实；2）知情同意严重不完整——未告知家长食用的是转基因大米；3）黄金大米从境外带入未经申报批准，违反转基因生物安全管理规定；4）伦理审查形同虚设，未审查出试验实质内容；5）当事人调查期间隐瞒事实、提供虚假信息。该事件直接推动中国对涉及人的生物医学研究伦理审查制度的强化落实。","sources":[{"title":"人民网：“黄金大米”事件3人被撤职","url":"https://www.people.com.cn/24hour/n/2012/1207/c25408-19827657.html"},{"title":"人民网：官方通报黄金大米事件调查结果：试验隐瞒家长","url":"https://edu.people.com.cn/n/2012/1207/c1053-19819285.html"}],"key":"golden_rice","name":"黄金大米事件","slug":"golden-rice","placements":[{"year":2008,"month":5},{"year":2012,"month":8},{"year":2012,"month":12}],"wordcloud":[["黄金大米",2],["黄金大米事件",1],["转基因",1],["伦理审查",1],["知情同意",1],["儿童试验",1],["湖南衡南",1],["汤光文",1],["荫士安",1],["学术不端",1],["撤职",1],["项目",1],["人体试验",1],["绿色和平",1],["谴责",1],["舆论哗然",1],["中国疾控中心",1],["浙江省医科院",1],["多名责任人被撤职",1],["核心伦理问题",1],["儿童",1],["伦理审查形同虚设",1],["提供虚假信息",1]]},{"keywords":["魏则西","滑膜肉瘤","百度竞价排名","武警二院","生物免疫疗法","DC-CIK","莆田系","医疗广告","调查组","科室外包"],"summary":"西安电子科技大学学生魏则西患腹壁滑膜肉瘤，通过百度搜索接触到武警北京总队第二医院的生物免疫疗法（DC-CIK细胞免疫治疗）广告，2014年9月至2015年7月在该院接受4次治疗花费20余万元，疗效不佳。2016年4月12日魏则西病逝，终年22岁。4月27日事件经微博披露引爆舆论，牵出百度医疗竞价排名、部队医院科室外包、莆田系等问题。2016年5月2日国家多部门成立联合调查组，5月9日公布调查结果。","timeline":[{"date":"2014-04","desc":"21岁的魏则西被确诊为腹壁滑膜肉瘤三期。"},{"date":"2014-09","desc":"魏则西一家通过百度搜索得知武警北京总队第二医院治疗“滑膜肉瘤”的广告信息，开始在该院接受DC-CIK生物免疫疗法。"},{"date":"2015-07","desc":"魏则西在武警二院共完成4次生物免疫疗法，花费20多万元；后经海外留学生查证，该疗法因有效率过低在国外早已停止临床使用。"},{"date":"2016-04-12","desc":"魏则西因肿瘤扩散至肺部在家中病逝，终年22岁。"},{"date":"2016-04-27","desc":"新浪微博账号“孔狐狸”发布长文披露魏则西事件始末，短时间内引发公众广泛关注。"},{"date":"2016-05-02","desc":"国家相关部门成立联合调查组进驻百度公司和武警北京二院调查取证。"},{"date":"2016-05-04","desc":"武警北京二院停止一切对外服务。"},{"date":"2016-05-09","desc":"联合调查组公布调查结果：武警二院存在科室违规合作、发布虚假信息和医疗广告误导患者等问题；百度竞价排名机制存在付费竞价权重过高、商业推广标识不清等问题，客观上对魏则西选择就医产生影响。"}],"ethics":"核心问题：1）未经充分循证验证的“生物免疫疗法”以“最新科技”名义用于临床收费治疗，缺乏有效性与安全性证据；2）医院科室违规外包给莆田系公司，医疗广告虚假宣传；3）网络医疗信息竞价排名误导患者就医决策；4）对晚期癌症患者的过度医疗与无效治疗造成经济与身心双重伤害。事件后百度全面整改医疗广告，部队医院停止对外科室合作，国家加强医疗广告与网络信息监管。","sources":[{"title":"快懂百科：魏则西事件","url":"https://www.baike.com/wikiid/7303053946116309007"},{"title":"亚洲新闻网：魏则西事件——一场改变中国网络医疗广告的悲剧","url":"https://wechatinchina.com/%e9%ad%8f%e5%88%99%e8%a5%bf%e4%ba%8b%e4%bb%b6%ef%bc%9a%e4%b8%80%e5%a0%ba%e6%94%b9%e8%ae%8a%e4%b8%ad%e5%9c%8b%e7%b6%b2%e8%b7%af%e9%86%ab%e7%99%82%e5%bb%a3%e5%91%8a%e7%9a%84%e6%82%b2%e5%8a%87.html"}],"key":"wei_zexi","name":"魏则西事件","slug":"wei-zexi","placements":[{"year":2014,"month":4},{"year":2016,"month":4},{"year":2016,"month":5}],"wordcloud":[["生物免疫疗法",2],["dc",2],["魏则西事件",1],["魏则西",1],["滑膜肉瘤",1],["百度竞价排名",1],["武警二院",1],["cik",1],["莆田系",1],["医疗广告",1],["调查组",1],["科室外包",1],["广告",1],["疗效不佳",1],["部队医院科室外包",1],["莆田系等问题",1],["核心问题",1],["最新科技",1],["医疗广告虚假宣传",1]]},{"keywords":["撤稿","肿瘤生物学","107篇","伪造同行评议","第三方中介","基金委","科研诚信","图片误用","论文工厂","黑中介"],"summary":"2015年3月起，英国现代生物、施普林格、爱思唯尔、自然等国际出版集团先后4批集中撤稿，涉及中国作者论文117篇，其中23篇标注获国家自然科学基金资助。2017年4月，施普林格·自然宣布撤回旗下《肿瘤生物学》期刊2012年至2015年发表的107篇中国作者论文，涉及国内100多个机构、523位作者。调查发现绝大多数存在提供虚假同行评议专家或虚假同行评议意见问题，第三方中介机构（论文工厂）扮演重要角色。2020年9月国家自然科学基金委通报调查处理结果。","timeline":[{"date":"2015-03","desc":"英国现代生物、施普林格、爱思唯尔等出版集团开始分批集中撤稿，涉及中国作者论文117篇（含后续批次），其中23篇标注获国家自然科学基金资助。"},{"date":"2015","desc":"国家自然科学基金委开展调查：第三方中介机构扮演重要角色，近半论文投稿与“上海丰核信息科技有限公司”有直接或间接关系，该公司伪造通讯作者邮箱、伪造审稿人邮箱、提供虚假审稿意见；基金委对涉事作者作出处罚，最重为7年内禁止申请科学基金项目。"},{"date":"2017-04","desc":"施普林格·自然发表声明，宣布撤回《肿瘤生物学》期刊2012年至2015年发表的107篇中国作者论文，涉及国内100多个机构、523位作者。"},{"date":"2017-06","desc":"科技部牵头召开科研诚信建设联席会议第六次会议，专题研究107篇论文撤稿事件，决定彻查论文造假、严惩造假者、深化科技评价改革、打击论文“黑中介”和掠夺性期刊。"},{"date":"2017","desc":"涉事作者陆续受到处理：北京大学第三医院退回科研奖金、解除聘用合同；复旦大学对主要作者记过、警告、取消职务职称晋升等处分；武汉大学撤销副教授职称；中国工程院取消一名院士候选人候选资格。"},{"date":"2020-09-17","desc":"科技日报刊发报道，披露基金委对两轮大规模撤稿事件的调查详情：107篇撤稿中101篇存在虚假同行评议问题，其中95篇由第三方机构提供，12篇系向第三方机构购买论文。"}],"ethics":"核心问题：1）第三方“论文工厂”代写代投、伪造同行评议形成完整学术不端产业链；2）期刊审稿漏洞——虚假审稿人邮箱与虚假审稿意见未被识破；3）科研评价体系“唯论文”导向催生买卖论文需求；4）涉事作者学术诚信缺失。事件后国家建立科研诚信建设联席会议制度，出台《科研诚信案件调查处理规则（试行）》，强化撤稿论文跟踪与科研不端查处。","sources":[{"title":"中国科学院：在全院加强科研诚信建设视频会上的讲话（张涛，2018年4月24日）","url":"https://cho.cas.cn/zt/kycx/201806/t20180612_5025115.html"},{"title":"科技日报：两次大规模撤稿事件 均涉及第三方中介机构","url":"https://www.stdaily.com/web/stbd/2020-09/17/content_1827322.html"}],"key":"mass_retraction","name":"中国学者大规模论文撤稿事件","slug":"mass-retraction","placements":[{"year":2015,"month":3},{"year":2017,"month":4},{"year":2017,"month":6},{"year":2020,"month":9}],"wordcloud":[["论文工厂",3],["肿瘤生物学",2],["施普林格",2],["撤稿",1],["伪造同行评议",1],["第三方中介",1],["基金委",1],["科研诚信",1],["图片误用",1],["黑中介",1],["英国现代生物",1],["爱思唯尔",1],["自然宣布撤回旗下",1],["第三方中介机构",1],["扮演重要角色",1],["核心问题",1],["第三方",1],["代写代投",1],["期刊审稿漏洞",1],["科研评价体系",1],["唯论文",1],["出台",1],["试行",1]]},{"keywords":["韩春雨","NgAgo","基因编辑","自然生物技术","撤稿","可重复性","河北科技大学","诺奖级成果","学术不端","调查"],"summary":"2016年5月2日，河北科技大学副教授韩春雨作为通讯作者在《自然·生物技术》发表NgAgo-gDNA基因编辑技术论文，被称作“诺奖级成果”。随后全球多个实验室无法重复实验，引发可重复性争议。2017年8月3日韩春雨团队主动撤回论文。2018年8月31日河北科技大学公布调查处理结果：未发现主观造假，但撤稿论文已不具备重新发表基础，取消荣誉称号、终止科研项目并收回科研经费。","timeline":[{"date":"2016-05-02","desc":"韩春雨在《自然·生物技术》发表论文《NgAgo-gDNA为导向的基因编辑技术》，引发科学界和舆论广泛关注，被誉为“诺奖级成果”。"},{"date":"2016-05","desc":"全球多个实验室反映无法重复NgAgo实验，“可重复性”质疑持续发酵。"},{"date":"2017-08-03","desc":"韩春雨团队主动撤回该论文。"},{"date":"2018-08-31","desc":"河北科技大学公布调查处理结果：校学术委员会核查全部原始实验资料并委托第三方国家重点实验室重复验证，认为撤稿论文已不再具备重新发表的基础；未发现韩春雨团队有主观造假情况；按规定取消韩春雨所获荣誉称号，终止其团队承担的科研项目并收回科研经费，收回校科研绩效奖励。"},{"date":"2018-09-01","desc":"韩春雨表态：接受国家级实验室独立第三方验证实验结果、校学术委员会调查结论和有关处理意见，承认研究“有缺陷不严谨”，对论文发表造成的误导表示歉意。"}],"ethics":"核心问题：1）重大科研成果发表后全球无法重复，暴露实验数据管理与验证流程缺陷；2）论文审稿与发表环节对重大突破性结论的重复验证要求不足；3）科研评价体系对“CNS论文”的过度追捧催生急功近利。调查结论为“未发现主观造假”，但该事件成为反思中国科研评价体系与可重复性危机的标志性案例。","sources":[{"title":"环球网：河北科技大学公布韩春雨团队撤稿论文的调查和处理结果","url":"https://china.huanqiu.com/article/2018-09/12897981.html"},{"title":"央视网：韩春雨回应撤稿论文处理结果：研究有缺陷不严谨","url":"https://news.cctv.com/2018/09/01/ARTIsRV2gWR8pECXvBFwITtU180901.shtml"}],"key":"han_chunyu","name":"韩春雨NgAgo论文撤稿事件","slug":"han-chunyu","placements":[{"year":2016,"month":5},{"year":2017,"month":8},{"year":2018,"month":8}],"wordcloud":[["诺奖级成果",2],["未发现主观造假",2],["韩春雨",1],["ngago",1],["基因编辑",1],["自然生物技术",1],["撤稿",1],["可重复性",1],["河北科技大学",1],["学术不端",1],["自然",1],["生物技术",1],["发表NgAgo",1],["被称作",1],["引发可重复性争议",1],["取消荣誉称号",1],["核心问题",1],["科研评价体系对",1],["CNS论文",1],["调查结论为",1]]},{"keywords":["换头术","头颅移植","任晓平","卡纳韦罗","哈尔滨医科大学","遗体","伦理审查","黄洁夫","器官移植条例","医学伦理"],"summary":"2017年11月17日，意大利神经学家塞尔焦·卡纳韦罗宣布世界首例人类头部移植手术在一具遗体上成功完成，手术地点在哈尔滨，由哈尔滨医科大学教授任晓平团队完成。该“遗体换头”引发巨大伦理争议。原卫生部副部长黄洁夫批评其违背器官移植条例，在技术、伦理、医学道德上均不可行，建议追究伦理审查委员会责任。医院与哈医大校级伦理委均否认对项目进行过伦理审查。","timeline":[{"date":"2017-11-17","desc":"意大利神经学家卡纳韦罗宣布，经过约18小时手术，他与哈尔滨医科大学团队成功将一具尸体的头与另一具尸体的脊椎、血管及神经接驳，即“世界首例人类头部移植手术”。"},{"date":"2017-11-22","desc":"哈尔滨医科大学教授任晓平回应称“人类第一例头移植”“换头术”等说法不妥，团队只是完成了第一例头移植外科实验模型。"},{"date":"2017-11","desc":"哈医大团队论文发表引发舆论关注；媒体调查发现医院伦理委与哈医大校级伦理委均否认审查过该项目。"},{"date":"2017-12-01","desc":"原卫生部副部长、中国人体器官捐献与移植委员会主任黄洁夫公开回应：在中国绝不允许进行临床头颅移植，这违背国家器官移植条例；从技术、伦理、医学道德上均不可行，建议追究有关单位伦理审查委员会或负责人的责任。"}],"ethics":"核心问题：1）在没有任何可信动物实验成功先例的基础上开展人类遗体头颅移植研究；2）项目伦理审查缺失——医院和校级伦理委均否认审查；3）尸体使用是否符合遗体捐献知情同意授权范围存疑；4）“换头”引发的身份认同、人格同一性等深层伦理问题。该事件凸显前沿医学研究伦理审查缺位与“先做后审”乱象。","sources":[{"title":"搜狐/央广网：“换头术”引发热议 专家：建议追究责任","url":"https://www.sohu.com/a/207856585_362042"},{"title":"环球网：“遗体换头”在哪伦理审查的：医院和哈医大校级伦理委均否认","url":"https://m.huanqiu.com/article/9CaKrnK5REj"}],"key":"head_transplant","name":"换头术伦理争议事件","slug":"head-transplant","placements":[{"year":2017,"month":11},{"year":2017,"month":12}],"wordcloud":[["换头术",1],["头颅移植",1],["任晓平",1],["卡纳韦罗",1],["哈尔滨医科大学",1],["遗体",1],["伦理审查",1],["黄洁夫",1],["器官移植条例",1],["医学伦理",1],["手术地点在哈尔滨",1],["遗体换头",1],["引发巨大伦理争议",1],["在技术",1],["伦理",1],["核心问题",1],["项目伦理审查缺失",1],["换头",1],["引发的身份认同",1],["先做后审",1],["乱象",1]]},{"keywords":["基因编辑","贺建奎","CCR5","非法行医","伦理审查","露露娜娜","HIV免疫","人类胚胎","辅助生殖","刑法修正案"],"summary":"南方科技大学原副教授贺建奎自2016年起蓄意逃避监管，伪造伦理审查文件，违规招募8对艾滋病病毒感染者夫妇实施以生殖为目的的人类胚胎基因编辑，导致3名基因编辑婴儿（含一对双胞胎“露露”“娜娜”）出生。2018年11月26日对外公布后引发全球科学伦理风暴。2019年12月30日深圳市南山区人民法院以非法行医罪判处贺建奎有期徒刑三年、罚金三百万元。2020年《刑法修正案（十一）》新增条款，明确禁止将基因编辑胚胎植入人体。","timeline":[{"date":"2016-06","desc":"贺建奎私自组织项目团队，开始实施国家明令禁止的以生殖为目的的人类胚胎基因编辑活动，蓄意逃避监管。"},{"date":"2017-03","desc":"贺建奎通过他人伪造伦理审查书，招募8对夫妇志愿者（男方HIV抗体阳性、女方阴性）参与实验，并策划他人顶替志愿者验血。"},{"date":"2018-11-25","desc":"贺建奎团队以视频形式公布研究成果，并接受美联社专访，宣称一对基因编辑双胞胎女婴“露露”“娜娜”诞生。"},{"date":"2018-11-26","desc":"事件公开引爆舆论：国家卫健委当日回应将依法查处违法行为；人民网首发稿件被删除并刊发批评社评；超百名中国科学家联署反对。"},{"date":"2018-11-27","desc":"科技部宣布暂停贺建奎的科研活动；国家卫健委、广东省政府、深圳市政府等展开调查。"},{"date":"2018-12-06","desc":"国务院总理李克强主持国家科技领导小组会议，强调“要严肃查处违背科研道德和伦理的不端行为”，系国家领导人首次正式回应。"},{"date":"2018-12","desc":"中国科协取消贺建奎“中国青年科技奖”参评资格；第二届人类基因组编辑国际峰会组委发布声明谴责。"},{"date":"2019-01-21","desc":"广东省调查组公布事件初步调查结果：定性为“贺建奎为追逐个人名利，自筹资金，蓄意逃避监管，私自组织有关人员，实施国家明令禁止的以生殖为目的的人类胚胎基因编辑活动”。"},{"date":"2019-06-10","desc":"国务院公布《中华人民共和国人类遗传资源管理条例》，强化人类遗传资源管理。"},{"date":"2019-12-30","desc":"深圳市南山区人民法院一审公开宣判：贺建奎犯非法行医罪，判处有期徒刑三年，并处罚金人民币三百万元；张仁礼有期徒刑二年、罚金一百万元；覃金洲有期徒刑一年六个月、缓刑二年、罚金五十万元。三被告当庭认罪悔罪。"},{"date":"2020-12-26","desc":"《中华人民共和国刑法修正案（十一）》通过（2021年3月1日起施行），新增条款明确禁止将基因编辑、克隆的人类胚胎植入人体或者动物体内，违者依法追究刑事责任。"},{"date":"2022-04-07","desc":"据健康时报报道，贺建奎已刑满释放；此后其多次通过社交平台就基因治疗相关问题发声。"}],"ethics":"事件核心伦理问题：1）伪造伦理审查材料，完全绕过伦理审查程序；2）在安全性、有效性未经严格验证的情况下将基因编辑技术用于临床辅助生殖；3）违反《人类辅助生殖技术规范》禁止以生殖为目的对人类胚胎进行基因操作的规定；4）招募HIV感染者夫妇并冒名顶替验血，规避监管；5）对已出生婴儿和怀孕志愿者造成不可逆的遗传影响。事后处理：涉案人员列入人类生殖技术违法违规人员“黑名单”终身禁入；终身禁止申请人类遗传资源行政审批及财政资金科研项目。","sources":[{"title":"最高人民法院：基因编辑婴儿案贺建奎因非法行医罪被判3年","url":"https://www.court.gov.cn/zixun/xiangqing/213381.html"},{"title":"百度百科：基因编辑婴儿事件","url":"https://baike.baidu.com/item/%E2%80%9C%E5%9F%BA%E5%9B%A0%E7%BC%96%E8%BE%91%E5%A9%B4%E5%84%BF%E2%80%9D%E4%BA%8B%E4%BB%B6/23177974"},{"title":"人民日报客户端：四问“基因编辑婴儿”案件","url":"https://www.peopleapp.com/rmharticle/30014490605"}],"key":"gene_edit_baby","name":"基因编辑婴儿事件","slug":"gene-edit-baby","placements":[{"year":2018,"month":11},{"year":2019,"month":1},{"year":2019,"month":6},{"year":2019,"month":12},{"year":2020,"month":12},{"year":2022,"month":4}],"wordcloud":[["刑法修正案",2],["基因编辑婴儿事件",1],["基因编辑",1],["贺建奎",1],["非法行医",1],["伦理审查",1],["露露娜娜",1],["HIV免疫",1],["人类胚胎",1],["辅助生殖",1],["伪造伦理审查文件",1],["含一对双胞胎",1],["露露",1],["娜娜",1],["出生",1],["罚金三百万元",1],["十一",1],["新增条款",1],["事件核心伦理问题",1],["伪造伦理审查材料",1],["在安全性",1],["违反",1],["规避监管",1],["事后处理",1],["黑名单",1],["终身禁入",1]]},{"keywords":["曹雪涛","裴钢","李红良","耿美玉","饶毅","科技部通报","论文造假","图片误用","科研诚信","调查处理"],"summary":"2020年初起，网络对南开大学曹雪涛院士、中科院裴钢院士、中科院上海药物所耿美玉研究员、首都医科大学饶毅教授、武汉大学李红良教授等的论文涉嫌造假问题提出广泛质疑。经约一年调查，2021年1月21日，科研诚信建设联席会议联合工作机制发布通报：曹雪涛（63篇）、李红良（21篇）论文未发现造假但存在较多图片误用，分别被取消相关资格1年和2年；耿美玉论文存在少量图片误用，被批评教育；裴钢、饶毅论文未发现造假。","timeline":[{"date":"2020-01","desc":"学术打假人士Elisabeth Bik等在网络公开质疑曹雪涛、裴钢等多位知名学者论文存在图片重复等问题，引发舆论关注。"},{"date":"2020-2021","desc":"科技部会同教育部、卫生健康委、中科院、工程院、自然科学基金委等21个部门，依据《科研诚信案件调查处理规则（试行）》建立联合工作机制开展调查，组建高层次复核专家组赴实地检查。"},{"date":"2021-01-21","desc":"科技部发布《有关论文涉嫌造假调查处理情况的通报》：曹雪涛63篇论文未发现有造假、剽窃和抄袭，但较多论文存在图片误用，反映实验室管理不严谨——取消申报国家科技计划项目资格1年、评审专家资格1年、招收研究生资格1年，责成勘误并作深刻检查；李红良21篇论文未发现造假但较多图片误用——取消相关资格2年；耿美玉论文存在少量图片误用——批评教育和科研诚信提醒谈话；裴钢、饶毅相关论文未发现造假。"},{"date":"2021-01-22","desc":"光明日报、人民网、央视网等多家中央媒体发布通报报道。"}],"ethics":"核心问题：1）院士等高层次科研人员论文图片误用频发，暴露实验室数据管理、团队管理漏洞；2）“图片误用”与“造假”的边界认定争议；3）网络公开质疑成为学术监督新渠道，官方调查程序（单位调查+部门审核+专家复核）逐步规范化；4）处理梯度（取消资格1年/2年、批评教育、诫勉谈话）体现分层问责。该通报是中国科研诚信建设联席会议联合工作机制首次集中公布多名院士级学者调查结果，具有标志意义。","sources":[{"title":"光明日报：科技部通报曹雪涛、裴钢等论文涉嫌造假调查处理结果","url":"https://epaper.gmw.cn/gmrb/images/2021-01/22/09/2021012209_pdf.pdf"},{"title":"人民网科技频道：几起网络反映论文涉嫌造假调查结果公布","url":"https://scitech.people.com.cn/BIG5/n1/2021/0122/c1007-32008174.html"}],"key":"most_2021_notice","name":"2021年科技部论文涉嫌造假调查通报（曹雪涛等）","slug":"notice-2021","placements":[{"year":2021,"month":1}],"wordcloud":[["曹雪涛",2],["裴钢",2],["李红良",2],["图片误用",2],["曹雪涛等",1],["耿美玉",1],["饶毅",1],["科技部通报",1],["论文造假",1],["科研诚信",1],["调查处理",1],["中科院裴钢院士",1],["经约一年调查",1],["被批评教育",1],["核心问题",1],["团队管理漏洞",1],["造假",1],["的边界认定争议",1],["官方调查程序",1],["逐步规范化",1],["处理梯度",1],["批评教育",1],["诫勉谈话",1],["体现分层问责",1],["具有标志意义",1]]},{"keywords":["基因编辑","临床试验","新华医院","6岁女孩","血栓性微血管病","Science","Retraction Watch","伦理审查","CHD3","Snijders Blok-Campeau综合征"],"summary":"2025年3月24日，一名患Snijders Blok-Campeau综合征（由CHD3基因突变导致、非致命性神经发育障碍）的6岁女孩，在上海交通大学医学院附属新华医院接受了脑定向基因编辑实验性治疗，一周内死于血栓性微血管病。该试验由上海交通大学医学院神经科学家Qiu Zilong团队主导，号称世界首例同类人体试验，女孩是唯一受试者。2026年7月23日，《科学》（Science）杂志与学术监督机构Retraction Watch联合发布调查报告揭露此事件：此前非人灵长类安全研究已观察到肝肾损伤但未披露，医院内部伦理审查结论认定女孩死亡与治疗“确定相关”。事件引发对基因编辑临床试验伦理监管的全球关注。","timeline":[{"date":"2025-03-24","desc":"6岁女孩（患Snijders Blok-Campeau综合征，由CHD3基因突变导致，症状为发育迟缓、肌张力减退、语言障碍，但非致命性疾病）在上海交通大学医学院附属新华医院接受脑定向基因编辑实验性治疗，为全球首例同类人体试验，女孩为唯一受试者。"},{"date":"2025-03","desc":"女孩在接受治疗后一周内因血栓性微血管病（罕见但可能致命的微血栓形成疾病，可损伤肾脏、大脑等器官）死亡。"},{"date":"2025","desc":"新华医院内部伦理审查结论认定女孩死亡与治疗“确定相关”（definitely related）。"},{"date":"2026-07-23","desc":"《科学》（Science）杂志与学术监督机构Retraction Watch联合发布调查报告，揭露该试验此前在非人灵长类安全性研究中已观察到肝肾损伤但未在人体试验前充分披露。"},{"date":"2026-08-06","desc":"《中国日报》（China Daily）等媒体跟进报道，事件引发对基因编辑临床试验伦理审查与受试者保护的广泛讨论。"}],"ethics":"核心问题：1）在安全性数据不足（非人灵长类研究已发现肝肾损伤）的情况下对儿童开展首例人体基因编辑试验；2）儿童（未成年人、非致命性疾病患者）作为受试者的风险收益比严重失衡；3）唯一受试者设计缺乏科学对照与风险分散；4）临床试验前安全信号未充分披露，知情同意完整性存疑；5）医院内部伦理审查虽认定死亡与治疗相关，但暴露研究伦理监管滞后。","sources":[{"title":"中国日报（China Daily Global Edition）：Death of girl during gene-editing clinical trial raises ethical concerns","url":"https://global.chinadaily.com.cn/a/202608/06/WS6a73dfe6a310986e2b46935d.html"}],"key":"shanghai_gene_trial","name":"上海新华医院基因编辑临床试验致死案","slug":"shanghai-gene-trial","placements":[{"year":2025,"month":3},{"year":2026,"month":7},{"year":2026,"month":8}],"wordcloud":[["science",2],["blok",2],["基因编辑",1],["临床试验",1],["新华医院",1],["血栓性微血管病",1],["retraction",1],["watch",1],["伦理审查",1],["snijders",1],["女孩是唯一受试者",1],["科学",1],["确定相关",1],["核心问题",1],["在安全性数据不足",1],["儿童",1],["未成年人",1],["非致命性疾病患者",1]]},{"keywords":["科技部通报","论文造假","119篇","293名责任人","科研诚信","撤稿","查处","学术不端"],"summary":"2021年12月3日，科技部通报2021年集中查处的一批论文造假案件：年内分12批共通报235篇涉嫌造假论文，其中12月批次集中处理119篇，涉及293名责任人，覆盖多所高校、医院与科研机构，是科研诚信建设联席会议机制常态化运行的重要节点。","timeline":[{"date":"2021-01-21","desc":"科技部通报曹雪涛等学者论文涉嫌造假调查处理结果，全年科研诚信调查通报由此展开。"},{"date":"2021-12-03","desc":"科技部通报12月批次119篇论文造假查处结果，涉及293名责任人；据中工网等媒体报道，2021年科技部全年共分12批通报235篇造假论文查处情况。"}],"ethics":"核心问题：1）论文造假（代写代投、买卖论文、伪造篡改数据、图片不当操纵）仍是医学科研诚信突出问题；2）科技部以集中分批通报方式形成常态化高压态势，覆盖高校、医院与科研院所；3）通报处理涉及取消职称、撤销学位、追回奖金等梯度措施，强化‘一票否决’式问责导向。","sources":[{"title":"中工网：科技部通报119篇论文造假 涉及293名责任人","url":"https://www.workercn.cn/c/2021-12-03/6745942.shtml"}],"key":"most_2021_119","name":"2021年科技部通报119篇造假论文查处结果","slug":"notice-2021-119","placements":[{"year":2021,"month":12}],"wordcloud":[["科技部通报",2],["论文造假",2],["119篇",2],["293名责任人",2],["科研诚信",1],["撤稿",1],["查处",1],["学术不端",1]]},{"keywords":["科技部通报","医学科研诚信","46起案件","青岛大学","论文造假","图片篡改","调查处理","科研诚信"],"summary":"2022年1月27日，科技部通报46起教育、医疗机构医学科研诚信案件调查处理结果。通报案件多涉及论文图片不当操纵、数据造假、代写代投等行为，其中青岛大学及其附属医院相关案件占18起，成为该批次通报重点；相关责任人被取消科技计划项目申报资格、撤销职称或学位等。","timeline":[{"date":"2022-01-27","desc":"科技部发布46起教育、医疗机构医学科研诚信案件调查处理结果通报，涉及青岛大学（18起）等多家单位，处理含取消科技计划项目申报资格、撤销职称、撤销学位等。"}],"ethics":"核心问题：1）医学科研诚信案件在高校附属医院集中高发，暴露临床科研考核压力与诚信教育缺位；2）通报首次以‘医疗机构’为主体成批次披露，体现监管向医疗卫生系统延伸；3）处理梯度覆盖取消项目申报资格、撤销职称、撤销学位等，问责链条趋于完整。","sources":[{"title":"科技日报：科技部通报46起医学科研诚信案件","url":"https://iswc.cas.cn/zt_171958/kycxjs/202503/P020250325620470453453.pdf"}],"key":"most_2022_46","name":"2022年科技部通报46起医学科研诚信案件","slug":"notice-2022-46","placements":[{"year":2022,"month":1}],"wordcloud":[["科技部通报",2],["医学科研诚信",2],["46起案件",2],["青岛大学",2],["论文造假",1],["图片篡改",1],["调查处理",1],["科研诚信",1]]},{"keywords":["刘翔峰","湘雅二医院","过度医疗","故意伤害","受贿","职务侵占","17年","医疗伦理"],"summary":"2022年8月，中南大学湘雅二医院副主任医师刘翔峰被指对患者实施过度医疗等问题，经网络举报发酵后，湖南省卫健委、中南大学成立联合调查组，长沙市监委对其立案调查。法院查明：刘翔峰为牟取额外手术费用，单独或伙同罗原灯夸大患者病情、虚构病征，对6名不具备手术指征的患者实施手术，致5人重伤（九级伤残）、1人轻伤；并利用职务便利受贿、收受回扣、侵占手术耗材。2024年10月31日，长沙市中级人民法院一审宣判：数罪并罚判处刘翔峰有期徒刑17年，并处罚金42万元；同案罗原灯获刑7年。","timeline":[{"date":"2022-08-19","desc":"湖南省卫健委、中南大学针对网民反映的刘翔峰问题成立联合调查组，组织6名医学专家对其医疗行为进行专业核查。"},{"date":"2022-08-25","desc":"长沙市监委通报：湖南省创伤急救医学中心原副主任、中南大学湘雅二医院副主任医师刘翔峰涉嫌严重违法，接受监察调查。"},{"date":"2024-10-31","desc":"长沙市中级人民法院一审公开宣判：刘翔峰以故意伤害罪判10年、受贿罪判3年（罚金20万）、非国家工作人员受贿罪判3年（罚金12万）、职务侵占罪判3年（罚金10万），数罪并罚决定执行有期徒刑17年、罚金42万元；同案罗原灯决定执行有期徒刑7年、罚金10万元；犯罪所得予以追缴。"}],"ethics":"核心问题：1）临床医生为牟利夸大病情、虚构病征、实施无指征手术，直接违背医疗伦理‘不伤害’原则；2）受贿、回扣与职务侵占交织，暴露医院耗材采购、手术审批与绩效管理漏洞；3）该案以故意伤害罪定性，确立了‘过度医疗致害’可入刑的司法先例；4）网络举报-联合调查-监委介入的处置链条，成为医疗领域监督典型案例。","sources":[{"title":"央视网：刘翔峰案一审宣判","url":"https://big5.cctv.com/gate/big5/news.cctv.com/2024/10/31/ARTI832mF6zkfsjphQU0dCUC241031.shtml"},{"title":"光明网（今日头条）：夸大患者病情、虚构病征！刘翔峰，被判17年","url":"https://www.toutiao.com/article/7431855218037375507/"}],"key":"liu_xiangfeng","name":"湘雅二医院刘翔峰案","slug":"liu-xiangfeng","placements":[{"year":2022,"month":8},{"year":2024,"month":10}],"wordcloud":[["刘翔峰",2],["湘雅二医院",2],["过度医疗",2],["故意伤害",2],["受贿",1],["职务侵占",1],["17年",1],["医疗伦理",1]]},{"keywords":["科技部通报","高校","科研诚信","论文造假","不当署名","遵义医科大学","大连医科大学","桂林医学院"],"summary":"2022年11月，科技部官网集中发布一批高校医学科研诚信案件调查处理结果通报，涉及遵义医科大学附属医院、大连医科大学附属第二医院、桂林医学院附属医院等多家医学院校及其附属医院，违规行为涵盖论文造假、图片不当操纵、不当署名等，相关责任人被取消科技计划项目申报资格、通报批评并限期整改。","timeline":[{"date":"2022-11-07","desc":"科技部官网发布部分高校医学科研诚信案件调查处理结果汇总通报，涉及多所医学院校及附属医院，处理含取消科技计划项目申报资格、通报批评等。"}],"ethics":"核心问题：1）医学院校及其附属医院论文不端行为持续多发，需从研究生培养、导师责任与考核评价制度层面治理；2）科技部年度多次通报形成常态化监管；3）高校自查与部委通报相结合，推动科研诚信建设向基层延伸。","sources":[{"title":"科技部：部分高校医学科研诚信案件调查处理结果通报","url":"https://www.most.gov.cn/zxgz/kycxjs/kycxgzdt/202211/t20221109_183367.html"}],"key":"most_2022_uni","name":"2022年科技部通报高校医学科研诚信案件","slug":"notice-2022-uni","placements":[{"year":2022,"month":11}],"wordcloud":[["科技部通报",2],["高校",2],["科研诚信",2],["论文造假",2],["不当署名",1],["遵义医科大学",1],["大连医科大学",1],["桂林医学院",1]]},{"keywords":["伦理审查办法","国家卫健委","科技部","医学研究","生命科学","伦理审查委员会","知情同意","制度建设"],"summary":"2023年2月18日，国家卫生健康委、教育部、科技部、国家中医药局联合印发《涉及人的生命科学和医学研究伦理审查办法》（国卫科教发〔2023〕4号），2月28日公开。该办法统一了医疗卫生机构、高等学校、科研院所开展涉及人的生命科学和医学研究的伦理审查原则与制度要求，明确伦理审查委员会设置、备案程序及国家医学研究登记备案信息系统上传要求，是对原《涉及人的生物医学研究伦理审查办法》的全面升级。","timeline":[{"date":"2023-02-18","desc":"国家卫生健康委、教育部、科技部、国家中医药局联合印发《涉及人的生命科学和医学研究伦理审查办法》（国卫科教发〔2023〕4号）。"},{"date":"2023-02-28","desc":"办法全文在中国政府网公开发布；要求已设伦理审查委员会机构在规定时限内完成备案并在国家医学研究登记备案信息系统上传信息。"}],"ethics":"核心问题：1）将伦理审查范围从‘生物医学研究’扩展至‘涉及人的生命科学和医学研究’，覆盖生物样本、健康数据等研究活动；2）确立伦理审查委员会备案制与国家医学研究登记备案信息系统，推动全国伦理审查可追溯、可监管；3）重申知情同意、隐私保护、公正与不伤害原则，是2020年代医学伦理治理的基础性制度文件。","sources":[{"title":"中国政府网：关于印发涉及人的生命科学和医学研究伦理审查办法的通知","url":"https://www.gov.cn/zhengce/zhengceku/2023-02/28/content_5743658.htm"}],"key":"ethics_measures_2023","name":"涉及人的生命科学和医学研究伦理审查办法（2023）","slug":"ethics-measures-2023","placements":[{"year":2023,"month":2}],"wordcloud":[["伦理审查办法",2],["国家卫健委",2],["科技部",2],["医学研究",2],["生命科学",1],["伦理审查委员会",1],["知情同意",1],["制度建设",1]]},{"keywords":["Hindawi","大规模撤稿","论文工厂","中国学者","操纵同行评审","教育部自查","学术声誉","撤稿"],"summary":"2022年9月，国际学术出版机构Hindawi宣布撤稿2020年8月之后发表的511篇论文；2023年4月再撤1200篇；2023年6月两次合计撤稿894篇，其中中国学者占比约96.6%。截至2023年8月5日，Hindawi累计撤回中国学者论文1866篇，涉及浙江大学、苏州大学、首都医科大学、南京医科大学等多所高校。撤稿主因是‘论文工厂’操纵同行评审、数据造假与代写代投。据《自然》杂志报道，2023年全球撤稿超1万篇创历史纪录，其中Hindawi占8000余篇。教育部科技司要求高校开展撤稿论文自查，武汉大学、山东大学等多所高校全面启动撤稿排查。","timeline":[{"date":"2022-09","desc":"Hindawi经内部审查宣布撤稿2020年8月之后发表的511篇文章。"},{"date":"2023-04","desc":"Hindawi再次宣布撤稿1200篇论文。"},{"date":"2023-06-21","desc":"Hindawi旗下杂志撤回498篇论文，其中487篇主要由中国学者参与。"},{"date":"2023-06-28","desc":"Hindawi再次撤回396篇论文，其中377篇主要由中国学者参与；当月两次合计894篇，中国学者占比约96.6%。"},{"date":"2023-08-05","desc":"据南方日报等统计，Hindawi累计撤回中国学者论文1866篇，涉及浙江大学、苏州大学、首都医科大学、南京医科大学等高校。"},{"date":"2023-12-29","desc":"教育部科技司要求开展撤稿论文自查；河南省教育厅印发《关于开展撤稿论文自查和重点核查工作的通知》。"}],"ethics":"核心问题：1）‘论文工厂’产业链（代写代投、操纵同行评审）规模化冲击国际学术出版体系，中国学者涉事规模引发学术声誉危机；2）撤稿高发暴露部分高校科研评价‘唯论文’导向与导师把关缺位；3）教育部部署撤稿自查，推动高校将撤稿情况纳入科研诚信档案；4）2023年全球撤稿超万篇创纪录，成为国际科研诚信治理的标志性年份。","sources":[{"title":"南方+：涉嫌学术不端！15所高校被通报（含Hindawi撤稿统计）","url":"https://static.nfnews.com/content/202404/15/c8785080.html"},{"title":"河南交通职业技术学院科研外事：2023年论文撤稿超1万篇（Nature报道）","url":"http://kyc.hncc.edu.cn/info/1009/3137.htm"}],"key":"hindawi_retraction","name":"2023年国际期刊大规模撤稿事件（Hindawi等）","slug":"hindawi-retraction","placements":[{"year":2022,"month":9},{"year":2023,"month":4},{"year":2023,"month":6},{"year":2023,"month":8}],"wordcloud":[["Hindawi",2],["大规模撤稿",2],["论文工厂",2],["中国学者",2],["操纵同行评审",1],["教育部自查",1],["学术声誉",1],["撤稿",1]]},{"keywords":["国家自然科学基金委","24起","科研不端","伪造数据","代写代投","取消资格","通报批评","基金监督"],"summary":"2023年11月底，国家自然科学基金委员会通报24起科研不端案件处理结果，案件涉及伪造篡改实验数据、委托第三方机构投稿、不当署名、标注不实基金项目等行为，涉事人员包括滨州医学院刘峻滔（时为山东大学在职博士研究生）、山东大学周海斌、中南大学唐发清等，处理措施包括取消国家自然科学基金项目申请和参与申请资格4-5年、撤销项目、追回已拨资金、通报批评等。","timeline":[{"date":"2023-08-21","desc":"基金委监督委员会六届一次会议审议相关案件，取消滨州医学院刘峻滔基金项目申请资格4年（2023年8月21日至2027年8月20日），给予通报批评。"},{"date":"2023-11-29","desc":"据中国青年报报道，国家自然科学基金委官网集中通报24起科研不端案件及处理结果。"}],"ethics":"核心问题：1）伪造篡改实验数据、委托第三方公司完成实验并代投论文，反映部分研究生培养环节数据管理失守；2）基金委以委务会议审定+官网通报方式公开处理结果，监督程序规范化；3）处理梯度（撤销项目、追回资金、取消资格数年、通报批评）成为基金监督标准范式。","sources":[{"title":"中国青年报（腾讯新闻）：国家自然科学基金委员会通报24起科研不端案件","url":"https://news.qq.com/rain/a/20231129A0ARE700"}],"key":"nsfc_2023_24","name":"2023年国家自然科学基金委通报24起科研不端案件","slug":"nsfc-2023-24","placements":[{"year":2023,"month":11}],"wordcloud":[["国家自然科学基金委",2],["24起",2],["科研不端",2],["伪造数据",2],["代写代投",1],["取消资格",1],["通报批评",1],["基金监督",1]]},{"keywords":["负责任研究行为","科技部","规范指引","科研诚信","伦理审查","数据管理","成果署名","同行评议"],"summary":"2023年12月21日，科技部发布《负责任研究行为规范指引（2023）》，从研究选题与实施、数据管理、成果署名、同行评议、科技伦理审查等方面对科研人员、评审专家、机构管理人员等提出系统性行为规范要求，是继2016年《国家科技计划（专项、基金等）严重失信行为记录暂行规定》之后科研诚信制度体系的重要补充。","timeline":[{"date":"2023-12-21","desc":"科技部发布《负责任研究行为规范指引（2023）》，覆盖研究实施、数据管理、署名、评议、伦理审查等全流程。"}],"ethics":"核心问题：1）以‘负责任研究’理念细化科研全流程行为边界，强化事前规范而非事后惩戒；2）将科技伦理审查要求纳入指引，与《科技伦理审查办法（试行）》衔接；3）为高校、科研机构制定内部诚信规范提供国家层面参照。","sources":[{"title":"科技部：负责任研究行为规范指引（2023）","url":"https://www.most.gov.cn/kjbgz/202312/t20231221_189240.html"}],"key":"guide_2023","name":"负责任研究行为规范指引（2023）","slug":"guide-2023","placements":[{"year":2023,"month":12}],"wordcloud":[["负责任研究行为",2],["科技部",2],["规范指引",2],["科研诚信",2],["伦理审查",1],["数据管理",1],["成果署名",1],["同行评议",1]]},{"keywords":["国家自然科学基金委","2024年第一批","科研不端","图片不当操纵","撤销项目","追回资金","取消资格","医学领域"],"summary":"2024年4月12日，国家自然科学基金委员会发布2024年科研不端行为案件处理结果通报（第一批次）。通报涉及医学领域案件11件，如徐州医科大学佟敬山等论文存在图片不当操纵和图片使用混乱问题，江南大学张聪等存在买卖论文、未经同意使用他人署名问题；处理措施包括撤销基金项目、追回已拨资金、取消项目申请和参与申请资格5年、通报批评等。","timeline":[{"date":"2024-04-12","desc":"国家自然科学基金委发布2024年第一批次科研不端行为案件处理结果通报，涉医学领域11件，处理含撤销项目、追回资金、取消资格5年等。"}],"ethics":"核心问题：1）图片不当操纵（重复使用、拼接、划痕钢尺等）成为医学论文不端高发形态；2）涉事论文常被列入基金项目进展报告或申请书，基金监督与论文诚信联动审查；3）基金委批次化通报机制成型，处理结果公开透明。","sources":[{"title":"央视网：国家自然科学基金委通报今年第1批学术不端案件","url":"https://big5.cctv.com/gate/big5/news.cctv.com/2024/04/13/ARTI8cp7xibIiJSEjIz1HLXH240413.shtml"}],"key":"nsfc_2024_b1","name":"2024年国家自然科学基金委通报科研不端案件（第一批）","slug":"nsfc-2024-b1","placements":[{"year":2024,"month":4}],"wordcloud":[["国家自然科学基金委",2],["2024年第一批",2],["科研不端",2],["图片不当操纵",2],["撤销项目",1],["追回资金",1],["取消资格",1],["医学领域",1]]},{"keywords":["科技部通报","医学科研诚信","9所高校","17所附属医院","超百人处理","伪造篡改","代写代投","撤销博士学位"],"summary":"2025年2月，科技部通报部分教育、医疗机构医学科研诚信案件调查处理结果，涉及9所高校、17所附属医院，超百人被处理：近20人被取消副主任医师、副教授等职称，7人被撤销博士学位，10人终身不得申请认定研究生导师资格，4人终身取消科技计划项目申报资格，多人被暂停研究生招生资格。违规行为包括伪造篡改数据图片、编造研究过程、不当署名、代写代投、买卖论文等，涉事单位含哈尔滨医科大学附属肿瘤医院（于凯江、黄巍）、哈尔滨医科大学附属第一医院（刘万鹏、金承俊）等。","timeline":[{"date":"2025-02","desc":"科技部通报部分教育、医疗机构医学科研诚信案件调查处理结果，涉及9所高校、17所附属医院，超百人被处理。"},{"date":"2025-03-05","desc":"福建卫生职业技术学院科研处转发通报全文，披露哈尔滨医科大学附属肿瘤医院黄巍/于凯江（篡改数据、不当署名）、附属第一医院金承俊/刘万鹏（代写代投、买卖论文）等案件处理详情。"}],"ethics":"核心问题：1）医院临床人员论文不端（伪造数据、买卖论文、代写代投）集中曝光，暴露临床晋升考核压力；2）处理首次大规模触及职称、导师资格与学位，形成‘终身禁入’等顶格措施；3）教育与医疗系统联动通报，显示科研诚信治理向医疗卫生行业纵深推进。","sources":[{"title":"福建卫生职业技术学院（转发科技部通报）","url":"https://www.fjwzy.cn/kyc/info/1120/1501.htm"}],"key":"most_2025_medical","name":"2025年科技部通报医学科研诚信案件","slug":"most-2025-medical","placements":[{"year":2025,"month":2}],"wordcloud":[["科技部通报",2],["医学科研诚信",2],["9所高校",2],["17所附属医院",2],["超百人处理",1],["伪造篡改",1],["代写代投",1],["撤销博士学位",1]]},{"keywords":["国家自然科学基金委","2025年第一批","评审专家","泄露评审信息","打探评审信息","永久取消资格","科研不端","基金监督"],"summary":"2025年4月11日，国家自然科学基金委员会发布2025年第1批科研不端行为案件处理结果通报。案件涉及评审环节违规：上海某高校特聘主任医师边中启作为基金项目评审专家，在2023年通讯评审期间违反评审专家行为规范与保密管理规定，被永久取消评审专家资格及项目申请和参与申请资格（2024年11月12日起），并予通报批评；浙江某高校王发明在评审期间违规打探评审信息，其项目被撤销、追回已拨资金，取消申请资格5年。","timeline":[{"date":"2025-04-11","desc":"国家自然科学基金委发布2025年第1批案件通报：边中启违规泄露评审信息被永久取消评审专家与申请资格，王发明违规打探评审信息被撤销项目、取消资格5年。"}],"ethics":"核心问题：1）评审环节利益冲突与信息泄露首次成为通报重点，显示基金委强化评审廉洁治理；2）‘永久取消资格’顶格处理释放强烈信号；3）通讯评审保密制度（回避、承诺书、行为规范）执行刚性增强。","sources":[{"title":"国家自然科学基金委员会：案件通报（2025年第1批）","url":"https://www.nsfc.gov.cn/p1/2812/2816/83174.html"}],"key":"nsfc_2025_b1","name":"2025年国家自然科学基金委通报科研不端案件（第一批）","slug":"nsfc-2025-b1","placements":[{"year":2025,"month":4}],"wordcloud":[["国家自然科学基金委",2],["2025年第一批",2],["评审专家",2],["泄露评审信息",2],["打探评审信息",1],["永久取消资格",1],["科研不端",1],["基金监督",1]]},{"keywords":["国家自然科学基金委","2025年第二批","21起","25人","买卖实验数据","买卖论文","抄袭申请书","严正声明"],"summary":"2025年6月13日，国家自然科学基金委员会发布2025年第2批科研不端行为案件处理结果通报，共21起案例、25人被通报批评，涉及买卖实验研究数据（多发生在医院或医学院校）、买卖论文、图片伪造篡改、抄袭他人基金项目申请书内容等行为，如吉林某医院李泽发表论文存在买卖实验研究数据问题并被列入基金项目申请书，天津某高校张宁宁2024年申请中抄袭他人申请书内容等。同日基金委发布《严正声明》，提醒警惕不法单位或个人冒用基金委标识售卖、有偿修改基金项目申请书。","timeline":[{"date":"2025-06-13","desc":"国家自然科学基金委发布2025年第2批案件通报（21起、25人被通报批评），同日发布《严正声明》警示代写机构冒用基金委名义售卖申请书。"},{"date":"2025-06-18","desc":"中国新闻网报道：21起案例涉及买卖实验研究数据、买卖论文、图片伪造篡改、抄袭基金申请书等，其中半数以上涉‘抄袭他人基金项目申请书内容’。"}],"ethics":"核心问题：1）‘买卖实验研究数据’在医学类案例中高发，数据交易黑产向科研领域渗透；2）抄袭他人基金申请书成新形态不端，基金委以《严正声明》公开切割代写产业链；3）通报+声明组合拳，显示基金委对申请书代写、售卖乱象的系统性治理。","sources":[{"title":"国家自然科学基金委员会：案件通报（2025年第2批）","url":"https://www.nsfc.gov.cn/p1/2812/2816/83175.html"},{"title":"中国新闻网：20余人因科研不端被通报，涉买卖实验数据等问题","url":"https://m.chinanews.com/wap/detail/cht/zw/10434320.shtml"}],"key":"nsfc_2025_b2","name":"2025年国家自然科学基金委通报科研不端案件（第二批）","slug":"nsfc-2025-b2","placements":[{"year":2025,"month":6}],"wordcloud":[["国家自然科学基金委",2],["2025年第二批",2],["21起",2],["25人",2],["买卖实验数据",1],["买卖论文",1],["抄袭申请书",1],["严正声明",1]]},{"keywords":["国家自然科学基金委","2026年第一批","代写代投","抄袭剽窃","虚假伦理审批件","买卖论文","科研不端","通报批评"],"summary":"2026年1月24日，国家自然科学基金委员会发布2026年第1批科研不端行为案件处理结果通报。通报案件涉及代写代投、抄袭剽窃、买卖论文、提供虚假伦理审批件等行为：如甘肃某医院杜鹏在2025年基金项目申报中提供虚假伦理审批件，北京某高校张红宇购买代写基金项目申请书，浙江某高校易莹、山东某高校田萍等抄袭他人基金项目申请书内容；相关责任人被撤销项目申请、取消资格数年并通报批评。","timeline":[{"date":"2026-01-24","desc":"国家自然科学基金委发布2026年第1批案件通报，涉代写代投、抄袭剽窃、买卖论文、虚假伦理审批件等多起不端行为，含甘肃某医院杜鹏提供虚假伦理审批件案。"}],"ethics":"核心问题：1）‘提供虚假伦理审批件’首次出现在基金委通报中，显示伦理审查材料真实性成为监管新焦点，与《涉及人的生命科学和医学研究伦理审查办法》形成呼应；2）代写代投、买卖论文产业链仍在蔓延，需联合公安、网信等部门协同治理；3）批次化通报持续运行，科研诚信监督进入常态化。","sources":[{"title":"中国新闻网：国家自然科学基金委通报2026年第一批科研不端案件","url":"https://www.chinanews.com.cn/gn/2026/01-24/10558095.shtml"}],"key":"nsfc_2026_b1","name":"2026年国家自然科学基金委通报科研不端案件（第一批）","slug":"nsfc-2026-b1","placements":[{"year":2026,"month":1}],"wordcloud":[["国家自然科学基金委",2],["2026年第一批",2],["代写代投",2],["抄袭剽窃",2],["虚假伦理审批件",1],["买卖论文",1],["科研不端",1],["通报批评",1]]},{"keywords":["国家卫健委","论文工厂","第一批","科研失信","代写代投","买卖论文","科技伦理审查","联合惩戒"],"summary":"2026年2月底，国家卫健委印发《加强医学科研诚信专项治理的工作方案》；4月9日，国家卫健委对各级卫生健康行政部门所属医疗卫生机构查实的部分涉“论文工厂”科研诚信案件调查处理结果予以公开通报（第一批），共10起，涉及天津、辽宁、江苏、山东、四川、陕西、甘肃7地医疗机构。失信行为涵盖代写代投、买卖论文、篡改实验数据、无实质学术贡献署名、以弄虚作假方式获得科技伦理审查批准、伪造通讯作者联系邮箱等；论文通讯作者和第一作者成为重点惩戒对象，多人被10年内禁止承担或参与财政性资金支持的科技活动、10年内取消科技奖励与职称晋升等申报资格、记入科研诚信严重失信行为数据库。","timeline":[{"date":"2026-02","desc":"国家卫健委印发《加强医学科研诚信专项治理的工作方案》，提出加大科研失信惩处力度、联合惩戒等治理措施。"},{"date":"2026-04-09","desc":"国家卫健委公开通报第一批涉“论文工厂”科研诚信案件调查处理结果，共10起，涉及7地医疗机构，多人被10年内禁止承担财政性资金支持的科技活动。"}],"ethics":"核心问题：1）医学领域“论文工厂”产业链（代写代投、买卖论文、数据交易）首次被国家卫健委成批次公开通报；2）“以弄虚作假方式获得科技伦理审查批准”列入通报，伦理审查材料造假成为监管新重点；3）10年禁入+记入科研诚信严重失信行为数据库，形成“一处失信、处处受限”的联合惩戒机制。","sources":[{"title":"人民网（金台资讯）：国家卫健委公开通报部分科研失信行为","url":"https://www.toutiao.com/article/7626724183888527915/"},{"title":"第一财经（证券时报网）：多篇论文造假，通讯作者将10年不得参与财政性科技活动","url":"https://www.stcn.com/article/detail/3739850.html"}],"key":"nhc_2026_b1","name":"2026年国家卫健委通报论文工厂科研失信案件（第一批）","slug":"nhc-2026-b1","placements":[{"year":2026,"month":4}],"wordcloud":[["国家卫健委",2],["论文工厂",2],["第一批",2],["科研失信",2],["代写代投",1],["买卖论文",1],["科技伦理审查",1],["联合惩戒",1]]},{"keywords":["耿同学","学术打假","论文造假","王平","同济大学","顶刊论文","杰青","免职","数据造假","零容忍"],"summary":"2026年4月起，科普博主“耿同学讲故事”（本名耿洪伟，吉林大学生物学本硕、北京航空航天大学博士肄业）连续实名举报多所高校顶尖学者发表于《自然》及子刊的论文数据造假，掀起中国学术界“打假风暴”。4月9日举报同济大学生命科学与技术学院院长王平团队2025年1月发表于《自然》的论文存在规律性人为编造数据（整列数据末位全是5、两列数据精确相差0.3、小鼠体重全部精确到小数点后两位等）；5月6日同济大学通报确认学术不端，王平被免去院长职务、专业技术岗位等级降低两级、取消岗位聘用及科研项目申报等资格24个月，第一作者金佳丽被解除聘用关系。此后耿同学相继举报南开大学生命科学学院院长陈佺（4月25日）、中山大学肿瘤防治中心副主任康铁邦（5月4日）、中山大学生命科学学院副院长邝栋明（5月6日）、上海大学转化医学研究院院长苏佳灿（5月12日）等，南开大学、中山大学、上海大学均成立调查组。6月12日上海大学公布调查结果：确认1张图表实验数据伪造，解除共同第一作者周某某聘用关系，免去苏某某院长职务并暂停招收研究生12个月。8月28日，国家自然科学基金委发布2026年第2批通报（31起），王平、陈佺、苏佳灿、邝栋明等被撤销项目、追回经费并取消申请资格3至7年，系首次有杰青项目被撤销。截至8月底，耿同学已公开打假9名杰青、涉及顶刊论文超13篇；9月14日又举报北京大学医学部张耀华。新华社发文《顶着耀眼头衔，论文数据荒诞粗糙》对此评论。","timeline":[{"date":"2026-04-09","desc":"科普博主“耿同学讲故事”发布视频，实名举报同济大学生命科学与技术学院院长王平团队发表于《自然》的论文数据造假，开启学术打假风暴。"},{"date":"2026-04-16","desc":"同济大学发布情况说明，称已成立调查组并启动调查程序。"},{"date":"2026-04-25","desc":"耿同学举报南开大学生命科学学院院长陈佺发表于《自然·癌症》的论文补充材料64组数据小数点后两位完全一致等异常；5月1日南开大学发布通报成立调查组。"},{"date":"2026-05-04","desc":"耿同学举报中山大学肿瘤防治中心副主任、杰青康铁邦论文疑似数据造假。"},{"date":"2026-05-06","desc":"同济大学公布处理结果：认定涉事论文存在学术不端，免去王平生科院院长职务、降低专业技术岗位等级两级、取消岗位聘用等资格24个月；第一作者金佳丽被解除与学校高等研究院的聘用关系。"},{"date":"2026-05-06","desc":"耿同学举报中山大学生命科学学院副院长邝栋明论文疑似数据造假。"},{"date":"2026-05-12","desc":"耿同学举报上海大学转化医学研究院院长、长江学者苏佳灿发表于《自然·纳米技术》子刊的论文数据造假（一组数据为等差数列），上海大学当日成立调查组。"},{"date":"2026-06-12","desc":"上海大学公布调查结果：确认受质疑论文1张图表存在数据伪造（由共同第一作者、在站博士后周某某完成），解除周某某聘用关系；免去苏某某转化医学研究院院长等职务，取消其职务晋升、科研项目申报、评奖评优资格12个月并暂停招收研究生12个月；魏某、白某予以诫勉处理。"},{"date":"2026-07-02","desc":"耿同学继续举报中山大学香港高等研究院院长徐安龙、中大附属第七医院副院长张常华论文数据造假。"},{"date":"2026-08-28","desc":"国家自然科学基金委发布2026年第2批案件通报（31起），王平、陈佺、苏佳灿、邝栋明等在列：金佳丽取消申请资格7年，王平、陈佺、苏佳灿各5年，邝栋明、万文华各3年，多位杰青项目被撤销并追回百万级科研经费，系首次有杰青项目被撤销。"},{"date":"2026-09-14","desc":"耿同学发布最新打假视频，举报北京大学医学部长聘副教授张耀华论文数据造假，北大尚未公开回应。"}],"ethics":"核心问题：1）顶刊论文数据造假手段粗糙却通过同行评审，暴露期刊审稿对实验数据真实性核查缺失；2）通讯作者（院长、杰青）对团队论文数据“失察失管”的问责机制确立，同济大学对院长免职降级并限制24个月，处理速度与力度创高校查处学术不端纪录；3）国家自然科学基金委首次撤销杰青项目并追回百万级经费，对高层次人才学术不端的顶格问责成为标志性事件；4）民间科普博主实名打假成为学术监督新力量，促使多所高校启动论文自查与原始数据复核；5）新华社等官媒评论“顶着耀眼头衔，论文数据荒诞粗糙”，引发对“唯论文”评价体系与科研诚信治理的全国性讨论。","sources":[{"title":"广州日报新花城：他们求我不要曝光，我说没有办法（耿同学打假报道）","url":"https://huacheng.gz-cmc.com/pages/2026/05/18/299e2a3dd6cb4bd5b19b506165823153.html"},{"title":"南方+（南方周末）：肄业博士连打5位名校教授：顶刊翻车，引发连锁震荡","url":"https://www.nfnews.com/content/voAp5l2m6R.html"},{"title":"知识分子（腾讯新闻）：退学博士耿同学，如何掀起中国学术界这一轮打假风暴","url":"https://news.qq.com/rain/a/20260521A02CSL00"},{"title":"光明网：上海大学教师论文数据存疑问题通报","url":"https://m.gmw.cn/2026-06/12/content_1304493856.htm"}],"key":"geng_2026_dafake","name":"2026年“耿同学”学术打假风暴（顶刊论文造假连环举报）","slug":"geng-2026-dafake","placements":[{"year":2026,"month":4},{"year":2026,"month":5},{"year":2026,"month":6},{"year":2026,"month":8},{"year":2026,"month":9}],"wordcloud":[["耿同学",2],["学术打假",2],["论文造假",2],["王平",2],["同济大学",2],["顶刊论文",1],["杰青",1],["免职",1],["数据造假",1],["零容忍",1]]},{"keywords":["国家卫健委","论文工厂","第二批","买卖实验数据","北京妇产医院","代写代投","科研失信","严重失信数据库"],"summary":"2026年5月15日，国家卫健委公开通报第二批涉“论文工厂”严重学术造假行为调查处理结果，共12起，涉及北京妇产医院（王雁为通讯作者、吉晨为第一作者，论文存在买卖实验研究数据失信行为）、北京老年医院（张艳丽买卖论文）、呼和浩特市第一医院、上海市第一人民医院、南通市第一人民医院、宁波市医疗中心李惠利医院、随州市中心医院、荆州市中心医院、广东省第二人民医院、深圳市罗湖区人民医院等多地医疗机构。失信行为涵盖买卖实验研究数据、买卖论文、代写代投、不当署名、无实质学术贡献署名、虚构同行评议专家及评议意见等；通讯作者王雁被10年内禁止承担或参与科技计划项目等财政性资金支持的科技活动、10年内取消科技奖励与科技人才称号申报资格、3年内取消专业技术职务晋升资格，相关责任人记入科研诚信严重失信行为数据库。","timeline":[{"date":"2026-05-15","desc":"国家卫健委公开通报第二批涉“论文工厂”严重学术造假行为调查处理结果，共12起，涉及北京妇产医院等13家医疗机构，失信行为包括买卖实验研究数据、买卖论文、代写代投、虚构同行评议等。"}],"ethics":"核心问题：1）买卖实验研究数据成为医学论文造假新重灾区，数据交易黑产向医院临床科研渗透；2）医院临床人员为晋升购买论文/数据，暴露临床科研评价“唯论文”导向；3）卫健委批次化通报+严重失信行为数据库联动，推动医学科研诚信治理向医疗机构纵深覆盖。","sources":[{"title":"国家卫健委：关于涉论文工厂严重学术造假行为调查处理结果的通报（第二批）","url":"https://www.nhc.gov.cn/qjjys/ycdtxx/202605/b2095c99c97a44f0b52b39cb32ab9540.shtml"},{"title":"北京日报：涉买卖论文、代写代投，国家卫健委通报12起科研失信行为","url":"https://xinwen.bjd.com.cn/content/s6a06f0e1e4b03fa51a7e48f6.html"}],"key":"nhc_2026_b2","name":"2026年国家卫健委通报论文工厂科研失信案件（第二批）","slug":"nhc-2026-b2","placements":[{"year":2026,"month":5}],"wordcloud":[["国家卫健委",2],["论文工厂",2],["第二批",2],["买卖实验数据",2],["北京妇产医院",1],["代写代投",1],["科研失信",1],["严重失信数据库",1]]},{"keywords":["海南省卫健委","张瑜鸿","买卖论文","冒用基金号","撤销职称","科研失信","医学科研诚信","专项治理"],"summary":"2026年5月20日，海南省卫健委通报张瑜鸿等人违反医学科研诚信建设案件：广东省中医院海南医院职业病管理中心副主任医师张瑜鸿，2017年通过网络联系自称李姓编辑、花费4万元获得3篇论文冠名权（发表于2018年，涉事论文均发表于其任海南省疾病预防控制中心工作期间），未对论文研究作出实质性贡献；同时通过网络获取海南省人民医院苗新普主任医师的国家自然科学基金项目编号，在苗不知情的情况下冒用项目编号。3篇论文曾用于其申报副主任医师职称评审。处理结果：全省通报、科研诚信诫勉谈话；5年内取消科技奖励、科技人才称号和职务职称晋升等资格；撤销利用科研失信行为获得的职务职称；5年内禁止承担或参与科技计划项目等财政性资金支持的科技活动；取消学会学术团体委员资格；记入科研诚信严重失信行为数据库。","timeline":[{"date":"2017","desc":"张瑜鸿通过网络花费4万元购买3篇论文冠名权，并冒用海南省人民医院苗新普主任医师的国家自然科学基金项目编号。"},{"date":"2018","desc":"3篇涉事论文发表，张瑜鸿时任海南省疾病预防控制中心工作；论文后用于其申报副主任医师职称评审。"},{"date":"2026-05-20","desc":"海南省卫健委公开通报张瑜鸿案处理结果：撤销职称、5年内取消科技奖励与职称晋升资格、5年禁入财政性科技活动、记入科研诚信严重失信行为数据库。"}],"ethics":"核心问题：1）医院医生为职称晋升花钱购买论文“冠名权”，反映临床晋升评价对论文数量的刚性依赖；2）冒用他人基金项目编号标注论文，构成虚假标注与不当署名双重失信；3）省级卫健委落实国家《加强医学科研诚信专项治理工作方案》，撤销职称+5年禁入+记入严重失信数据库，显示地方医学科研诚信治理全面铺开。","sources":[{"title":"海南省卫健委：关于对张瑜鸿等人违反医学科研诚信建设案件情况的通报","url":"https://wst.hainan.gov.cn/swjw/xxgk/0200/0202/202605/t20260520_4078492.html"}],"key":"hainan_2026_zhangyh","name":"海南省卫健委通报张瑜鸿买论文冒用基金号案","slug":"hainan-2026-zhangyh","placements":[{"year":2026,"month":5}],"wordcloud":[["海南省卫健委",2],["张瑜鸿",2],["买卖论文",2],["冒用基金号",2],["撤销职称",1],["科研失信",1],["医学科研诚信",1],["专项治理",1]]},{"keywords":["国家卫健委","论文工厂","第三批","编造研究过程","篡改研究记录","终身禁止","江西省人民医院","科研失信"],"summary":"2026年6月，国家卫健委公开通报第三批涉“论文工厂”严重学术造假行为调查处理结果。其中，江西省人民医院邵靓为通讯作者、抚州市第一人民医院李锄云为第一作者的论文（2023年3月31日发表于International Heart Journal，题为Thioredoxin Reductase 2 Synergizes with Cytochrome c, Somatic to Alleviate Doxorubicin-Induced Oxidative Stress in Cardiomyocytes and Mouse Myocardium）存在无实质学术贡献署名、编造研究过程、篡改研究记录等失信行为；邵靓与李锄云被终身禁止承担或参与科技计划（专项、基金等）项目等财政性资金支持的科技活动，终止或撤销利用科研失信行为获得的财政性资金支持、相关学术奖励和荣誉，10年内取消科技奖励、科技人才称号申报资格，追回该论文涉及的科研奖励及版面费资助，记入科研诚信严重失信行为数据库。","timeline":[{"date":"2026-06","desc":"国家卫健委公开通报第三批涉“论文工厂”严重学术造假行为调查处理结果，江西、抚州等地医疗机构人员因编造研究过程、篡改研究记录等被终身禁止参与财政性科技活动。"}],"ethics":"核心问题：1）编造研究过程、篡改研究记录等“软造假”手段进入集中通报视野，显示论文工厂链条由“代写代投”向“过程造假”延伸；2）“终身禁止参与财政性科技活动”成为顶格处罚，威慑力显著升级；3）论文工厂治理由“限期禁入”向“终身禁入”深化，与后续第四批通报形成连续高压态势。","sources":[{"title":"国家卫健委：关于涉论文工厂严重学术造假行为调查处理结果的通报（第三批）","url":"https://www.nhc.gov.cn/qjjys/ycdtxx/202606/b87aeeb83ab542b09827d5586277f95a.shtml"}],"key":"nhc_2026_b3","name":"2026年国家卫健委通报论文工厂科研失信案件（第三批）","slug":"nhc-2026-b3","placements":[{"year":2026,"month":6}],"wordcloud":[["国家卫健委",2],["论文工厂",2],["第三批",2],["编造研究过程",2],["篡改研究记录",1],["终身禁止",1],["江西省人民医院",1],["科研失信",1]]},{"keywords":["国家卫健委","论文工厂","第四批","28起","买卖实验数据","终身禁止","挂名搭车","科研失信"],"summary":"2026年7月10日，国家卫健委公开通报第四批科研失信行为调查处理结果，共28起，涉及数据造假、论文买卖、挂名搭车等问题，覆盖山西白求恩医院（贾俊青、商鹏等买卖实验数据）、江西省人民医院（邵靓、张萍等无实质学术贡献署名、编造研究过程、篡改研究记录）等医疗机构。失信行为包括买卖实验数据、买卖论文、无实质学术贡献署名、编造研究过程、篡改研究记录等；多名通讯作者和第一作者被终身禁止承担或参与科技计划（专项、基金等）项目等财政性资金支持的科技活动，终止或撤销利用失信行为获得的财政性资金支持、相关学术奖励和荣誉，10年内取消科技奖励与科技人才称号申报资格，追回科研奖励及版面费资助，记入科研诚信严重失信行为数据库。","timeline":[{"date":"2026-07-10","desc":"国家卫健委公开通报第四批科研失信行为调查处理结果，共28起，涉及数据造假、论文买卖、挂名搭车等问题，多人被终身禁止参与财政性科技活动。"}],"ethics":"核心问题：1）批次通报规模扩大至28起，显示“论文工厂”问题在医疗机构仍呈高发态势；2）“挂名搭车”（无实质学术贡献署名）批量暴露，科研署名规范治理加速；3）终身禁入+追回奖励+记入严重失信数据库的处罚力度持续加码，形成对医学论文造假的高压震慑。","sources":[{"title":"国家卫健委：关于涉论文工厂严重学术造假行为调查处理结果的通报（第四批）","url":"https://www.nhc.gov.cn/qjjys/ycdtxx/202607/6a18742855dc4482b5c2cd625fed4194.shtml"},{"title":"中国新闻网：涉数据造假、论文买卖等 国家卫健委通报28起医学论文造假违规案例","url":"https://www.chinanews.com.cn/gn/2026/07-10/10656868.shtml"}],"key":"nhc_2026_b4","name":"2026年国家卫健委通报论文工厂科研失信案件（第四批）","slug":"nhc-2026-b4","placements":[{"year":2026,"month":7}],"wordcloud":[["国家卫健委",2],["论文工厂",2],["第四批",2],["28起",2],["买卖实验数据",1],["终身禁止",1],["挂名搭车",1],["科研失信",1]]},{"keywords":["国家自然科学基金委","2026年第二批","31起","杰青","伪造篡改数据","撤销项目","追回经费","学术打假"],"summary":"2026年8月28日，国家自然科学基金委员会发布2026年第2批案件通报，共31起科研不端和违规行为处理结果，被处理人员包括近期被网络举报存在科研不端行为的王平、陈佺、苏佳灿、邝栋明等（“耿同学”学术打假风暴涉事学者）。其中：上海某高校金佳丽、王平等人涉事论文存在伪造篡改科研数据问题，金佳丽被取消国家自然科学基金项目申请和参与申请资格7年、王平5年；天津某高校郑浩、陈佺涉事论文部分数据由估算完成、另有部分数据重复使用或粘贴错误，郑浩取消资格7年、陈佺5年；上海某高校周东阳、苏佳灿涉事论文存在数据伪造问题，均取消资格5年；广东某高校万文华、邝栋明涉事论文存在部分数据微调、部分数据（图片）使用混乱问题，均取消资格3年。多位国家杰出青年科学基金项目负责人被撤销项目并追回百万级巨额科研经费，根据可查公开资料系首次有杰青项目被撤销。通报还涉及委托第三方代写基金项目申请书、买卖论文和数据、滥用基金项目资金、向潜在评审专家打探评审信息并实施请托等行为。","timeline":[{"date":"2026-08-28","desc":"国家自然科学基金委发布2026年第2批案件通报（31起），王平、陈佺、苏佳灿、邝栋明等被通报：金佳丽、郑浩各取消申请资格7年，王平、陈佺、苏佳灿各5年，万文华、邝栋明各3年；多位杰青项目被撤销并追回百万级科研经费，系首次有杰青项目被撤销。"}],"ethics":"核心问题：1）国家自然科学基金委首次撤销杰青项目并追回百万级经费，对高层次人才学术不端的顶格问责成为标志性事件；2）网络公开举报（“耿同学”打假）线索进入基金委正式调查程序，民间监督与官方惩戒形成闭环；3）伪造篡改数据、数据估算、图片使用混乱等不同形态不端行为分层处理（取消资格3至7年），显示精细化问责；4）通报还覆盖代写申请书、买卖数据、打探评审信息等行为，反映科研不端治理全面收紧。","sources":[{"title":"国家自然科学基金委员会：案件通报（2026年第2批）","url":"https://www.nsfc.gov.cn/p1/2812/2816/141045.html"},{"title":"中国青年报：数名被举报人员在列，国家自然科学基金委发布今年第2批科研不端案件通报","url":"https://so.html5.qq.com/page/real/search_news?docid=70000021_5756a92d70833052"}],"key":"nsfc_2026_b2","name":"2026年国家自然科学基金委通报科研不端案件（第二批）","slug":"nsfc-2026-b2","placements":[{"year":2026,"month":8}],"wordcloud":[["国家自然科学基金委",2],["2026年第二批",2],["31起",2],["杰青",2],["伪造篡改数据",1],["撤销项目",1],["追回经费",1],["学术打假",1]]}],"global_wordcloud":[["论文工厂",13],["国家自然科学基金委",12],["国家卫健委",10],["科技部通报",9],["科研诚信",8],["论文造假",8],["代写代投",7],["核心问题",7],["科研不端",6],["科研失信",6],["买卖论文",5],["伦理审查",5],["医学科研诚信",5],["买卖实验数据",4],["学术不端",4],["撤稿",4],["科技部",4],["肖氏反射弧",4],["图片误用",3],["基因编辑",3],["学术打假",3],["杰青",3],["119篇",2],["17所附属医院",2],["2024年第一批",2],["2025年第一批",2],["2025年第二批",2],["2026年第一批",2],["2026年第二批",2],["21起",2],["24起",2],["25人",2],["28起",2],["293名责任人",2],["31起",2],["46起案件",2],["9所高校",2],["Hindawi",2],["blok",2],["dc",2],["science",2],["中国学者",2],["伦理审查办法",2],["伪造数据",2],["儿童",2],["冒用基金号",2],["刑法修正案",2],["刘翔峰",2],["医学研究",2],["取消资格",2],["同济大学",2],["图片不当操纵",2],["基金监督",2],["大规模撤稿",2],["张瑜鸿",2],["抄袭剽窃",2],["撤销项目",2],["故意伤害",2],["施普林格",2],["曹雪涛",2],["未发现主观造假",2],["李红

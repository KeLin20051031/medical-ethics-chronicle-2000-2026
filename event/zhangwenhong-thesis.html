互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2015-05","desc":"拉考尔被指伪造数据，通讯作者 Green 正式撤回《科学》论文。","idx":0}],"process":[],"result":[]},"related":[{"slug":"yoshihiro-sato","name":"日本骨骼研究者佐藤能启大规模论文造假","score":77,"region":"国际"},{"slug":"scott-reuben","name":"美国麻醉学家鲁本数据伪造入狱案","score":75,"region":"国际"},{"slug":"anversa-cardiac","name":"美国哈佛医学院安维萨心脏干细胞论文撤稿事件","score":84,"region":"国际"},{"slug":"visfatin","name":"《科学》Visfatin蛋白论文撤稿","score":75,"region":"国际"},{"slug":"victor-ninov","name":"伯克利实验室尼诺夫伪造超重元素事件","score":76,"region":"国际"},{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"},{"slug":"lopez-otin-daley","name":"洛佩斯-奥廷与戴利干细胞论文撤稿","score":77,"region":"国际"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"}]},{"key":"didier_raoult_2020","name":"法国学者拉乌尔羟氯喹论文撤稿事件","slug":"didier-raoult","region":"国际","keywords":["Didier Raoult","拉乌尔","羟氯喹","新冠","撤稿","法国","2020","2024","马赛","高被引"],"summary":"**2020–2024年**，法国马赛感染研究所所长、传染病专家**迪迪埃·拉乌尔（Didier Raoult）**团队关于羟氯喹治疗新冠的论文（曾被引用逾3000次）于2024年12月被《国际抗菌药物杂志》撤稿，此前已因数据与方法问题广受质疑；其实验室亦因大量撤稿受到处分。该案是新冠疫情中'未经充分验证即高调发布结论'的代表。","timeline":[{"date":"2020","desc":"羟氯喹在全球范围内引发抢购与争议，部分既有适应症患者出现断供。"},{"date":"2020-03","desc":"拉乌尔发表羟氯喹联合阿奇霉素治疗新冠的小型研究，引发全球关注。"},{"date":"2020-05","desc":"拉乌尔团队发表羟氯喹治疗新冠研究，引发全球关注与争议。"},{"date":"2024-12","desc":"该高被引论文被正式撤稿，成史上被引最高的撤稿论文之一。"},{"date":"2024-12-18","desc":"该羟氯喹研究被正式撤回，成为被引量最高的撤稿论文之一。"}],"ethics":"核心问题：1）疫情压力下'快速发表'绕过严谨验证；2）高被引论文撤稿对临床决策的误导；3）学术明星效应与同行评议失灵。","sources":[{"title":"Nature: Infamous hydroxychloroquine paper finally retracted","url":"https://www.nature.com/articles/d41586-024-04014-9"},{"title":"Science: Infamous paper that popularized unproven COVID-19 treatment finally retracted","url":"https://www.science.org/content/article/infamous-paper-popularized-unproven-covid-19-treatment-finally-retracted"}],"placements":[{"year":2020,"month":5}],"severity":88,"popularity":85,"score":87,"wordcloud":[["撤稿",8],["新冠",6],["拉乌尔",5],["羟氯喹",5],["法国",4],["马赛",4],["论文",4],["高被引",3],["研究",2],["拉乌",2],["乌尔",2],["团队",2],["羟氯",2],["氯喹",2],["喹治",2],["治疗",2],["疗新",2],["氯喹治",2],["喹治疗",2],["治疗新",2],["疗新冠",2],["问题",2],["疫情",2],["验证",2],["发表",2],["引论",2],["引论文",2],["国马",1]],"background":"迪迪埃·拉乌尔（Didier Raoult）为法国微生物学家、马赛地中海感染与肿瘤研究所（IHU）所长，在新冠疫情期间因大力推广羟氯喹（羟氯喹/氯喹）治疗新冠肺炎而备受关注，并发表了多项相关临床研究。","stances":"其2020年发表的羟氯喹联合阿奇霉素小型研究（仅36名患者）被广泛引用却又饱受方法学批评；该药在政商与媒体推动下（包括时任美国总统特朗普的背书）引发全球抢购，甚至造成红斑狼疮等既有用药患者断供。2024年12月18日，该研究被正式撤回，成为有史以来被引量最高的撤稿论文之一。围绕“临床直觉”与“证据标准”、“科学”与“政治化”的争论持续不断。","impact":"相关研究于2024年被撤回，事件成为疫情期间科研质量与错误信息治理的标志性案例，推动对小型观察性研究传播边界的反思。","discussion":"该事件呈现“医生个人信念”与“群体证据规范”之间的张力。一项样本极小、方法存疑的研究，借助政治与媒体放大，足以改变全球用药行为与资源分配，凸显危机时期科学传播被“信息疫情”（infodemic）裹挟的风险。它提醒：公共健康决策须以可重复的严谨证据为锚，而非个别权威的声望。","deepdive":"## 一、事件全貌：一篇36人研究的全球外溢\n\n2020年3月，法国马赛地中海感染研究所所长迪迪埃·拉乌尔团队发表羟氯喹联合阿奇霉素治疗新冠的小型研究，仅**36名患者**，却因「有效」的结论被广泛传播；在政治人物背书与媒体放大下，该药在全球引发抢购，甚至导致红斑狼疮等既有用药患者断供。批评声持续不断，2024年12月18日，该论文被《国际抗菌药物杂志》正式撤回，成为**史上被引量最高的撤稿论文之一**。\n\n## 二、逐层深挖：小样本、强立场与传播放大器\n\n疑点首先在**方法**：样本极小、缺乏随机与盲法，对照与终点设置存疑，疗效结论难以成立；其次在**立场**：研究者在公共场域持续为主张背书，使「临床直觉」盖过了证据规范；再次在**传播**：政治与媒体充当了放大器，把未经证实的研究变成公共政策与个人用药的依据。撤稿虽迟，却确认了一个底线——「证据强度」才是医学决策的锚。\n\n## 三、合理性与不合理性辨析\n\n合理：在尚无特效药的紧急期，尝试既有药物、快速积累经验的动机可以理解；研究者对患者的关切具有善意。不合理：把**个体观察**当作**确证疗效**对外发布，忽视了证据分级；在公众平台强化未验证主张，客观上助长了「信息疫情」；资源被错误配置，并挤占了本可流向严谨试验的注意力。\n\n## 四、科研伦理与哲学维度\n\n伦理上，医生负有**不伤害**与**不误导**的双重义务，其公共言论同样受此约束；公正层面，错误用药挤占了脆弱患者真实的救治机会。哲学上，这是「**临床直觉 vs 证据等级**」与「**科学 vs 政治化**」的双重张力：医学知识的正当性来自可重复的证据体系，而非个人声望；当科学被政治与情绪裹挟，受损的是公众对科学的信任。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要重建「**以证据分级约束公共言论**」的规范。实际：①研究者与媒体对早期小样本研究应强制标注证据等级与局限；②推动多中心、随机、盲法的确证性试验作为疗效结论的前提；③对影响公共卫生决策的传播建立「信息溯源与更正」机制；④提升公众科学素养，增强对「信息疫情」的免疫力。让证据而非流量决定用药，是危机治理的底线。","phases":{"cause":[{"date":"2020","desc":"羟氯喹在全球范围内引发抢购与争议，部分既有适应症患者出现断供。","idx":0},{"date":"2020-03","desc":"拉乌尔发表羟氯喹联合阿奇霉素治疗新冠的小型研究，引发全球关注。","idx":1}],"process":[{"date":"2020-05","desc":"拉乌尔团队发表羟氯喹治疗新冠研究，引发全球关注与争议。","idx":2}],"result":[{"date":"2024-12","desc":"该高被引论文被正式撤稿，成史上被引最高的撤稿论文之一。","idx":3},{"date":"2024-12-18","desc":"该羟氯喹研究被正式撤回，成为被引量最高的撤稿论文之一。","idx":4}]},"related":[{"slug":"surgisphere-covid","name":"美国Surgisphere公司新冠数据造假致顶刊撤稿事件","score":89,"region":"国际"},{"slug":"covid-retraction-2020","name":"2020年新冠相关论文全球撤稿潮","score":89,"region":"国际"},{"slug":"lancet-covid-outcomes","name":"《柳叶刀》新冠出院后6个月结局论文撤稿","score":84,"region":"国际"},{"slug":"covid-paper-retraction-2020","name":"2020年新冠相关论文集中撤稿事件","score":75,"region":"中国"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"hua-zhong","name":"研究者钟华高产撤稿","score":66,"region":"国际"},{"slug":"ayman-atta","name":"研究者艾曼·阿塔高产撤稿","score":66,"region":"国际"}]},{"key":"francesca_gino_2023","name":"哈佛商学院吉诺行为学研究数据造假","slug":"francesca-gino","region":"国际","keywords":["Francesca Gino","吉诺","哈佛商学院","行为科学","数据造假","美国","2023","撤稿","解雇"],"summary":"**2023–2025年**，哈佛商学院行为科学家**弗朗西斯卡·吉诺（Francesca Gino）**——以研究'欺骗与不诚实'闻名——被指在至少4篇论文中操纵实验数据，相关论文被撤稿；吉诺先起诉哈佛与举报人造谣（索赔2500万美元），后于2025年被哈佛解雇，成为哈佛数十年来首位被解雇的终身教授。","timeline":[{"date":"2021-2023","desc":"Data Colada 等持续指出吉诺多篇论文存在数据异常。"},{"date":"2023","desc":"吉诺起诉Data Colada诽谤；哈佛商学院启动内部调查。"},{"date":"2023-08","desc":"吉诺起诉哈佛与三名举报人诽谤，引发关注。"},{"date":"2024-09","desc":"联邦法官驳回吉诺的诽谤诉求。"},{"date":"2025-05","desc":"哈佛宣布解雇吉诺，相关论文已部分撤稿。"},{"date":"2025-05","desc":"哈佛大学撤销吉诺的终身教职。"}],"ethics":"核心问题：1）行为科学实验数据操纵；2）被举报者反诉的'寒蝉效应'；3）名校终身教授问责的罕见先例。","sources":[{"title":"科学网：博主揭露哈佛教授学术不端遭起诉","url":"https://news.sciencenet.cn/sbhtmlnews/2023/8/375721.shtm"},{"title":"Wikipedia: Francesca Gino","url":"https://en.wikipedia.org/wiki/Francesca_Gino"},{"title":"Harvard Sues Ex-HBS Professor Gino for Defamation (The Crimson)","url":"https://www.thecrimson.com/article/2025/9/12/harvard-sues-gino/"},{"title":"Honesty researcher’s lawsuit against data sleuths dismissed (Science)","url":"https://www.science.org/content/article/honesty-researcher-s-lawsuit-against-data-sleuths-dismissed"}],"placements":[{"year":2023,"month":8}],"severity":86,"popularity":88,"score":87,"wordcloud":[["吉诺",7],["解雇",6],["哈佛",6],["撤稿",5],["哈佛商学院",3],["行为科学",3],["数据造假",3],["美国",3],["论文",3],["举报",3],["科学",2],["操纵",2],["实验",2],["验数",2],["数据",2],["实验数",2],["验数据",2],["起诉",2],["诉哈",2],["报人",2],["起诉哈",2],["诉哈佛",2],["举报人",2],["终身",2],["身教",2],["教授",2],["终身教",2],["身教授",2]],"background":"弗朗西丝卡·吉诺（Francesca Gino）为哈佛商学院行为科学教授，长期研究“诚实”等主题，成果丰硕、声望卓著。2021至2023年间，学术打假博客Data Colada连续指出其多篇论文存在数据异常（如实验数据被操纵的嫌疑）。","stances":"哈佛商学院经内部调查认定其部分论文存在学术不端并予以处理、相关论文被撤回；吉诺于2023年反诉Data Colada诽谤，2024年9月马萨诸塞州联邦法官驳回其诉求；2025年5月，哈佛大学撤销其终身教职，并于同年8—9月提起反诉。围绕“公开质疑”与“正当程序”、“数据侦探”与“名誉损害”的边界，学界与公众争论不休。","impact":"吉诺被撤销终身教职，多篇论文被撤回，相关法律与诚信讨论持续发酵，成为行为科学领域科研诚信治理的重要案例。","discussion":"“诚实”研究者自身卷入数据造假疑云，使事件带有强烈的反讽意味，也折射出社会心理学等领域的“可复现性危机”。辩证地看，对不端的公开质疑是净化学术生态的必要力量，但质疑须建立在可核查的证据之上，并以程序正义为保障，避免舆论审判替代制度裁决。","deepdive":"## 一、事件全貌：一位「诚实研究者」的反讽\n\n哈佛商学院行为科学家弗朗西丝卡·吉诺（Francesca Gino）以研究「欺骗与不诚实」著称、声望卓著。2021—2023年，学术打假博客 Data Colada 连续指出其多篇论文存在数据异常。哈佛商学院内部调查认定其部分论文存在学术不端，相关论文被撤回。2023年，吉诺反诉哈佛与三名举报人**诽谤**（索赔2500万美元）；2024年9月，马萨诸塞州联邦法官驳回其诽谤诉求；2025年5月，哈佛宣布撤销其终身教职，使其成为哈佛数十年来首位被解雇的终身教授，同年哈佛亦对其提起反诉。\n\n## 二、逐层深挖：数据侦探、反诉与程序\n\n关键在**证据的可核查性**：Data Colada 通过比对原始数据与发表数据，指出异常（如数据被替换、统计量不符），这类「数据侦探」调查是可复核的外部监督。其次是**反诉的寒蝉效应**：被举报者以诽谤诉讼回应公开质疑，可能令潜在监督者却步；法官驳回诉求，一定程度维护了基于证据的公开质疑空间。第三是**程序**：从质疑、调查到处分历时数年，既反映制度处理顶级学者时的审慎，也暴露了迟滞。\n\n## 三、合理性与不合理性辨析\n\n合理：哈佛最终依据调查撤销其终身教职，体现了「无论声望多高都须问责」；吉诺亦有依法维护名誉的正当权利，不应在调查未定前被舆论定罪。不合理：其一，若数据异常确凿，长时间的拖延会削弱公众对学术自我纠错能力的信任；其二，以诉讼回应证据型质疑，可能压制必要的学术监督；其三，事件折射出社会心理学等领域**可复现性危机**的深层问题。\n\n## 四、科研伦理与哲学维度\n\n「诚实研究者」自身被指数据操纵，构成强烈**反讽**，也揭示：**研究对象与研究者行为之间存在道德鸿沟**，谈诚实不等于自身诚实。知识论上，行为科学的结论高度依赖数据的真实与分析的可复现，数据操纵直接摧毁其可信度。伦理上，涉及**公正**（对举报者与被举报者的程序公平）与**诚实**；哲学上触及「**名誉与真相**」的张力：公开质疑是净化生态之力，但必须以可核查证据与程序正义为界，避免以舆论替代裁决。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「**证据驱动的公开质疑**」受到保护，同时以程序约束其边界。实际：①推动数据与代码的强制公开，使结论可被独立复核（回应复现性危机）；②建立机构调查的**独立性与时限**，避免久拖不决；③保护善意举报人，明确**反诉滥用的边界**，防止以诉讼压制监督；④区分「调查中」与「已认定」，约束舆论审判；⑤把诚信与处分、荣誉、经费挂钩，使问责可预期。让真相与名誉都由证据与程序来裁决，学术生态才能既公正又有活力。","phases":{"cause":[{"date":"2021-2023","desc":"Data Colada 等持续指出吉诺多篇论文存在数据异常。","idx":0},{"date":"2023","desc":"吉诺起诉Data Colada诽谤；哈佛商学院启动内部调查。","idx":1}],"process":[{"date":"2023-08","desc":"吉诺起诉哈佛与三名举报人诽谤，引发关注。","idx":2},{"date":"2024-09","desc":"联邦法官驳回吉诺的诽谤诉求。","idx":3}],"result":[{"date":"2025-05","desc":"哈佛宣布解雇吉诺，相关论文已部分撤稿。","idx":4},{"date":"2025-05","desc":"哈佛大学撤销吉诺的终身教职。","idx":5}]},"related":[{"slug":"victor-ninov","name":"伯克利实验室尼诺夫伪造超重元素事件","score":76,"region":"国际"},{"slug":"wei-chengxi","name":"内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格","score":70,"region":"中国"},{"slug":"ma-hong","name":"马泓买卖实验研究数据案","score":65,"region":"中国"},{"slug":"ningxia-chengjiang","name":"宁夏医科大学成江买卖实验数据案","score":67,"region":"中国"},{"slug":"milena-penkowa","name":"丹麦神经科学家彭科娃数据造假获刑案","score":74,"region":"国际"},{"slug":"khalid-shah","name":"哈佛医学院沙阿图像剽窃与数据造假质疑","score":75,"region":"国际"},{"slug":"dan-ariely","name":"杜克行为经济学家阿里埃利数据造假质疑","score":81,"region":"国际"},{"slug":"marc-hauser","name":"哈佛心理学家豪泽灵长类认知数据造假","score":79,"region":"国际"}]},{"key":"nancy_olivieri_1990s","name":"多伦多奥利维耶里临床试验揭发案","slug":"nancy-olivieri","region":"国际","keywords":["Nancy Olivieri","奥利维耶里","多伦多","临床试验","数据压制","吹哨人","加拿大","Apotex","1996","学术自由"],"summary":"**1996年起**，加拿大多伦多大学血液学家**南希·奥利维耶里（Nancy Olivieri）**在铁螯合剂（去铁酮）临床试验中发现药物可能使部分患者肝铁升高、增加心脏病风险，制药公司 Apotex 以诉讼相威胁要求隐瞒；她坚持公开数据，反遭所在医院与大学质疑诚信，并经历20余起诉讼。该案是'科研吹哨人'对抗药企与机构的经典案例。","timeline":[{"date":"1996-01","desc":"奥利维耶里发现药物副作用，遭 Apotex 威胁封口。"},{"date":"2000-01","desc":"她将结果发表于《新英格兰医学杂志》并告知患者，随后遭机构排挤与长期诉讼。"}],"ethics":"核心问题：1）研究者公布不利数据的伦理义务；2）药企对学术自由的压力；3）机构对吹哨人的保护缺失；4）患者知情同意。","sources":[{"title":"PMC: Dances with the pharmaceutical industry","url":"https://pmc.ncbi.nlm.nih.gov/articles/pmid/11873922/"},{"title":"科学网：科学吹哨人南希·奥利维埃里30年的战斗艰辛","url":"https://wap.sciencenet.cn/blog-212210-1447516.html"}],"placements":[{"year":2000,"month":1}],"severity":80,"popularity":78,"score":79,"wordcloud":[["吹哨人",5],["多伦多",4],["加拿大",4],["奥利维耶里",3],["临床试验",3],["数据压制",3],["学术自由",3],["诉讼",3],["机构",3],["大学",2],["奥利",2],["利维",2],["维耶",2],["耶里",2],["奥利维",2],["利维耶",2],["维耶里",2],["发现",2],["现药",2],["药物",2],["发现药",2],["现药物",2],["威胁",2],["数据",2],["吹哨",2],["哨人",2],["药企",2],["年起",1]],"deepdive":"## 一、事件全貌：多伦多奥利维耶里临床试验揭发案\n\n1996年起，加拿大多伦多大学血液学家南希·奥利维耶里（Nancy Olivieri）在铁螯合剂（去铁酮）临床试验中发现药物可能使部分患者肝铁升高、增加心脏病风险，制药公司 Apotex 以诉讼相威胁要求隐瞒；她坚持公开数据，反遭所在医院与大学质疑诚信，并经历20余起诉讼。该案是'科研吹哨人'对抗药企与机构的经典案例。 事件时间线上的关键节点包括：1996-01：奥利维耶里发现药物副作用，遭 Apotex 威胁封口。；2000-01：她将结果发表于《新英格兰医学杂志》并告知患者，随后遭机构排挤与长期诉讼。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**研究者公布不利数据的伦理义务**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**药企对学术自由的压力**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**机构对吹哨人的保护缺失**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**患者知情同意**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与麦克马斯特大学普鲁伊特蜘蛛行为数据造假、井冈山大学钟华刘涛论文造假事件、天津大学张裕卿教授被学生123页PDF举报学术造假事件、荷兰蒂尔堡大学斯塔佩尔心理学数据造假事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"1996-01","desc":"奥利维耶里发现药物副作用，遭 Apotex 威胁封口。","idx":0}],"process":[],"result":[{"date":"2000-01","desc":"她将结果发表于《新英格兰医学杂志》并告知患者，随后遭机构排挤与长期诉讼。","idx":1}]},"related":[{"slug":"jonathan-pruitt","name":"麦克马斯特大学普鲁伊特蜘蛛行为数据造假","score":74,"region":"国际"},{"slug":"jgsu-zhong-liu","name":"井冈山大学钟华刘涛论文造假事件","score":67,"region":"中国"},{"slug":"zhang-yuqing","name":"天津大学张裕卿教授被学生123页PDF举报学术造假事件","score":85,"region":"中国"},{"slug":"stapel-psychology","name":"荷兰蒂尔堡大学斯塔佩尔心理学数据造假事件","score":79,"region":"国际"},{"slug":"hwang-woo-suk","name":"韩国首尔大学黄禹锡干细胞论文造假事件","score":87,"region":"国际"},{"slug":"bio-qian","name":"钱某基因治疗临床试验数据造假案","score":81,"region":"中国"},{"slug":"crime-law-2020","name":"2020年刑法修正案（十一）增设注册数据造假罪","score":72,"region":"中国"},{"slug":"milena-penkowa","name":"丹麦神经科学家彭科娃数据造假获刑案","score":74,"region":"国际"}]},{"key":"hindawi_2023","name":"2023年Hindawi与Wiley大规模撤稿（论文工厂）","slug":"hindawi-2023","region":"国际","keywords":["Hindawi","Wiley","论文工厂","批量撤稿","2023","同行评议操纵","开放获取","系统性造假","全球"],"summary":"**2023年**，出版商 Wiley 旗下 Hindawi 因同行评议过程受系统性操纵、存在大量论文工厂（paper mill）产出的伪造论文，全年撤稿逾8000篇，推动全球年度撤稿总量首次突破1万篇，创历史纪录。Wiley 随后停用 Hindawi 品牌。该案标志着'论文工厂'已成为全球学术出版的结构性危机。","timeline":[{"date":"2023-03","desc":"Web of Science 剔除19本 Hindawi 期刊。"},{"date":"2023-12","desc":"Hindawi 全年撤稿逾8000篇，全球年度撤稿破万；Wiley 停用 Hindawi 品牌。"}],"ethics":"核心问题：1）论文工厂（paper mill）产业化；2）开放获取特刊的同行评议漏洞；3）出版商的质量与问责责任；4）撤稿数量级跃升对学术评价的冲击。","sources":[{"title":"中国新闻网：2023年全球超万篇论文被撤回","url":"https://www.chinanews.com/wap/detail/cht/zw/ft10148899.shtml"},{"title":"新浪财经：创纪录！2023年1万多篇论文被撤回","url":"https://finance.sina.com.cn/tech/roll/2023-12-19/doc-imzynxvc0512785.shtml"}],"placements":[{"year":2023,"month":12}],"severity":85,"popularity":82,"score":84,"wordcloud":[["全球",6],["撤稿",5],["论文",4],["论文工厂",3],["批量撤稿",3],["同行评议操纵",3],["开放获取",3],["系统性造假",3],["出版",3],["文工",3],["工厂",3],["论文工",3],["文工厂",3],["版商",2],["出版商",2],["评议",2],["全年",2],["年撤",2],["稿逾",2],["全年撤",2],["年撤稿",2],["撤稿逾",2],["球年",2],["年度",2],["度撤",2],["全球年",2],["球年度",2],["年度撤",2]],"deepdive":"## 一、事件全貌：一年撤稿破万的结构性危机\n\n2023年，出版商Wiley旗下Hindawi因同行评议被系统性操纵、充斥论文工厂（paper mill）产出的伪造论文，全年撤稿**逾8000篇**，推动全球年度撤稿总量**首次突破1万篇**，创历史纪录；同年3月Web of Science剔除19本Hindawi期刊，年底Wiley宣布停用Hindawi品牌。该案标志着「论文工厂」已从个别现象升级为**全球学术出版的结构性危机**。\n\n## 二、逐层深挖：工厂、特刊与出版商的「放水」\n\n第一，**论文工厂产业化**：代写、代投、伪造数据的黑产形成流水线，把学术产出变成可购买的商品。第二，**开放获取特刊的漏洞**：Guest editor（客座编辑）制度与特刊模式，被论文工厂利用来买卖审稿与操纵同行评议。第三，**出版商的问责缺位**：以量为纲的商业模式长期「放水」，把质量风险转嫁给作者与学界，直到声誉受损才清理。第四，**撤稿量级的冲击**：破万撤稿动摇了学术评价与文献可信度，诚实作者被不公地比较。第五，**与中国作者的关联**：此前107篇、《肿瘤生物学》等大规模撤稿，共同指向同一土壤——「唯论文」的评价指挥棒。\n\n## 三、合理性与不合理性辨析\n\n合理：大规模撤稿是对存量造假的必要清理，停用品牌也释放了问责信号。不合理：其一，出版商长期逐利、把关失职，**事后清理远慢于事前放水**；其二，把危机代价转嫁给无辜作者与整个学界；其三，根因在「以数量论英雄」的评价体系——只要发表有价，黑产就有市场。只打工厂、不打指挥棒，无法治本。\n\n## 四、科研伦理与哲学维度\n\n伦理上，核心是**出版商的责任伦理**与**公正**：出版者是知识质量的守门人，失职即背叛公共信任；诚实研究者因黑产而被污名化，是分配不公。哲学上，这是**学术评价的异化**——当「发表数量」取代「知识贡献」成为目标，造假便成为「最高效手段」（目的—手段倒置）。知识论上，文献的可信度依赖于可核查的评审与数据，批量操纵直接侵蚀科学公共性。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要同时改革「**评价指挥棒**」与「**出版质量问责**」。实际：①出版商对特刊与客座编辑实行**强审核与审稿人身份验证**，并引入第三方审稿库；②打击论文工厂黑产，斩断代写代投链条；③破除「唯论文、唯数量」，转向代表性成果与同行实质评价；④推动开放数据与图像筛查，提高造假成本；⑤建立撤稿透明登记与影响追溯，让清理可见、可问责。让发表回归「生产知识」，而非「生产指标」。","phases":{"cause":[{"date":"2023-03","desc":"Web of Science 剔除19本 Hindawi 期刊。","idx":0}],"process":[],"result":[{"date":"2023-12","desc":"Hindawi 全年撤稿逾8000篇，全球年度撤稿破万；Wiley 停用 Hindawi 品牌。","idx":1}]},"related":[{"slug":"mdpi-retraction-2024","name":"2024年MDPI等开放获取期刊大规模撤稿","score":72,"region":"中国"},{"slug":"global-retraction-2023","name":"2023年全球年度撤稿首破一万篇","score":81,"region":"国际"},{"slug":"jining-hospital-papermill","name":"山东济宁第一人民医院论文工厂撤稿事件","score":78,"region":"中国"},{"slug":"springer-papermill","name":"施普林格撤回64篇疑似论文工厂论文","score":80,"region":"国际"},{"slug":"springer-retraction-2021","name":"2021年施普林格旗下期刊批量撤稿中国作者","score":74,"region":"中国"},{"slug":"hitler-louis","name":"尼日利亚化学家路易斯论文工厂式撤稿","score":73,"region":"国际"},{"slug":"shahaboddin-shamshirband","name":"计算机学者沙姆希尔班德论文工厂式撤稿","score":68,"region":"国际"},{"slug":"adrian-maxim","name":"工程师阿德里安·马克西姆批量撤稿事件","score":69,"region":"国际"}]},{"key":"springer_papermill_2015","name":"施普林格撤回64篇疑似论文工厂论文","slug":"springer-papermill","region":"国际","keywords":["Springer","施普林格","论文工厂","同行评议造假","撤稿","中国","64篇","2015","生物医学"],"summary":"**2015年8月**，德国施普林格（Springer）出版集团宣布因内部调查发现同行评议报告造假，撤回旗下10本期刊发表的 **64篇**科研论文，作者绝大多数来自中国医疗机构。这是早期'论文工厂'+'伪造同行评议'规模化撤稿的标志性事件，预示了此后中国医学论文批量撤稿潮。","timeline":[{"date":"2015-08","desc":"施普林格撤回64篇论文，多为中国作者，同行评议过程造假。"}],"ethics":"核心问题：1）伪造同行评议（'审稿人'由作者自荐）；2）论文工厂产业化雏形；3）中国医学论文国际撤稿的早期警示；4）出版商审稿流程漏洞。","sources":[{"title":"央广网：64篇论文因造假遭国际期刊撤回 大部分来自中国","url":"https://www.cnr.cn/xjfw/2014xjfw/2014xjfwws/20150820/t20150820_519594723.shtml"},{"title":"Wikipedia: Paper mill (publishing)","url":"https://en.wikipedia.org/wiki/Paper_mill_(publishing)"}],"placements":[{"year":2015,"month":8}],"severity":82,"popularity":78,"score":80,"wordcloud":[["撤稿",6],["论文",6],["评议",4],["施普林格",3],["论文工厂",3],["同行评议造假",3],["中国",3],["生物医学",3],["国医",3],["施普",2],["普林",2],["林格",2],["施普林",2],["普林格",2],["出版",2],["造假",2],["撤回",2],["早期",2],["文工",2],["工厂",2],["论文工",2],["文工厂",2],["伪造",2],["造同",2],["伪造同",2],["医学",2],["学论",2],["国医学",2]],"deepdive":"## 一、事件全貌：施普林格撤回64篇疑似论文工厂论文\n\n2015年8月，德国施普林格（Springer）出版集团宣布因内部调查发现同行评议报告造假，撤回旗下10本期刊发表的 64篇科研论文，作者绝大多数来自中国医疗机构。这是早期'论文工厂'+'伪造同行评议'规模化撤稿的标志性事件，预示了此后中国医学论文批量撤稿潮。 事件时间线上的关键节点包括：2015-08：施普林格撤回64篇论文，多为中国作者，同行评议过程造假。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**伪造同行评议（'审稿人'由作者自荐）**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**论文工厂产业化雏形**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**中国医学论文国际撤稿的早期警示**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**出版商审稿流程漏洞**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与2021年施普林格旗下期刊批量撤稿中国作者、'4·20'107篇中国医学论文集中撤稿事件、2023年全球年度撤稿首破一万篇、2023年Hindawi与Wiley大规模撤稿（论文工厂）等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2015-08","desc":"施普林格撤回64篇论文，多为中国作者，同行评议过程造假。","idx":0}],"process":[],"result":[]},"related":[{"slug":"springer-retraction-2021","name":"2021年施普林格旗下期刊批量撤稿中国作者","score":74,"region":"中国"},{"slug":"tumor-biology-107","name":"'4·20'107篇中国医学论文集中撤稿事件","score":87,"region":"中国"},{"slug":"global-retraction-2023","name":"2023年全球年度撤稿首破一万篇","score":81,"region":"国际"},{"slug":"hindawi-2023","name":"2023年Hindawi与Wiley大规模撤稿（论文工厂）","score":84,"region":"国际"},{"slug":"mdpi-retraction-2024","name":"2024年MDPI等开放获取期刊大规模撤稿","score":72,"region":"中国"},{"slug":"springer-2019","name":"2019年施普林格旗下期刊撤稿中国作者","score":70,"region":"中国"},{"slug":"jining-hospital-papermill","name":"山东济宁第一人民医院论文工厂撤稿事件","score":78,"region":"中国"},{"slug":"shahaboddin-shamshirband","name":"计算机学者沙姆希尔班德论文工厂式撤稿","score":68,"region":"国际"}]},{"key":"sylvain_lesne_2022","name":"明尼苏达大学莱斯内阿尔茨海默论文图片造假","slug":"sylvain-lesne","region":"国际","keywords":["Sylvain Lesné","莱斯内","阿尔茨海默","Aβ*56","图片造假","Nature","美国","2022","2024","撤稿"],"summary":"**2022–2024年**，《科学》（Science）历时半年的调查指出美国明尼苏达大学神经学家**西尔万·莱斯内（Sylvain Lesné）**2006年发表于《自然》（Nature）的里程碑式阿尔茨海默病论文（提出 Aβ*56 假说，被引逾2300次）存在图像篡改；2024年6月该论文被撤稿。该案动摇了'淀粉样蛋白假说'数十年的研究根基，影响巨大。","timeline":[{"date":"2006","desc":"Lesné作为第一作者在《自然》发表Aβ*56相关论文，成为淀粉样蛋白假说奠基性文献。"},{"date":"2022-07","desc":"《科学》发布调查报告，指莱斯内20余篇论文疑似图像操纵。"},{"date":"2022-07","desc":"《科学》调查报道指称其20余篇论文存在图像操纵嫌疑。"},{"date":"2024-06","desc":"2006年Nature里程碑论文被撤稿。"},{"date":"2024-06","desc":"通讯作者Ashe承认部分问题，相关论文被更正或撤回。"}],"ethics":"核心问题：1）高被引里程碑论文的图像篡改；2）单一假说主导数十亿研发方向的风险；3）撤稿对疾病研究范式的冲击。","sources":[{"title":"Nature: Landmark Alzheimer's paper will be retracted","url":"https://www.nature.com/articles/d41586-024-01699-w"},{"title":"搜狐：一篇被引2300余次的Nature开创性论文竟涉嫌造假","url":"https://news.sohu.com/a/1006376126_793649"},{"title":"这篇开创性Nature论文，竟涉嫌造假，误导阿尔茨海默病研究十余年（澎湃）","url":"https://www.thepaper.cn/newsDetail_forward_19146430"},{"title":"被引2300多次，误导全球16年！阿尔茨海默病重磅论文涉嫌“造假”（百家号）","url":"https://baijiahao.baidu.com/s?id=1740019539829260795"},{"title":"Science：研究图像疑似伪造，威胁阿尔茨海默病关键理论（2022 原调查报道）","url":"https://www.science.org/content/article/potential-fabrication-research-images-threatens-key-theory-alzheimers-disease"}],"placements":[{"year":2022,"month":7}],"severity":90,"popularity":88,"score":89,"wordcloud":[["撤稿",6],["莱斯内",5],["论文",5],["美国",4],["阿尔茨海默",3],["图片造假",3],["里程",3],["程碑",3],["里程碑",3],["假说",3],["图像",3],["科学",2],["调查",2],["莱斯",2],["斯内",2],["像篡",2],["篡改",2],["图像篡",2],["像篡改",2],["数十",2],["研究",2],["碑论",2],["程碑论",2],["碑论文",2],["历时",1],["时半",1],["半年",1],["查指",1]],"background":"西尔万·莱斯内（Sylvain Lesné）为美国明尼苏达大学医学院神经科学学者。其作为第一作者、于2006年在《自然》（Nature）发表关于Aβ*56（一种淀粉样蛋白寡聚体）的论文，被视为阿尔茨海默病“淀粉样蛋白假说”的奠基性工作之一，十余年间被引用逾2300次，深刻影响了该领域的研发方向。","stances":"2022年7月，《科学》（Science）历经约6个月的调查报道指称，Lesné参与的20余篇论文存在图像操纵嫌疑；至2024年，论文通讯作者、知名神经科学家Karen Ashe承认部分问题，相关论文被更正或撤回，但Lesné本人对撤稿持不同意见、至今仍在明尼苏达大学任教。学界围绕“这是否动摇淀粉样蛋白假说本身”展开持续辩论。","impact":"多篇相关论文被更正或撤回，《自然》编辑对其数据真实性表达担忧，事件推动阿尔茨海默病研究领域对图像证据与可复现性的重新审视。","discussion":"该事件呈现“单一突破性图像”如何可能误导整个研究领域长达十余年的辩证反思。它揭示：在追求重大发现的竞争压力下，图像篡改、选择性呈现等失范，会通过高被引论文的“光环效应”被层层放大；同时也提醒，对假说的质疑应针对证据本身，而非因个别论文失范而全盘否定合理的研究路径。","deepdive":"## 一、事件全貌：一篇奠基论文与被引用两千余次的假说\n\n2006年，明尼苏达大学神经学家Sylvain Lesné作为第一作者在《自然》发表论文，提出一种名为**Aβ*56**的淀粉样蛋白寡聚体与记忆损害相关，被视为阿尔茨海默病「淀粉样蛋白假说」的奠基性文献，十余年间被引用逾2300次，深刻影响全球研发方向与巨额经费流向。2022年7月22日，《科学》刊出历时约半年的调查，指其20余篇论文存在图像操纵嫌疑。2024年6月，《自然》撤回这篇2006年的里程碑论文；通讯作者Karen Ashe承认部分问题，Lesné本人则对结论存异，且仍在任教。\n\n## 二、逐层深挖：图像、影响与「难以被发现的错误」\n\n疑点集中在**图像**：调查发现多篇论文中蛋白印迹（Western blot）条带存在拼接、复制、背景过渡异常等痕迹，而这些图像正是支撑「Aβ*56存在」的关键证据。更深的问题在**传播结构**：一篇高被引论文的结论被后续研究反复引用、作为前提，形成「引用层累」——一旦地基有虚，上层的整栋建筑都会受影响，且错误会被引用量「洗白」，越来越难被察觉。当年的审稿人难以仅凭图像发现篡改，直到图像取证（image forensics）技术普及与科研打假社区兴起，才被系统识别。\n\n## 三、合理性与不合理性辨析\n\n**需要谨慎对待的一面**：淀粉样蛋白假说本身并未因一篇论文出问题而自动被推翻——该领域有大量独立证据（如遗传学、抗体试验）。以「个案失范」否定整个研究方向，同样是以偏概全。\n\n**不合理的一面**：其一，原始图像的操纵直接污染了证据链的源头；其二，**长期未主动纠错**，直到外部调查介入，反映同行评议与机构自查的迟钝；其三，单一「突破」被过度确立为范式，挤压了替代假说（如tau、神经炎症、代谢等）的研究资源，这是学术生态的**垄断性风险**。\n\n## 四、科研伦理与哲学维度\n\n在**知识论**上，科学的自我修正能力依赖证据可被独立复核；当关键证据局限于几张无法追溯的图像，纠错就退化为偶然（靠某人起疑）。在**科学社会学**层面，这是范式固化的代价：高影响力结果获得的资源与话语权，会反噬质疑的空间。在**伦理学**上，篡改图像是对同行、资助者、患者与公众的多重欺骗——尤其当对象是尚无有效疗法的阿尔茨海默病，错误方向意味着无数家庭被延宕的希望。哲学上，它提醒我们：**相关不等于因果，突破性的「标志物」必须经受跨实验室的独立复现**，而非由引用量背书。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让**可复现性优先于影响力**。实际上：①期刊强制原始图像与数据的上传与留存，并在审稿阶段用图像完整性工具（重复、拼接检测）筛查；②对基石性高被引论文建立**定期复核**机制，并让「复现研究」获得与「新发现」同等的发表与资助空间；③资助机构在配置资源时**均衡支持多种假说**，避免把鸡蛋放在一个篮子里；④打通「质疑—核查—更正」的快速通道，降低纠错成本。唯有让复现成为科研的常规动作，范式才不会被一张图片绑架。","phases":{"cause":[{"date":"2006","desc":"Lesné作为第一作者在《自然》发表Aβ*56相关论文，成为淀粉样蛋白假说奠基性文献。","idx":0},{"date":"2022-07","desc":"《科学》发布调查报告，指莱斯内20余篇论文疑似图像操纵。","idx":1}],"process":[{"date":"2022-07","desc":"《科学》调查报道指称其20余篇论文存在图像操纵嫌疑。","idx":2}],"result":[{"date":"2024-06","desc":"2006年Nature里程碑论文被撤稿。","idx":3},{"date":"2024-06","desc":"通讯作者Ashe承认部分问题，相关论文被更正或撤回。","idx":4}]},"related":[{"slug":"masliah-2024","name":"美国NIH神经科学主任马斯利亚图像伪造被解雇","score":87,"region":"国际"},{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"},{"slug":"mukesh-awasthi","name":"研究者穆凯什·阿瓦斯蒂高产撤稿","score":66,"region":"国际"},{"slug":"hoau-yan-wang","name":"纽约市立大学王浩彦阿尔茨海默论文撤稿","score":78,"region":"国际"},{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"},{"slug":"liuguanghui-nature","name":"刘光慧团队Nature论文'误录'争议","score":71,"region":"中国"},{"slug":"joseph-xavier","name":"研究者约瑟夫·拉杰·泽维尔高产撤稿","score":66,"region":"国际"},{"slug":"ashok-pandey","name":"研究者阿肖克·潘迪高产撤稿","score":66,"region":"国际"}]},{"key":"covid_retraction_surge_2020","name":"2020年新冠相关论文全球撤稿潮","slug":"covid-retraction-2020","region":"国际","keywords":["COVID-19","新冠","撤稿潮","羟氯喹","同行评议","2020","Surgisphere","拉乌尔","全球","学术诚信"],"summary":"**2020年**，新冠大流行期间科研'快速发表'压力剧增，出现多起震动全球的撤稿事件：除 Surgisphere 操纵《柳叶刀》《新英格兰医学杂志》数据、拉乌尔羟氯喹研究外，还有大量未经同行评议预印本与低质研究的撤回。该撤稿潮暴露了紧急状态下同行评议与数据核查的系统性脆弱。","timeline":[{"date":"2020","desc":"新冠相关论文与预印本呈爆发式增长，大量研究未经传统同行评议即公开。"},{"date":"2020-06","desc":"Surgisphere 数据造假致《柳叶刀》《新英格兰医学杂志》论文同日撤稿。"},{"date":"2020-06","desc":"Surgisphere等重磅论文因数据不可核查被撤，凸显危机科研的数据完整性风险。"},{"date":"2020-12","desc":"全年新冠相关论文撤稿数量创阶段性高峰，引发对'速度优先'的反思。"}],"ethics":"核心问题：1）疫情紧急状态下的发表伦理；2）预印本与顶刊双双失守；3）不可核实数据对全球抗疫决策的干扰；4）出版速度与研究严谨性的张力。","sources":[{"title":"Nature: More than 10,000 research papers were retracted in 2023","url":"https://www.nature.com/articles/d41586-023-03974-8"},{"title":"Nature: Infamous hydroxychloroquine paper finally retracted","url":"https://www.nature.com/articles/d41586-024-04014-9"},{"title":"How a torrent of COVID science changed research publishing (Nature)","url":"https://www.nature.com/articles/d41586-020-03564-y"},{"title":"Academic Journal Retractions and the COVID-19 Pandemic (SAGE)","url":"https://journals.sagepub.com/doi/10.1177/21501327211015592"},{"title":"Retraction Watch：已撤稿的新冠（COVID-19）论文列表","url":"https://retractionwatch.com/retracted-coronavirus-covid-19-papers/"},{"title":"arXiv：新冠研究撤稿动态分析（Retraction Dynamics in COVID-19 Research）","url":"https://arxiv.org/html/2404.15298v1"}],"placements":[{"year":2020,"month":6}],"severity":88,"popularity":90,"score":89,"wordcloud":[["新冠",5],["全球",5],["撤稿潮",4],["羟氯喹",4],["拉乌尔",4],["撤稿",4],["数据",4],["同行评议",3],["学术诚信",3],["研究",3],["发表",2],["柳叶",2],["叶刀",2],["柳叶刀",2],["新英",2],["英格",2],["格兰",2],["兰医",2],["医学",2],["学杂",2],["杂志",2],["新英格",2],["英格兰",2],["格兰医",2],["兰医学",2],["医学杂",2],["学杂志",2],["评议",2]],"background":"2020年新冠疫情期间，全球科研产出出现前所未有的爆发式增长，预印本平台（medRxiv、bioRxiv等）与正式期刊在极短时间内涌入海量论文。研究显示，2020年全球约4%的科研产出与冠状病毒相关，其中相当部分未经传统同行评议即以预印本形式传播。","stances":"这一“预印本洪流”在加速知识共享的同时，也带来质量隐忧：Surgisphere等数据造假论文、大量方法缺陷或结论被推翻的研究相继被撤稿。舆论在“开放、快速共享”与“严谨、可核查”之间激烈讨论，有人称其为“预印本的疫情”。","impact":"疫情期间全球新冠相关论文撤稿数量显著上升，多家期刊由此调整快速发表与数据审核政策，科研诚信与危机传播治理成为后疫情时代的重要议题。","discussion":"该现象集中体现了危机科学中“速度”与“严谨”的结构性张力。辩证地看，预印本降低了发表门槛、缩短了知识传播链路，是开放科学的进步；但若缺乏后续同行评议与数据核查的配合，错误结论便可能借“紧急”之名快速扩散，反过来损害公众信任。理想的路径是：快速共享与严格复核并行，而非以一端牺牲另一端。","deepdive":"## 一、事件全貌：一场大流行催生的发表海啸与撤稿潮\n\n2020年，全球科研产出因新冠而爆发式增长，大量研究绕开传统同行评议、以**预印本**（medRxiv、bioRxiv等）形式先行传播。随之而来的是一轮撤稿潮：除Surgisphere操纵《柳叶刀》《NEJM》数据、拉乌尔羟氯喹研究外，Retraction Watch记录的新冠相关撤稿论文累计达**数百篇**，2020年全球期刊撤稿总量也显著抬升。顶刊、预印本与低质期刊在「速度优先」下同时失守。\n\n## 二、逐层深挖：速度、评审与传播的连锁反应\n\n第一，**发表激励被疫情放大**：首发权、高影响因子与政策影响力共同驱动抢跑，压缩了数据核查与反复验证的时间。第二，**同行评议被绕过或形式化**：预印本无需评审，顶刊在紧急状态下也加速流程，使不可核查的数据得以进入公共讨论。第三，**传播链条失控**：未经证实的结论经媒体与社交平台二次放大，直接干预临床决策与公众行为（如抢购、自行停药）。第四，**纠错滞后**：从发表到撤稿往往历经数周乃至数月，其间错误已扩散。\n\n## 三、合理性与不合理性辨析\n\n**合理之处**：预印本加快了知识共享，在疫苗、诊疗方案等领域的贡献是真实的；快速评估用药安全也具有紧迫性与公共价值。开放、快速地共享本身是科学进步的方向。\n\n**不合理之处**：其一，把紧急当作**跳过核实**的借口，使「快」以「错」为代价；其二，系统把预印本的「未评审」状态在传播中模糊甚至抹去，让公众误以为已获验证；其三，**纠错机制的速度**远慢于**出错的机制**，形成危险的不对称。\n\n## 四、科研伦理与哲学维度\n\n在**伦理**上，公共健康研究负有「不误导公众」的特殊义务：研究者、媒体与平台共同构成信息链，任何一环放大未证实结论，都是对公众信任的透支。在**哲学/认识论**上，这里体现了「证成」与「传播」的分离：一则命题是否被相信，应取决于证据强度，而非传播速度与权威标签；把预印本当作已证结论传播，是认识论上的越界。在**制度**层面，这是「速度—严谨」张力的极端样本——好的制度应让两者并行，而非二选一。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要重构「发表—评审—传播」的责任链，使快与严谨兼容。实际上：①区分并明确标注预印本/未经同行评议的状态，媒体与平台引用时应醒目标注证据等级；②推行**分层评审**（快速初筛＋持续后评审），让预印本在传播中携带「评审进度」标签；③期刊建立**危机期数据核查预案**，对影响政策的关键研究强制数据审计；④对已发表的错误结论，建立快速更正与影响追溯机制。让「可核查」与「可追溯」内建于传播链，才能在下一场危机中既跑得快、又跑得稳。","phases":{"cause":[{"date":"2020","desc":"新冠相关论文与预印本呈爆发式增长，大量研究未经传统同行评议即公开。","idx":0}],"process":[{"date":"2020-06","desc":"Surgisphere 数据造假致《柳叶刀》《新英格兰医学杂志》论文同日撤稿。","idx":1},{"date":"2020-06","desc":"Surgisphere等重磅论文因数据不可核查被撤，凸显危机科研的数据完整性风险。","idx":2}],"result":[{"date":"2020-12","desc":"全年新冠相关论文撤稿数量创阶段性高峰，引发对'速度优先'的反思。","idx":3}]},"related":[{"slug":"surgisphere-covid","name":"美国Surgisphere公司新冠数据造假致顶刊撤稿事件","score":89,"region":"国际"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"didier-raoult","name":"法国学者拉乌尔羟氯喹论文撤稿事件","score":87,"region":"国际"},{"slug":"lancet-covid-outcomes","name":"《柳叶刀》新冠出院后6个月结局论文撤稿","score":84,"region":"国际"},{"slug":"covid-paper-retraction-2020","name":"2020年新冠相关论文集中撤稿事件","score":75,"region":"中国"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"},{"slug":"hua-zhong","name":"研究者钟华高产撤稿","score":66,"region":"国际"},{"slug":"joachim-boldt","name":"德国麻醉学家博尔特大规模撤稿事件","score":80,"region":"国际"}]},{"key":"potts_kant_2016","name":"杜克大学波茨-坎特肺病数据造假案","slug":"potts-kant","region":"国际","keywords":["Erin Potts-Kant","波茨-坎特","杜克大学","肺病","数据伪造","ORI","美国","2016","1.12亿美元"],"summary":"**2016–2023年**，美国杜克大学实验室经理**艾琳·波茨-坎特（Erin Potts-Kant）**被举报在肺部与哮喘研究中故意伪造、编造数据（涉及近120幅图），导致大量论文撤稿；杜克大学因此与联邦政府达成 **1.125亿美元**和解。ORI 于2023年发布最终不端认定。该案是'非PI（实验人员）造假牵连机构巨额赔偿'的典型。","timeline":[{"date":"2016-01","desc":"同实验室吹哨人举报波茨-坎特数据造假。"},{"date":"2023-01","desc":"ORI 发布最终不端认定，杜克此前已支付1.125亿美元和解。"}],"ethics":"核心问题：1）实验数据系统伪造；2）机构因下属造假承担民事赔偿；3）实验室层级的数据监督；4）吹哨人机制。","sources":[{"title":"ORI: Case Summary - Potts-Kant, Erin N.","url":"https://ori.hhs.gov/content/case-summary-potts-kant-erin-n"},{"title":"知乎：为学术造假买单，杜克大学赔偿上亿美元","url":"https://zhuanlan.zhihu.com/p/73794063"}],"placements":[{"year":2016,"month":1}],"severity":82,"popularity":74,"score":79,"wordcloud":[["实验",5],["美国",4],["数据",4],["杜克大学",3],["肺病",3],["数据伪造",3],["杜克",3],["验室",3],["实验室",3],["造假",3],["克大",2],["大学",2],["杜克大",2],["克大学",2],["波茨",2],["坎特",2],["举报",2],["伪造",2],["亿美",2],["美元",2],["亿美元",2],["发布",2],["布最",2],["最终",2],["终不",2],["不端",2],["端认",2],["认定",2]],"deepdive":"## 一、事件全貌：杜克大学波茨-坎特肺病数据造假案\n\n2016–2023年，美国杜克大学实验室经理艾琳·波茨-坎特（Erin Potts-Kant）被举报在肺部与哮喘研究中故意伪造、编造数据（涉及近120幅图），导致大量论文撤稿；杜克大学因此与联邦政府达成 1.125亿美元和解。ORI 于2023年发布最终不端认定。该案是'非PI（实验人员）造假牵连机构巨额赔偿'的典型。 事件时间线上的关键节点包括：2016-01：同实验室吹哨人举报波茨-坎特数据造假。；2023-01：ORI 发布最终不端认定，杜克此前已支付1.125亿美元和解。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**实验数据系统伪造**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**机构因下属造假承担民事赔偿**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**实验室层级的数据监督**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**吹哨人机制**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与俄亥俄州立大学克罗齐癌症实验室不端事件、杜克肿瘤学家波蒂癌症基因组预测造假、华盛顿大学方 ferric 实验室系列撤稿事件、伯克利实验室尼诺夫伪造超重元素事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2016-01","desc":"同实验室吹哨人举报波茨-坎特数据造假。","idx":0}],"process":[],"result":[{"date":"2023-01","desc":"ORI 发布最终不端认定，杜克此前已支付1.125亿美元和解。","idx":1}]},"related":[{"slug":"carlo-croce","name":"俄亥俄州立大学克罗齐癌症实验室不端事件","score":80,"region":"国际"},{"slug":"anil-potti","name":"杜克肿瘤学家波蒂癌症基因组预测造假","score":79,"region":"国际"},{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"},{"slug":"victor-ninov","name":"伯克利实验室尼诺夫伪造超重元素事件","score":76,"region":"国际"},{"slug":"hzau-student-whistleblow","name":"1·16华中农业大学学生举报导师学术造假事件","score":84,"region":"中国"},{"slug":"eric-poehlman","name":"佛蒙特大学波尔曼研究欺诈入狱案","score":73,"region":"国际"},{"slug":"marc-hauser","name":"哈佛心理学家豪泽灵长类认知数据造假","score":79,"region":"国际"},{"slug":"schon-bell-labs","name":"美国贝尔实验室舍恩物理论文数据造假事件","score":84,"region":"国际"}]},{"key":"gregg_semenza_2021","name":"诺奖得主塞门扎论文图片问题撤稿","slug":"gregg-semenza","region":"国际","keywords":["Gregg Semenza","塞门扎","诺奖","HIF","图片问题","撤稿","美国","2021","约翰霍普金斯","缺氧"],"summary":"**2021年起**，2019年诺贝尔生理学或医学奖得主、约翰·霍普金斯大学教授**格雷格·塞门扎（Gregg Semenza）**被 PubPeer 指出其在2001–2018年间数十篇论文存在图片重复/不当处理（累计被质疑逾50篇），部分论文被撤稿或更正。诺奖得主卷入图片诚信争议，引发对'顶级学者亦非免疫'的讨论。","timeline":[{"date":"2021-11","desc":"PubPeer 累计挂出塞门扎逾50篇论文图片问题，至少1篇撤稿、多篇更正。"},{"date":"2022-10","desc":"《自然》报道塞门扎多篇署名论文正接受图像问题调查。"},{"date":"2024-09","desc":"其已有十余篇论文因图像问题被撤回。"},{"date":"2025-10","desc":"累计约15篇论文被撤回（含5篇PNAS），6篇更正。"}],"ethics":"核心问题：1）诺奖得主同样存在图片诚信问题；2）'图片误用'与'故意造假'的界限；3）高被引论文的事后核查。","sources":[{"title":"腾讯云：诺奖得主涉嫌学术不端！30余篇论文被指P图造假","url":"https://cloud.tencent.com/developer/article/2237847"},{"title":"百家号：诺奖得主深陷论文图片造假漩涡","url":"https://baijiahao.baidu.com/s?id=1768219381417575579"},{"title":"Dozens of papers co-authored by Nobel laureate raise concerns (Nature)","url":"https://www.nature.com/articles/d41586-022-03032-9"},{"title":"突发！诺奖得主涉嫌造假，被撤回了15篇PNAS等高水平文章（BOOKSCI）","url":"https://www.booksci.cn/article/234132.htm"},{"title":"Wikipedia: Gregg Semenza","url":"https://en.wikipedia.org/wiki/Gregg_Semenza"}],"placements":[{"year":2021,"month":11}],"severity":86,"popularity":85,"score":86,"wordcloud":[["塞门扎",5],["诺奖",5],["撤稿",5],["图片",5],["论文",4],["图片问题",3],["美国",3],["约翰霍普金斯",3],["缺氧",3],["奖得",3],["得主",3],["奖得主",3],["问题",3],["塞门",2],["门扎",2],["篇论",2],["篇论文",2],["累计",2],["更正",2],["片诚",2],["诚信",2],["诺奖得",2],["图片诚",2],["片诚信",2],["年起",1],["年诺",1],["诺贝",1],["贝尔",1]],"background":"格雷格·塞门扎（Gregg L. Semenza）因在细胞感知与适应氧气变化机制（HIF通路）方面的贡献，获2019年诺贝尔生理学或医学奖，任约翰斯·霍普金斯大学教授。自2022年起，其署名的多篇论文（最多被指约52—55篇）被在PubPeer等平台质疑存在图像（如Western blot条带）重复使用等问题。","stances":"截至2025年，其团队已有约15篇论文被撤回（含5篇PNAS）、6篇被更正；塞门扎本人否认存在蓄意学术不端。事件引发“诺奖得主是否应为署名论文的图像问题负责”“资深作者责任边界”等广泛讨论，也被视为可复现性危机在顶尖学者身上的投射。","impact":"多篇论文被撤回或更正，事件推动学界对图像诚信、资深作者责任与论文质检流程的再审视（诺贝尔奖未被撤销）。","discussion":"该事件说明，即便是诺贝尔奖级别的“科学标杆”，也未必免疫于图像证据的失范。它凸显“署名即责任”与“可复现性”的辩证要求：高被引与高荣誉不应成为豁免核查的理由，反而更应经受最严格的检验，以维护科学共同体的公信力。","deepdive":"## 一、事件全貌：诺奖光环下的图像疑云\n\n格雷格·塞门扎（Gregg L. Semenza）因阐明细胞感知与适应氧气变化的HIF通路，获2019年诺贝尔生理学或医学奖，任约翰斯·霍普金斯大学教授。自2021年起，其署名的数十篇论文（被指约52—55篇）在PubPeer等平台被质疑存在图像（Western blot条带等）重复使用与不当处理。截至2025年，其团队已有约15篇论文被撤回（含5篇PNAS）、6篇被更正；塞门扎本人否认存在蓄意学术不端。诺奖未被撤销。事件把「顶级学者亦非免疫」摆上桌面。\n\n## 二、逐层深挖：署名、责任与「误用/造假」的界限\n\n第一，**署名即责任**：作为通讯/资深作者，塞门扎对署名论文的数据真实性负有首问责任，不能因「非亲为」而免责——这与泰西耶-拉维涅案同理。第二，**界定的复杂**：图像重复可能是诚实错误（如排版拼接）、也可能是蓄意造假，认定需比对原始数据；诺奖身份不应降低核查标准，也不应提高惩罚标准。第三，**可复现性危机的投射**：如此高比例的论文被质疑，折射出高产量实验室中图像证据缺乏系统复核的普遍短板。第四，**荣誉与问责的分离**：诺奖表彰的是具体科学贡献，与后续署名论文的诚信问题分属不同维度，这也正是「诺奖未被撤」的合理性所在。\n\n## 三、合理性与不合理性辨析\n\n合理：对诺奖得主同样启动核查与撤稿，体现了「高位不免责」；在调查未定前不预设蓄意、保留其申辩权，符合程序正义。不合理/存疑：其一，若属系统性图像问题，说明其实验室长期缺乏数据把关，作为负责人难辞其咎；其二，大量高被引论文在发表多年后才被外部打假者纠正，说明期刊与机构的**主动质检缺位**；其三，惩罚是否比例适当（撤稿 vs 更重处分），取决于最终「误用还是造假」的认定。\n\n## 四、科研伦理与哲学维度\n\n伦理上，核心是**责任伦理**：科学荣誉越大，对数据真实性的担保义务越重。哲学上，这是**权威与可问责**的关系——公信力建立在可核查的证据与透明程序上，而非个人声望；声望既不应成为豁免，也不应自动等于有罪。知识论上，图像是「有无某现象」的门槛证据，其失范直接动摇结论的经验基础。这再次印证：科学的自我修正，依赖外部、可复核的监督，诺奖光环不是例外。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「**署名即担责**」成为硬性规则。实际：①在署名规范中明确通讯/资深作者对原始数据留存与图像核查的把关义务清单；②期刊在审稿与出版环节推广**图像完整性自动筛查**，并对高被引/高荣誉论文加强复核；③强制原始数据（含未裁剪图像）公开存档，使质疑可被独立验证；④统一「误用/造假」的认定标准与比例化处分；⑤将诚信记录与荣誉、职务、经费挂钩，形成可预期问责。让最亮的招牌接受最严的检验，科学才配得上公众的信任。","phases":{"cause":[{"date":"2021-11","desc":"PubPeer 累计挂出塞门扎逾50篇论文图片问题，至少1篇撤稿、多篇更正。","idx":0}],"process":[{"date":"2022-10","desc":"《自然》报道塞门扎多篇署名论文正接受图像问题调查。","idx":1},{"date":"2024-09","desc":"其已有十余篇论文因图像问题被撤回。","idx":2}],"result":[{"date":"2025-10","desc":"累计约15篇论文被撤回（含5篇PNAS），6篇更正。","idx":3}]},"related":[{"slug":"khalid-shah","name":"哈佛医学院沙阿图像剽窃与数据造假质疑","score":75,"region":"国际"},{"slug":"thomas-sudhof","name":"诺奖得主祖德霍夫论文数据错误","score":82,"region":"国际"},{"slug":"jasti-rao","name":"伊利诺伊大学拉奥神经外科手术论文撤稿潮","score":76,"region":"国际"},{"slug":"cao-xuetao","name":"南开大学校长曹雪涛论文图片造假质疑事件","score":83,"region":"中国"},{"slug":"fazlul-sarkar","name":"韦恩州立大学萨尔卡癌症论文批量撤稿","score":77,"region":"国际"},{"slug":"naoki-mori","name":"日本琉球大学森直树图像操纵撤稿案","score":73,"region":"国际"},{"slug":"shigeaki-kato","name":"日本内分泌学家加藤茂明图片操纵撤稿","score":74,"region":"国际"},{"slug":"brian-wansink","name":"康奈尔万辛克食品心理学p值操纵撤稿","score":79,"region":"国际"}]},{"key":"hoau_yan_wang_2023","name":"纽约市立大学王浩彦阿尔茨海默论文撤稿","slug":"hoau-yan-wang","region":"国际","keywords":["Hoau-Yan Wang","王浩彦","纽约市立大学","阿尔茨海默","阿片","图片操纵","撤稿","美国","2023","20篇"],"summary":"**2023年**，美国纽约市立大学（CUNY）神经科学家**王浩彦（Hoau-Yan Wang）**被校方调查认定在约20篇关于阿尔茨海默病与阿片类药物的论文中存在数据操纵与图片伪造，论文被大量撤稿，其于2023年10月被解雇。该案与莱斯内案共同构成2023年阿尔茨海默研究领域的'诚信地震'。","timeline":[{"date":"2023-10","desc":"CUNY 完成调查，认定王浩彦存在科研不端，予以解雇，相关论文撤稿。"}],"ethics":"核心问题：1）阿尔茨海默研究集中爆发的数据诚信危机；2）图片伪造的规模性；3）机构调查与解雇流程。","sources":[{"title":"科普中国：2023科学界十大学术不端（含王浩彦）","url":"https://www.kepuchina.cn/article/articleinfo?business_type=100&ar_id=473188"},{"title":"Retraction Watch: Hoau-Yan Wang","url":"https://retractionwatch.com/?s=Hoau-Yan+Wang"}],"placements":[{"year":2023,"month":10}],"severity":80,"popularity":75,"score":78,"wordcloud":[["王浩彦",5],["撤稿",5],["阿片",4],["美国",4],["纽约市立大学",3],["阿尔茨海默",3],["图片操纵",3],["调查",3],["阿尔",3],["尔茨",3],["茨海",3],["海默",3],["论文",3],["阿尔茨",3],["尔茨海",3],["茨海默",3],["解雇",3],["王浩",2],["浩彦",2],["认定",2],["数据",2],["图片",2],["片伪",2],["伪造",2],["图片伪",2],["片伪造",2],["默研",2],["研究",2]],"deepdive":"## 一、事件全貌：纽约市立大学王浩彦阿尔茨海默论文撤稿\n\n2023年，美国纽约市立大学（CUNY）神经科学家王浩彦（Hoau-Yan Wang）被校方调查认定在约20篇关于阿尔茨海默病与阿片类药物的论文中存在数据操纵与图片伪造，论文被大量撤稿，其于2023年10月被解雇。该案与莱斯内案共同构成2023年阿尔茨海默研究领域的'诚信地震'。 事件时间线上的关键节点包括：2023-10：CUNY 完成调查，认定王浩彦存在科研不端，予以解雇，相关论文撤稿。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**阿尔茨海默研究集中爆发的数据诚信危机**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**图片伪造的规模性**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**机构调查与解雇流程**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与甘露特钠（GV-971）有效性争议、美国NIH神经科学主任马斯利亚图像伪造被解雇、华盛顿大学方 ferric 实验室系列撤稿事件、挪威医生苏德伯伪造口腔癌研究数据事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2023-10","desc":"CUNY 完成调查，认定王浩彦存在科研不端，予以解雇，相关论文撤稿。","idx":0}],"process":[],"result":[]},"related":[{"slug":"gv971-controversy","name":"甘露特钠（GV-971）有效性争议","score":82,"region":"中国"},{"slug":"masliah-2024","name":"美国NIH神经科学主任马斯利亚图像伪造被解雇","score":87,"region":"国际"},{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"francesca-gino","name":"哈佛商学院吉诺行为学研究数据造假","score":87,"region":"国际"},{"slug":"scott-reuben","name":"美国麻醉学家鲁本数据伪造入狱案","score":75,"region":"国际"},{"slug":"marc-hauser","name":"哈佛心理学家豪泽灵长类认知数据造假","score":79,"region":"国际"},{"slug":"luk-van-parijs","name":"MIT 教授范帕里斯数据造假被解雇事件","score":75,"region":"国际"}]},{"key":"masliah_2024","name":"美国NIH神经科学主任马斯利亚图像伪造被解雇","slug":"masliah-2024","region":"国际","keywords":["Eliezer Masliah","马斯利亚","NIH","国家衰老研究所","阿尔茨海默","帕金森","图像伪造","美国","2024","解雇","撤稿"],"summary":"**2024年9–10月**，美国国立卫生研究院（NIH）下属国家衰老研究所（NIA）神经科学部主任**埃利泽·马斯利亚（Eliezer Masliah）**被NIH内部调查认定在约26篇关于阿尔茨海默病与帕金森病的论文中存在图像伪造（image falsification），于2024年10月被解雇，相关论文陆续撤稿。作为全球神经退行性疾病领域的顶尖官员科学家，其数据诚信问题影响深远，与莱斯内、王浩彦案共同构成2020年代阿尔茨海默研究领域的'诚信地震'。","timeline":[{"date":"2024-09","desc":"NIH 调查认定马斯利亚在多篇论文中存在图像伪造等科研不端。"},{"date":"2024-09-23","desc":"马斯利亚在被认定学术不前后被免去NIH/NIA神经科学部主任职务。"},{"date":"2024-09-26","desc":"NIH发布声明，确认其存在研究不端行为。"},{"date":"2024-10","desc":"马斯利亚被解雇，相关论文启动撤稿程序。"},{"date":"2024-10","desc":"约300页证据公开，相关论文进入撤回程序。"}],"ethics":"核心问题：1）顶尖机构官员科学家的图像伪造；2）NIH 内部调查与高层问责；3）神经退行性疾病领域集中的数据诚信危机；4）撤稿对疾病研究方向与公共资金投入的影响。","sources":[{"title":"Science: Research misconduct finding on neuroscientist Eliezer Masliah","url":"https://www.science.org/content/article/research-misconduct-finding-neuroscientist-eliezer-masliah-papers-under-suspicion"},{"title":"AP News: A top government scientist engaged in research misconduct","url":"https://apnews.com/article/misconduct-alzheimers-parkinsons-research-nih-297a61dc69cb18965015381a911197ec"},{"title":"Statement by NIH on Research Misconduct Findings","url":"https://www.nih.gov/news-events/news-releases/statement-nih-research-misconduct-findings"},{"title":"Data Fabrication Ousted NIA Neuroscience Director Eliezer Masliah (Alzforum)","url":"https://www.alzforum.org/news/community-news/data-fabrication-ousted-nia-neuroscience-director-eliezer-masliah"}],"placements":[{"year":2024,"month":9}],"severity":88,"popularity":85,"score":87,"wordcloud":[["撤稿",6],["解雇",5],["帕金森",4],["美国",4],["研究",4],["论文",4],["马斯利亚",3],["国家衰老研究所",3],["阿尔茨海默",3],["图像伪造",3],["神经",3],["科学",3],["马斯",3],["斯利",3],["利亚",3],["马斯利",3],["斯利亚",3],["调查",3],["图像",3],["像伪",3],["伪造",3],["图像伪",3],["像伪造",3],["疾病",3],["领域",3],["诚信",3],["内部",2],["部调",2]],"background":"埃利泽·马斯利亚（Eliezer Masliah）曾任美国国立卫生研究院（NIH）下属国家老龄化研究所（NIA）神经科学部主任，是阿尔茨海默病研究领域的权威学者。2024年，NIH调查认定其存在学术不端行为（图像伪造/篡改），涉及多达132篇论文，其于当年9月被免职，随后有二十余篇论文被撤回。","stances":"调查由NIH主导；学术侦探（如Matthew Schrag、Elisabeth Bik、Kevin Patrick等）此前整理出约300页的证据，指其大量凝胶/印迹图像存在可疑重复使用。事件在科学界引发对阿尔茨海默病研究整体可重复性与“图像诚信”的广泛担忧，也让人追问：当领域权威本身的数据失真，会如何影响数十年的科研方向与经费配置。","impact":"马斯利亚被免职、相关论文陆续撤回，事件推动对阿尔茨海默病研究图像证据与数据可重复性的更高审查标准。","discussion":"该事件凸显“权威信任”与“制度问责”之间的辩证关系。资深领导者掌握资源与评价话语权，其数据若失真，影响将沿科研链条被层层放大。它提示：无论声望多高，都须置于可核查、可追责的同行监督之下，科研公信力不能建立在个人光环之上。","deepdive":"## 一、事件全貌：监管者自身的失守\n\n埃利泽·马斯利亚（Eliezer Masliah）曾任美国国立卫生研究院（NIH）下属国家衰老研究所（NIA）神经科学部主任，是阿尔茨海默病与帕金森病领域的权威。2024年9月，NIH内部调查认定其在多篇论文中存在**图像伪造（falsification）**，涉及论文达百余篇；他于9月23日被免去主任职务，10月被解雇，相关论文陆续撤回。学术侦探（如Matthew Schrag、Elisabeth Bik等）此前整理了约300页证据，指其大量凝胶/印迹图像存在可疑的重复与拼接。该案与莱斯内（Aβ*56）、王浩彦案在时间上相邻，共同构成2020年代阿尔茨海默研究领域的「诚信地震」。\n\n## 二、逐层深挖：权威、图像与资金\n\n其一，**图像证据**：凝胶/印迹图像的重复、拼接是核心，需借助图像取证比对；其二，**权威的放大效应**：作为NIH部门主任，他掌握资源分配与研究方向的话语权，其数据若失真，影响会沿科研链条层层放大，甚至影响公共经费的配置方向；其三，**问责的艰难**：监管者自身的失范，使「谁来监督监督者」成为尖锐问题，最终仍依赖外部学术侦探与NIH内查的结合。\n\n## 三、合理性与不合理性辨析\n\n合理：NIH在调查后对其免职、解雇并启动撤稿，体现了「高位不免责」的问责姿态；学术侦探基于可核查的图像证据进行公开质疑，是必要的外部监督。不合理：其一，失范长期未被发现，说明机构内部的图像/数据审查存在盲区；其二，领域权威的数据失真，可能误导多年研究方向与巨额投入，代价由整个共同体和患者承担。\n\n## 四、科研伦理与哲学维度\n\n伦理上，涉及**诚实**与**责任**：越高的学术权力，对应越重的把关义务。知识论上，图像是证实「有/无某现象」的门槛证据，其伪造直接摧毁结论的经验基础；而当权威自身失真，科学「自我修正」的能力就高度依赖**外部、可复核的监督**。哲学上，这是「**权威信任 vs 制度问责**」的典型：公信力不能建立在个人光环上，只能建立在可核查的证据与透明的程序之上。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「**无论声望多高，都置于可核查的同行监督之下**」。实际：①在审稿与出版环节推广**图像完整性自动筛查**，并对高风险领域的图像证据加大复核；②机构设立独立于当事人的调查机制，覆盖高层管理者；③鼓励并规范「学术侦探」式的公开质疑，保护善意监督；④强化原始图像与数据的存档与调阅；⑤把诚信记录与经费、职务、荣誉硬性挂钩。当监督不因权力而却步，科研公信力才不会被个人的光环绑架。","phases":{"cause":[{"date":"2024-09","desc":"NIH 调查认定马斯利亚在多篇论文中存在图像伪造等科研不端。","idx":0},{"date":"2024-09-23","desc":"马斯利亚在被认定学术不前后被免去NIH/NIA神经科学部主任职务。","idx":1}],"process":[{"date":"2024-09-26","desc":"NIH发布声明，确认其存在研究不端行为。","idx":2}],"result":[{"date":"2024-10","desc":"马斯利亚被解雇，相关论文启动撤稿程序。","idx":3},{"date":"2024-10","desc":"约300页证据公开，相关论文进入撤回程序。","idx":4}]},"related":[{"slug":"sylvain-lesne","name":"明尼苏达大学莱斯内阿尔茨海默论文图片造假","score":89,"region":"国际"},{"slug":"hoau-yan-wang","name":"纽约市立大学王浩彦阿尔茨海默论文撤稿","score":78,"region":"国际"},{"slug":"khalid-shah","name":"哈佛医学院沙阿图像剽窃与数据造假质疑","score":75,"region":"国际"},{"slug":"mukesh-awasthi","name":"研究者穆凯什·阿瓦斯蒂高产撤稿","score":66,"region":"国际"},{"slug":"dan-ariely","name":"杜克行为经济学家阿里埃利数据造假质疑","score":81,"region":"国际"},{"slug":"visfatin","name":"《科学》Visfatin蛋白论文撤稿","score":75,"region":"国际"},{"slug":"adrian-maxim","name":"工程师阿德里安·马克西姆批量撤稿事件","score":69,"region":"国际"},{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"}]},{"key":"wei_yuquan_2006","name":"四川大学魏于全院士论文举报风波","slug":"wei-yuquan","region":"中国","keywords":["魏于全","四川大学","院士","论文造假","举报","司履生","Nature Medicine","2006","肿瘤免疫治疗","学术争议","调查"],"summary":"**2006年**，中国科学院院士、时任四川大学副校长**魏于全**被西安交通大学司履生教授实名举报，称其发表在《中华肿瘤杂志》与《Nature Medicine》上的两篇肿瘤免疫治疗论文涉嫌数据造假（如小鼠肿瘤模型图片问题）。事件经媒体与'新语丝'等平台发酵，四川大学与中科院介入调查。该案长期被视为'学术争议'与'学术不端'界限模糊的典型：举报方坚持造假，被举报方主张为学术观点分歧与方法学争议，官方最终未作出'故意造假'的定性。其价值在于凸显肿瘤免疫治疗早期研究中的方法学审查难题与举报调查的程序透明度。","timeline":[{"date":"2006-03","desc":"司履生在新语丝发表致中科院公开信，实名举报魏于全两篇论文涉嫌造假。"},{"date":"2006-04","desc":"魏于全召开新闻发布会回应，四川大学与中科院表示将认真调查。"}],"ethics":"核心问题：1）论文图片与方法学争议的边界；2）院士层级举报的调查程序与透明度；3）'学术争议'与'学术不端'的界定困难；4）肿瘤免疫治疗研究早期的方法学审视。","sources":[{"title":"新浪科技：四川大学回应副校长学术造假事件","url":"https://tech.sina.com.cn/d/2006-04-17/0754905545.shtml"},{"title":"中青报：中科院应直接调查涉嫌'论文造假'事件","url":"https://zqb.cyol.com/content/2006-04/14/content_1358091.htm"}],"placements":[{"year":2006,"month":3}],"severity":82,"popularity":80,"score":81,"wordcloud":[["举报",9],["调查",7],["院士",5],["司履生",5],["肿瘤",5],["学术",5],["大学",4],["造假",4],["争议",4],["方法",4],["法学",4],["方法学",4],["魏于全",3],["四川大学",3],["论文造假",3],["肿瘤免疫治疗",3],["学术争议",3],["四川",3],["川大",3],["四川大",3],["川大学",3],["瘤免",3],["免疫",3],["疫治",3],["治疗",3],["论文",3],["肿瘤免",3],["瘤免疫",3]],"deepdive":"## 一、事件全貌：四川大学魏于全院士论文举报风波\n\n2006年，中国科学院院士、时任四川大学副校长魏于全被西安交通大学司履生教授实名举报，称其发表在《中华肿瘤杂志》与《Nature Medicine》上的两篇肿瘤免疫治疗论文涉嫌数据造假（如小鼠肿瘤模型图片问题）。事件经媒体与'新语丝'等平台发酵，四川大学与中科院介入调查。该案长期被视为'学术争议'与'学术不端'界限模糊的典型：举报方坚持造假，被举报方主张为学术观点分歧与方法学争议，官方最终未作出'故意造假'的定性。其价值在于凸显肿瘤免疫治疗早期研究中的方法学审查难题与举报调查的程序透明度。 事件时间线上的关键节点包括：2006-03：司履生在新语丝发表致中科院公开信，实名举报魏于全两篇论文涉嫌造假。；2006-04：魏于全召开新闻发布会回应，四川大学与中科院表示将认真调查。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**论文图片与方法学争议的边界**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**院士层级举报的调查程序与透明度**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**'学术争议'与'学术不端'的界定困难**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**肿瘤免疫治疗研究早期的方法学审视**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与四川大学丘小庆Nature Biotechnology论文被举报造假事件、四川大学王竹卿被硕博生集体举报事件、饶毅实名举报曹雪涛李红良裴钢耿美玉风波、复旦大学王正敏院士被学生举报论文造假事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2006-03","desc":"司履生在新语丝发表致中科院公开信，实名举报魏于全两篇论文涉嫌造假。","idx":0}],"process":[],"result":[{"date":"2006-04","desc":"魏于全召开新闻发布会回应，四川大学与中科院表示将认真调查。","idx":1}]},"related":[{"slug":"qiu-xiaoqing","name":"四川大学丘小庆Nature Biotechnology论文被举报造假事件","score":75,"region":"中国"},{"slug":  一、事件全貌：井冈山大学钟华刘涛论文造假事件\n\n2009年至2010年，井冈山大学讲师钟华、刘涛与德国合作者在国际期刊发表的大量论文被查出存在数据编造、图片造假，其中德国合作者Eckhart G. Hahn 卷入。2010年相关期刊集中撤稿数十篇，井冈山大学对二人作出处分。该案是地方高校青年教师参与国际论文造假的突出案例。 事件时间线上的关键节点包括：2009：钟华、刘涛以第一作者身份在多种国际期刊发表大量论文。；2010-01：国外学术打假者举报其论文图片与数据造假，多家期刊启动调查。；2010-03：相关期刊集中撤稿数十篇；井冈山大学对钟华、刘涛作出处理。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**地方高校青年教师为‘科研产出’参与编造数据、图片造假**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**跨国合作中中方作者责任与署名真实性**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**低水平机构批量产出国际论文背后的评价导向问题**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与饶毅实名举报曹雪涛李红良裴钢耿美玉风波、韩国首尔大学黄禹锡干细胞论文造假事件、武汉理工大学周祖德论文抄袭事件、清华大学刘辉简历造假事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2009","desc":"钟华、刘涛以第一作者身份在多种国际期刊发表大量论文。","idx":0}],"process":[{"date":"2010-01","desc":"国外学术打假者举报其论文图片与数据造假，多家期刊启动调查。","idx":1}],"result":[{"date":"2010-03","desc":"相关期刊集中撤稿数十篇；井冈山大学对钟华、刘涛作出处理。","idx":2}]},"related":[{"slug":"rao-yi-whistleblow","name":"饶毅实名举报曹雪涛李红良裴钢耿美玉风波","score":87,"region":"中国"},{"slug":"hwang-woo-suk","name":"韩国首尔大学黄禹锡干细胞论文造假事件","score":87,"region":"国际"},{"slug":"whut-zhou-zude","name":"武汉理工大学周祖德论文抄袭事件","score":65,"region":"中国"},{"slug":"thu-liu-hui","name":"清华大学刘辉简历造假事件","score":66,"region":"中国"},{"slug":"zju-he-haibo","name":"浙江大学贺海波论文造假事件","score":70,"region":"中国"},{"slug":"covid-paper-retraction-2020","name":"2020年新冠相关论文集中撤稿事件","score":75,"region":"中国"},{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"},{"slug":"dufe-yuan-bo","name":"东北财经大学袁博硕士论文抄袭事件","score":60,"region":"中国"}]},{"key":"shu_chen_zhanyun","name":"上海大学陈湛匀博士论文抄袭事件","slug":"shu-chen-zhanyun","keywords":["陈湛匀","上海大学","博士论文抄袭","学术不端","研究生导师","科研诚信","撤销资格"],"summary":"**2009年**，上海大学博士生导师**陈湛匀**被指其**博士论文存在抄袭**。经调查后受到处理，博士生导师资格被取消。该案是2009年论文抄袭集中曝光中的代表性个案。","timeline":[{"date":"2009-06","desc":"网络举报陈湛匀博士论文抄袭。"},{"date":"2009-07","desc":"上海大学调查后认定抄袭，取消其博士生导师资格并作其他处理。"}],"ethics":"核心问题：1）博士生导师自身学术规范的失守；2）导师资格取消的惩戒示范；3）研究生培养中导师垂范作用。","sources":[{"title":"百度百科：陈湛匀","url":"https://baike.baidu.com/item/%E9%99%88%E6%B9%9B%E5%9D%87/0"},{"title":"新浪新闻：上海大学博导陈湛匀因论文抄袭被撤销行政职务","url":"https://news.sina.com.cn/c/2009-04-21/163817656969.shtml"},{"title":"广州医科大学学风建设网：上海大学博导陈湛匀因论文抄袭被撤销行政职务","url":"https://xfjs.gzhmu.edu.cn/info/1027/1055.htm"},{"title":"百度百科：陈湛匀","url":"https://baike.baidu.com/item/%E9%99%88%E6%B9%9B%E5%8C%80/4445117"}],"placements":[{"year":2009,"month":6},{"year":2009,"month":7}],"severity":64,"popularity":55,"region":"中国","score":60,"wordcloud":[["博士",6],["导师",6],["陈湛匀",5],["士生",4],["生导",4],["博士生",4],["士生导",4],["生导师",4],["抄袭",4],["上海大学",3],["博士论文抄袭",3],["学术不端",3],["研究生导师",3],["科研诚信",3],["撤销资格",3],["论文",3],["师资",3],["资格",3],["取消",3],["导师资",3],["师资格",3],["上海",2],["海大",2],["大学",2],["上海大",2],["海大学",2],["陈湛",2],["湛匀",2]],"deepdive":"## 一、事件全貌：上海大学陈湛匀博士论文抄袭事件\n\n2009年，上海大学博士生导师陈湛匀被指其博士论文存在抄袭。经调查后受到处理，博士生导师资格被取消。该案是2009年论文抄袭集中曝光中的代表性个案。 事件时间线上的关键节点包括：2009-06：网络举报陈湛匀博士论文抄袭。；2009-07：上海大学调查后认定抄袭，取消其博士生导师资格并作其他处理。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**博士生导师自身学术规范的失守**——导师权力须与指导责任对称；当资源与评价高度依附于个人，内部纠错失灵，举报人需要制度化保护。 第二、**导师资格取消的惩戒示范**——集体、以学业为赌注才撬动系统，恰恰说明常规监督通道长期失灵。 第三、**研究生培养中导师垂范作用**——顶刊论文的牵连提示，机构自查与期刊复核都不足，必须把把关责任落到署名与数据上。 此外，该案与武汉大学曾梦琪被举报论文代写事件、华东理工大学胡黎明博士论文抄袭事件、王铭铭《想象的异邦》剽窃事件、西南交通大学黄庆博士论文抄袭案等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出导师权力制衡与举报保护的失灵；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n制度正义——当个人须以巨大代价履行本属机构的监督职能，制度即已失职；署名须严格对应真实贡献。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「制衡导师权力、建立反报复举报保护、委员会申诉通道、独立调查、强制原始数据留存」成为硬框架。实际：制衡导师权力、建立反报复举报保护、委员会申诉通道、独立调查、强制原始数据留存，把诚信与招生资格挂钩。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2009-06","desc":"网络举报陈湛匀博士论文抄袭。","idx":0}],"process":[],"result":[{"date":"2009-07","desc":"上海大学调查后认定抄袭，取消其博士生导师资格并作其他处理。","idx":1}]},"related":[{"slug":"zengmengqi-whu","name":"武汉大学曾梦琪被举报论文代写事件","score":75,"region":"中国"},{"slug":"ecust-hu-liming","name":"华东理工大学胡黎明博士论文抄袭事件","score":66,"region":"中国"},{"slug":"wang-mingming","name":"王铭铭《想象的异邦》剽窃事件","score":73,"region":"中国"},{"slug":"swjtu-huang-qing","name":"西南交通大学黄庆博士论文抄袭案","score":71,"region":"中国"},{"slug":"dufe-yuan-bo","name":"东北财经大学袁博硕士论文抄袭事件","score":60,"region":"中国"},{"slug":"xmu-fu-jin","name":"厦门大学傅瑾博士学位造假事件","score":70,"region":"中国"},{"slug":"gztcm-lai-wen","name":"广州中医药大学赖文论文抄袭事件","score":56,"region":"中国"},{"slug":"jgsu-zhong-liu","name":"井冈山大学钟华刘涛论文造假事件","score":67,"region":"中国"}]},{"key":"dufe_yuan_bo","name":"东北财经大学袁博硕士论文抄袭事件","slug":"dufe-yuan-bo","keywords":["袁博","东北财经大学","硕士论文抄袭","学术不端","学位撤销","科研诚信","杨帆"],"summary":"**2009年**，东北财经大学2007届硕士毕业生**袁博**的学位论文被指**整体抄袭**杨帆（同名研究者）的论文，抄袭比例极高。学校撤销其硕士学位。该案因抄袭程度之彻底而广受关注。","timeline":[{"date":"2009-05","desc":"网友比对发现袁博硕士论文与杨帆论文高度雷同。"},{"date":"2009-06","desc":"东北财经大学撤销袁博硕士学位，相关导师被追责。"}],"ethics":"核心问题：1）硕士学位论文审查流于形式；2）全文抄袭反映答辩与抽检机制失效；3）导师对研究生论文把关责任。","sources":[{"title":"百度百科：袁博（论文抄袭）","url":"https://baike.baidu.com/item/%E8%A2%81%E5%8D%9A/0"},{"title":"央视网：史上最牛硕士论文抄袭续——东北财大撤销学生学位","url":"https://news.cctv.com/china/20090529/100200.shtml"},{"title":"中国青年报：东北财大撤销抄袭者硕士学位","url":"https://zqb.cyol.com/content/2009-06/01/content_2688471.htm"},{"title":"环球网：东北财经大学撤销一抄袭论文者硕士学位","url":"https://m.huanqiu.com/article/9CaKrnJlZ9R"}],"placements": nru","name":"北京大学于艳茹博士论文抄袭被撤销学位事件","score":74,"region":"中国"},{"slug":"shu-chen-zhanyun","name":"上海大学陈湛匀博士论文抄袭事件","score":60,"region":"中国"},{"slug":"xmu-fu-jin","name":"厦门大学傅瑾博士学位造假事件","score":70,"region":"中国"},{"slug":"liangying","name":"南京大学梁莹学术不端事件","score":79,"region":"中国"}]},{"key":"ecust_hu_liming","name":"华东理工大学胡黎明博士论文抄袭事件","slug":"ecust-hu-liming","keywords":["胡黎明","华东理工大学","博士论文抄袭","学术不端","副校长","学位撤销","科研诚信"],"summary":"**2009年**，华东理工大学原副校长**胡黎明**被举报其**博士论文抄袭**他人著作。经教育部批复同意，学校撤销其博士学位并取消相关待遇。该案涉及高校校级领导，影响广泛。","timeline":[{"date":"2009-01","desc":"举报胡黎明博士论文抄袭。"},{"date":"2009-02","desc":"学校及教育部调查后撤销其博士学位并取消相应待遇。"}],"ethics":"核心问题：1）高层管理者学术诚信；2）博士学位撤销的层级审批；3）与2009年系列抄袭案共同暴露高校学术自律危机。","sources":[{"title":"百度百科：胡黎明（华东理工大学）","url":"https://baike.baidu.com/item/%E8%83%A1%E9%BB%8E%E6%98%8E/0"},{"title":"Wikiwand：胡黎明博士论文抄袭事件","url":"https://www.wikiwand.com/zh-hans/%E8%83%A1%E9%BB%8E%E6%98%8E%E5%8D%9A%E5%A3%AB%E8%AE%BA%E6%96%87%E6%8A%84%E8%A2%AD%E4%BA%8B%E4%BB%B6"},{"title":"搜狐：华东理工最“坑师”博士生，一篇论文祸及导师院士","url":"https://www.sohu.com/a/375171938_100175020"}],"placements":[{"year":2009,"month":1},{"year":2009,"month":2}],"severity":70,"popularity":60,"region":"中国","score":66,"wordcloud":[["胡黎明",5],["博士",5],["副校长",4],["华东理工大学",3],["博士论文抄袭",3],["学术不端",3],["学位撤销",3],["科研诚信",3],["抄袭",3],["撤销",3],["士学",3],["学位",3],["博士学",3],["士学位",3],["胡黎",2],["黎明",2],["举报",2],["士论",2],["论文",2],["文抄",2],["博士论",2],["士论文",2],["论文抄",2],["文抄袭",2],["教育",2],["育部",2],["教育部",2],["学校",2]],"deepdive":"## 一、事件全貌：上世纪末的一桩博士论文剽窃\r\n1997年6月18日，华东理工大学学位评定委员会认定：该校胡黎明的博士学位论文《CVD反应器中超细粒子的形态控制》存在极其严重的剽窃行为，遂撤销其博士学位及相应职称。这是国内较早被严肃处理的博士论文抄袭案之一，也比后来的网络曝光式打假早了十余年。\n\n## 二、抄袭的具体对象：抄了什么\r\n校方定性为\"极其严重的剽窃\"——论文大段文字与数据直接搬用同领域已有研究成果，属于整篇/整章级别的抄袭，而非零星引用失范。具体比对的底本由校学术委员会掌握并作为处理依据；以今日标准看，即典型的\"博士论文整段搬运他人成果\"。\n\n## 三、如何被发现的：校内审查认定\r\n发现与处理由华东理工校方学术委员会完成（1997年），属早期高校自主查处样本。相较后来的网友曝光，此案更依赖机构内部审查与同行比对，说明即便在没有网络监督的年代，严谨的评审仍能拦下严重不端。\n\n## 四、背后的利益关系与早期警示\r\n作为90年代案例，它预示了\"博士论文买卖/抄袭\"的隐患；胡黎明事发时已有一定学术职位，暴露青年学者在晋升压力下的投机。校方果断撤销学位，具标杆意义，也提示\"严厉查处\"须常态化而非偶发。\n\n## 五、媒体与舆论：各方看法\r\n当时舆论将此作为\"学术打假\"早期胜利；事后被写入多份学风建设教材，作为反面典型。它证明严肃处理能形成震慑，问题是此类个案未能转化为普遍制度。\n\n## 六、科研伦理与哲学维度\r\n核心是原创与学位诚信：博士论文须独立产出，严重剽窃即欺骗评价。公正层面，早期即追责体现\"零容忍\"雏形，但须制度化才能持续。知识论上，学位代表可核查的独创贡献。\n\n## 七、从底层到实际：如何入手解决\r\n①博士论文查重与盲审常态化（彼时尚未普及）；②机构自主查处须透明、留痕；③把早期案例纳入诚信教育；④晋升实行诚信核查；⑤建立不端与学位、职称的联动撤销机制。","phases":{"cause":[{"date":"2009-01","desc":"举报胡黎明博士论文抄袭。","idx":0}],"process":[],"result":[{"date":"2009-02","desc":"学校及教育部调查后撤销其博士学位并取消相应待遇。","idx":1}]},"related":[{"slug":"swjtu-huang-qing","name":"西南交通大学黄庆博士论文抄袭案","score":71,"region":"中国"},{"slug":"gztcm-lai-wen","name":"广州中医药大学赖文论文抄袭事件","score":56,"region":"中国"},{"slug":"dufe-yuan-bo","name":"东北财经大学袁博硕士论文抄袭事件","score":60,"region":"中国"},{"slug":"prov-mech-liu","name":"某省属高校机械博士论文抄袭撤销学位","score":78,"region":"中国"},{"slug":"shu-chen-zhanyun","name":"上海大学陈湛匀博士论文抄袭事件","score":60,"region":"中国"},{"slug":"yu-yanru","name":"北京大学于艳茹博士论文抄袭被撤销学位事件","score":74,"region":"中国"},{"slug":"xmu-fu-jin","name":"厦门大学傅瑾博士学位造假事件","score":70,"region":"中国"},{"slug":"wang-hui","name":"清华教授汪晖博士论文抄袭争议","score":74,"region":"中国"}]},{"key":"gztcm_lai_wen","name":"广州中医药大学赖文论文抄袭事件","slug":"gztcm-lai-wen","keywords":["赖文","广州中医药大学","论文抄袭","学术不端","学位论文","科研诚信"],"summary":"**2009年**，广州中医药大学博士**赖文**的学位论文被指**大段抄袭**他人已发表成果。学校调查后给予处分并撤销相关学位资格。该案为2009年高校论文抄袭集中曝光中的个案。","timeline":[{"date":"2009-03","desc":"网友比对指出赖文学位论文抄袭。"},{"date":"2009-04","desc":"学校调查后认定抄袭并作出处分。"}],"ethics":"核心问题：1）中医药院校学位论文原创性审查；2）抄袭查证与学位撤销；3）与同期系列案件共同反映高校学术规范教育不足。","sources":[{"title":"百度百科：赖文（广州中医药大学）","url":"https://baike.baidu.com/item/%E8%B5%96%E6%96%87/0"},{"title":"中国青年报：女教授联名举报大学校长博士论文抄袭","url":"https://zqb.cyol.com/content/2009-06/18/content_2717251.htm"},{"title":"央视网：广州中医药大学校长被教授联名举报论文抄袭","url":"https://news.cctv.cn/china/20090618/101735.shtml"},{"title":"广州中医药大学：学校通报关于“博士论文问题”的调查情况（官方）","url":"https://www.gzucm.edu.cn/info/1031/59491.htm"}],"placements":[{"year":2009,"month":3},{"year":2009,"month":4}],"severity":60,"popularity":50,"region":"中国","score":56,"wordcloud":[["赖文",5],["学位",5],["抄袭",5],["论文",4],["广州中医药大学",3],["论文抄袭",3],["学术不端",3],["学位论文",3],["科研诚信",3],["位论",3],["学位论",3],["位论文",3],["医药",2],["学校",2],["校调",2],["调查",2],["查后",2],["处分",2],["撤销",2],["学校调",2],["校调查",2],["调查后",2],["高校",2],["文抄",2],["论文抄",2],["文抄袭",2],["校学",2],["广州",1]],"deepdive":"## 一、事件全貌：广州中医药大学赖文论文抄袭事件\n\n2009年，广州中医药大学博士赖文的学位论文被指大段抄袭他人已发表成果。学校调查后给予处分并撤销相关学位资格。该案为2009年高校论文抄袭集中曝光中的个案。 事件时间线上的关键节点包括：2009-03：网友比对指出赖文学位论文抄袭。；2009-04：学校调查后认定抄袭并作出处分。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**中医药院校学位论文原创性审查**——制度的前置监督与可追溯，是防止同类事件反复发生的根本；个案追责之外更需补齐规则短板。 第二、**抄袭查证与学位撤销**——问题长期存在，说明常态化监督与独立调查机制仍有缺位。 第三、**与同期系列案件共同反映高校学术规范教育不足**——把防线前移，比事后通报更能保护公共信任与受试/公共资源安全。 此外，该案与华东理工大学胡黎明博士论文抄袭事件、西南交通大学黄庆博士论文抄袭案、东北财经大学袁博硕士论文抄袭事件、某省属高校机械博士论文抄袭撤销学位等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出常态化监督的缺位；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n科研诚信是共同体的公共信任——任何环节的失范，都会以乘数效应损害整个领域的公信力。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「建立可核查、可问责的常态化监督机制」成为硬框架。实际：建立可核查、可问责的常态化监督机制，把个案整改上升为制度修补，让诚信成为可预期的行为激励。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2009-03","desc":"网友比对指出赖文学位论文抄袭。","idx":0}],"process":[],"result":[{"date":"2009-04","desc":"学校调查后认定抄袭并作出处分。","idx":1}]},"related":[{"slug":"ecust-hu-liming","name":"华东理工大学胡黎明博士论文抄袭事件","score":66,"region":"中国"},{"slug":"swjtu-huang-qing","name":"西南交通大学黄庆博士论文抄袭案","score":71,"region":"中国"},{"slug":"dufe-yuan-bo","name":"东北财经大学袁博硕士论文抄袭事件","score":60,"region":"中国"},{"slug":"prov-mech-liu","name":"某省属高校机械博士论文抄袭撤销学位","score":78,"region":"中国"},{"slug":"ynutcm-li-qingsheng","name":"云南中医学院李庆生论文抄袭事件","score":59,"region":"中国"},{"slug":"zhai-tianlin","name":"翟天临'学术门'事件","score":79,"region":"中国"},{"slug":"shu-chen-zhanyun","name":"上海大学陈湛匀博士论文抄袭事件","score":60,"region":"中国"},{"slug":"yu-yanru","name":"北京大学于艳茹博士论文抄袭被撤销学位事件","score":74,"region":"中国"}]},{"key":"organ_source_2015","name":"2015年中国全面停止使用死刑罪犯器官","slug":"organ-source-2015","keywords":["器官移植","死刑罪犯器官","伦理","卫生部","公民自愿捐献","医学伦理","移植改革"],"summary":"**2015年1月**，中国正式**全面停止使用死刑罪犯器官作为移植供体**，公民自愿捐献成为唯一合法来源。这是中国医学伦理与移植体系与国际接轨的重大里程碑，结束了长期存在的伦理争议。","timeline":[{"date":"2015-01-01","desc":"国家卫计委宣布全面停用死刑罪犯器官，仅以公民自愿捐献为移植来源。"},{"date":"2015-12","desc":"中国人体器官捐献与移植委员会确立阳光分配体系。"}],"ethics":"核心意义：1）终结'死刑犯器官'这一长期伦理争议，确立'自愿、无偿、知情同意'原则；2）推动移植分配透明化；3）是中国医学伦理治理走向国际规范的标志性事件。","sources":[{"title":"中国政府网：中国全面停止使用死刑罪犯器官","url":"https://www.gov.cn/xinwen/2015-01/01/content_2799407.htm"},{"title":"环球网：我国叫停死囚器官移植 自愿捐献将成唯一渠道","url":"https://china.huanqiu.com/article/2015-03/5930848.html"},{"title":"中国新闻网：黄洁夫——取消死囚器官来源标志中国人权事业进步","url":"https://www.chinanews.com.cn/gn/2015/03-11/7120692.shtml"},{"title":"人民网：停用死囚器官还需“自愿捐献”跟进","url":"https://cpc.people.com.cn/pinglun/n/2015/0104/c241220-26320515.html"}],"placements":[{"year":2015,"month":1}],"severity":70,"popularity":62,"region":"中国","score":67,"wordcloud":[["伦理",7],["移植",5],["器官",4],["器官移植",3],["死刑罪犯器官",3],["卫生部",3],["公民自愿捐献",3],["医学伦理",3],["移植改革",3],["死刑",3],["犯器",3],["犯器官",3],["自愿",3],["捐献",3],["全面",2],["面停",2],["用死",2],["刑罪",2],["罪犯",2],["全面停",2],["用死刑",2],["死刑罪",2],["刑罪犯",2],["罪犯器",2],["公民",2],["民自",2],["愿捐",2],["来源",2]],"deepdive":"## 一、事件全貌：2015年中国全面停止使用死刑罪犯器官\n\n2015年1月，中国正式全面停止使用死刑罪犯器官作为移植供体，公民自愿捐献成为唯一合法来源。这是中国医学伦理与移植体系与国际接轨的重大里程碑，结束了长期存在的伦理争议。 事件时间线上的关键节点包括：2015-01-01：国家卫计委宣布全面停用死刑罪犯器官，仅以公民自愿捐献为移植来源。；2015-12：中国人体器官捐献与移植委员会确立阳光分配体系。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**核心意义：**——制度的前置监督与可追溯，是防止同类事件反复发生的根本；个案追责之外更需补齐规则短板。 第二、**终结'死刑犯器官'这一长期伦理争议，确立'自愿、无偿、知情同意'原则**——问题长期存在，说明常态化监督与独立调查机制仍有缺位。 第三、**推动移植分配透明化**——把防线前移，比事后通报更能保护公共信任与受试/公共资源安全。 第四、**是中国医学伦理治理走向国际规范的标志性事件**——制度的前置监督与可追溯，是防止同类事件反复发生的根本；个案追责之外更需补齐规则短板。 此外，该案与郑树森器官移植论文伦理撤稿事件、换头术伦理争议事件、肖飞董袭莹事件（手术离场与学术不端）、武汉病毒所抢注瑞德西韦专利争议等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出常态化监督的缺位；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n科研诚信是共同体的公共信任——任何环节的失范，都会以乘数效应损害整个领域的公信力。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「建立可核查、可问责的常态化监督机制」成为硬框架。实际：建立可核查、可问责的常态化监督机制，把个案整改上升为制度修补，让诚信成为可预期的行为激励。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2015-01-01","desc":"国家卫计委宣布全面停用死刑罪犯器官，仅以公民自愿捐献为移植来源。","idx":0}],"process":[],"result":[{"date":"2015-12","desc":"中国人体器官捐献与移植委员会确立阳光分配体系。","idx":1}]},"related":[{"slug":"zheng-shusen-organ","name":"郑树森器官移植论文伦理撤稿事件","score":74,"region":"中国"},{"slug":"head-transplant","name":"换头术伦理争议事件","score":84,"region":"中国"},{"slug":"xiaofei-dongxiying","name":"肖飞董袭莹事件（手术离场与学术不端）","score":92,"region":"中国"},{"slug":"whiv-remdesivir-2020","name":"武汉病毒所抢注瑞德西韦专利争议","score":75,"region":"中国"},{"slug":"huada-gene-2018","name":"华大基因14万孕妇基因数据争议","score":75,"region":"中国"},{"slug":"zhang-yu-luwei","name":"北医三院张煜举报陆巍过度医疗事件","score":77,"region":"中国"},{"slug":"human-genetic-penalty-2021","name":"2021年人类遗传资源违规处罚案例","score":66,"region":"中国"},{"slug":"covid-paper-retraction-2020","name":"2020年新冠相关论文集中撤稿事件","score":75,"region":"中国"}]},{"key":"covid_paper_retraction_2020","name":"2020年新冠相关论文集中撤稿事件","slug":"covid-paper-retraction-2020","keywords":["新冠","COVID-19","论文撤稿","数据造假","抢发","学术不端","国际期刊","可重复性"],"summary":"**2020年**，随着新冠疫情暴发，大量新冠相关论文被**快速撰写、抢发**，其中多篇因**数据不可靠、方法缺陷或伦理问题**被国际期刊撤稿（如某羟氯喹大型分析文因数据公司 Surgisphere 造假而撤稿）。该事件暴露**突发公卫事件中科研抢发与质量失控**的问题。","timeline":[{"date":"2020-05","desc":"《柳叶刀》等期刊多篇新冠论文因数据问题撤稿。"},{"date":"2020-06","desc":"学界呼吁疫情研究中强化数据共享与伦理审查。"}],"ethics":"核心问题：1）突发公卫危机下论文抢发导致质量与诚信滑坡；2）第三方数据供应商造假难以核验；3）快速同行评审的局限。是全球科研诚信的警示事件。","sources":[{"title":"Nature：新冠疫情期间撤稿潮回顾","url":"https://www.nature.com/articles/d41586-020-01685-y"},{"title":"腾讯新闻：2020十大新冠撤稿事件｜《撤稿观察》年度总结","url":"https://news.qq.com/rain/a/20201217A06M4900"},{"title":"知识分子：2020十大新冠撤稿事件（《撤稿观察》年度总结）","url":"https://www.zhishifenzi.com/innovation/newsview/10571"},{"title":"新浪科技：2020年撤稿事件盘点","url":"https://finance.sina.com.cn/tech/2020-12-25/doc-iiznctke8412417.shtml"},{"title":"第一财经：新冠热门研究论文撤稿，《柳叶刀》陷入信任危机","url":"https://www.yicai.com/news/100657271.html"}],"placements":[{"year":2020,"month":5},{"year":2020,"month":6}],"severity":74,"popularity":76,"region":"中国","score":75,"wordcloud":[["新冠",6],["抢发",6],["数据",5],["问题",4],["论文撤稿",3],["数据造假",3],["学术不端",3],["国际期刊",3],["可重复性",3],["论文",3],["撤稿",3],["事件",3],["疫情",2],["快速",2],["多篇",2],["伦理",2],["期刊",2],["造假",2],["突发",2],["发公",2],["公卫",2],["科研",2],["质量",2],["突发公",2],["发公卫",2],["诚信",2],["冠疫",1],["情暴",1]],"deepdive":"## 一、事件全貌：2020年新冠相关论文集中撤稿事件\n\n2020年，随着新冠疫情暴发，大量新冠相关论文被快速撰写、抢发，其中多篇因数据不可靠、方法缺陷或伦理问题被国际期刊撤稿（如某羟氯喹大型分析文因数据公司 Surgisphere 造假而撤稿）。该事件暴露突发公卫事件中科研抢发与质量失控的问题。 事件时间线上的关键节点包括：2020-05：《柳叶刀》等期刊多篇新冠论文因数据问题撤稿。；2020-06：学界呼吁疫情研究中强化数据共享与伦理审查。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**突发公卫危机下论文抢发导致质量与诚信滑坡**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**第三方数据供应商造假难以核验**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**快速同行评审的局限。是全球科研诚信的警示事件**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与2003年非典期间科研协作与数据共享争议、日本理化学研究所小保方晴子STAP细胞论文造假事件、2023年高校大规模自查撤稿、国家卫健委2026年通报胡凡李萍等论文造假等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2020-05","desc":"《柳叶刀》等期刊多篇新冠论文因数据问题撤稿。","idx":0}],"process":[],"result":[{"date":"2020-06","desc":"学界呼吁疫情研究中强化数据共享与伦理审查。","idx":1}]},"related":[{"slug":"sars-2003-research","name":"2003年非典期间科研协作与数据共享争议","score":62,"region":"中国"},{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"},{"slug":"uni-selfretract-2023","name":"2023年高校大规模自查撤稿","score":67,"region":"中国"},{"slug":"hu-fan-liping-2026","name":"国家卫健委2026年通报胡凡李萍等论文造假","score":74,"region":"中国"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"},{"slug":"khalid-shah","name":"哈佛医学院沙阿图像剽窃与数据造假质疑","score":75,"region":"国际"},{"slug":"jgsu-zhong-liu","name":"井冈山大学钟华刘涛论文造假事件","score":67,"region":"中国"},{"slug":"zhang-zhongqiang-tanxiao","name":"中南大学章忠强谭笑论文学术不端通报","score":67,"region":"中国"}]},{"key":"springer_retraction_2021","name":"2021年施普林格旗下期刊批量撤稿中国作者","slug":"springer-retraction-2021","keywords":["施普林格","Springer","批量撤稿","中国作者","论文工厂","学术不端","特刊","同行评审操纵"],"summary":"**2021年**，施普林格·自然（Springer Nature）旗下多家期刊对**大量中国作者论文**进行批量撤稿，原因集中于**论文工厂代写代投、同行评审操纵、图片造假**。此次撤稿波及医学多个亚专科，再次凸显**论文工厂黑产**对学术生态的侵蚀。","timeline":[{"date":"2021","desc":"Springer Nature 多本期刊集中撤回中国作者可疑论文。"},{"date":"2021-12","desc":"出版商加强特刊与同行评审审查，撤稿持续公布。"}],"ethics":"核心问题：1）论文工厂通过伪造同行评审、代写代投批量产出论文；2）特刊（special issue）成为重灾区；3）机构诚信档案与撤稿联动追责的必要性。","sources":[{"title":"Retraction Watch：Springer Nature 撤稿追踪","url":"https://retractionwatch.com/"},{"title":"封面新闻：107篇中国学者论文遭国外期刊撤稿 这锅谁背？中国科协回应","url":"https://www.thecover.cn/news/324516"},{"title":"苏州大学：中国百余篇国际论文被撤真相","url":"https://ac.suda.edu.cn/f8/d8/c5406a63704/page.psp"},{"title":"意得辑：施普林格（Springer）宣布撤稿107篇稿件，全都来自中国","url":"https://www.editage.cn/insights/2054.html"}],"placements":[{"year":2021,"month":12}],"severity":76,"popularity":72,"region":"中国","score":74,"wordcloud":[["论文",6],["特刊",5],["撤稿",4],["施普林格",3],["批量撤稿",3],["中国作者",3],["论文工厂",3],["学术不端",3],["同行评审操纵",3],["文工",3],["工厂",3],["论文工",3],["文工厂",3],["评审",3],["期刊",2],["国作",2],["批量",2],["代写",2],["写代",2],["代投",2],["代写代",2],["写代投",2],["施普",1],["普林",1],["林格",1],["施普林",1],["普林格",1],["旗下",1]],"deepdive":"## 一、事件全貌：2021年施普林格旗下期刊批量撤稿中国作者\n\n2021年，施普林格·自然（Springer Nature）旗下多家期刊对大量中国作者论文进行批量撤稿，原因集中于论文工厂代写代投、同行评审操纵、图片造假。此次撤稿波及医学多个亚专科，再次凸显论文工厂黑产对学术生态的侵蚀。 事件时间线上的关键节点包括：2021：Springer Nature 多本期刊集中撤回中国作者可疑论文。；2021-12：出版商加强特刊与同行评审审查，撤稿持续公布。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**论文工厂通过伪造同行评审、代写代投批量产出论文**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**特刊（special issue）成为重灾区**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**机构诚信档案与撤稿联动追责的必要性**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与2019年施普林格旗下期刊撤稿中国作者、施普林格撤回64篇疑似论文工厂论文、2024年MDPI等开放获取期刊大规模撤稿、'4·20'107篇中国医学论文集中撤稿事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2021","desc":"Springer Nature 多本期刊集中撤回中国作者可疑论文。","idx":0}],"process":[],"result":[{"date":"2021-12","desc":"出版商加强特刊与同行评审审查，撤稿持续公布。","idx":1}]},"related":[{"slug":"springer-2019","name":"2019年施普林格旗下期刊撤稿中国作者","score":70,"region":"中国"},{"slug":"springer-papermill","name":"施普林格撤回64篇疑似论文工厂论文","score":80,"region":"国际"},{"slug":"mdpi-retraction-2024","name":"2024年MDPI等开放获取期刊大规模撤稿","score":72,"region":"中国"},{"slug":"tumor-biology-107","name":"'4·20'107篇中国医学论文集中撤稿事件","score":87,"region":"中国"},{"slug":"li-chunyang","name":"内蒙古医科大学李春阳代写代投撤稿","score":70,"region":"中国"},{"slug":"jining-hospital-papermill","name":"山东济宁第一人民医院论文工厂撤稿事件","score":78,"region":"中国"},{"slug":"oncotarget-2017","name":"2017年Oncotarget等期刊中国作者撤稿潮","score":70,"region":"中国" ，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**实验原始数据的可核查性**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**大科学合作中个体捏造的防控**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**'不可重复即存疑'的科学自我纠错机制**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与美国贝尔实验室舍恩物理论文数据造假事件、哈佛心理学家豪泽灵长类认知数据造假、华盛顿大学方 ferric 实验室系列撤稿事件、哈佛商学院吉诺行为学研究数据造假等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"1999-08","desc":"尼诺夫团队在《物理评论快报》发表发现118/116号元素的论文。","idx":0}],"process":[],"result":[{"date":"2002-07","desc":"经复核确认数据造假，论文被撤回，尼诺夫被解雇。","idx":1}]},"related":[{"slug":"schon-bell-labs","name":"美国贝尔实验室舍恩物理论文数据造假事件","score":84,"region":"国际"},{"slug":"marc-hauser","name":"哈佛心理学家豪泽灵长类认知数据造假","score":79,"region":"国际"},{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"},{"slug":"francesca-gino","name":"哈佛商学院吉诺行为学研究数据造假","score":87,"region":"国际"},{"slug":"carlo-croce","name":"俄亥俄州立大学克罗齐癌症实验室不端事件","score":80,"region":"国际"},{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"},{"slug":"luk-van-parijs","name":"MIT 教授范帕里斯数据造假被解雇事件","score":75,"region":"国际"},{"slug":"michael-lacour","name":"UCLA拉考尔同性婚姻研究数据伪造案","score":79,"region":"国际"}]},{"key":"ranga_dias_2023","name":"罗切斯特大学迪亚斯室温超导造假案","slug":"ranga-dias","region":"国际","keywords":["Ranga Dias","迪亚斯","室温超导","罗切斯特大学","数据伪造","撤稿","美国","2023","材料物理"],"summary":"**2020–2023年**，美国罗切斯特大学助理教授**兰加·迪亚斯（Ranga Dias）**两次在《自然》（Nature）发表声称实现'室温超导'的论文，引发全球关注，但多个团队无法复现。经调查，论文存在数据操纵与图谱伪造，两篇《自然》论文分别于2022、2023年被撤稿，迪亚斯于2023年被解雇。该案是凝聚态物理领域近年来影响最大的学术不端事件之一。","timeline":[{"date":"2020-10","desc":"迪亚斯发表室温超导论文，后被《自然》撤稿。"},{"date":"2020-10","desc":"迪亚斯团队在《自然》发表室温超导（碳质硫氢化物）封面论文。"},{"date":"2022-09","desc":"该论文被《自然》撤回。"},{"date":"2023-03","desc":"第二篇室温超导论文被《自然》撤稿；同年迪亚斯被罗切斯特大学解雇。"},{"date":"2023-11","desc":"其第二篇室温超导论文再被《自然》撤回，为第三起高关注度撤稿。"},{"date":"2024-11","desc":"罗切斯特大学确认不再聘用被认定数据造假的迪亚斯。"}],"ethics":"核心问题：1）颠覆性物理发现的'数据捷径'；2）顶刊对轰动性结果的复核压力；3）无法复现的承诺型成果的学术与社会成本。","sources":[{"title":"百度百家：Nature透露迪亚斯伪造室温超导细节","url":"https://baijiahao.baidu.com/s?id=1795810880992003790"},{"title":"Wikipedia: Ranga Dias (physicist)","url":"https://en.wikipedia.org/wiki/Ranga_Dias_(physicist)"},{"title":"Nature retracts controversial superconductivity paper by Ranga Dias (Nature)","url":"https://www.nature.com/articles/d41586-023-03398-4"},{"title":"Retraction Note: Room-temperature superconductivity in a carbonaceous sulfur hydride (Nature)","url":"https://www.nature.com/articles/s41586-022-05294-9"},{"title":"Room-Temperature Superconductivity Claim Falls Apart (Quanta Magazine)","url":"https://www.quantamagazine.org/physicists-discover-first-room-temperature-superconductor-20201014/"}],"placements":[{"year":2023,"month":3}],"severity":86,"popularity":84,"score":85,"wordcloud":[["迪亚斯",7],["撤稿",6],["论文",5],["美国",4],["迪亚",4],["亚斯",4],["室温超导",3],["罗切斯特大学",3],["数据伪造",3],["材料物理",3],["室温",3],["温超",3],["超导",3],["室温超",3],["温超导",3],["罗切",2],["切斯",2],["斯特",2],["特大",2],["大学",2],["罗切斯",2],["切斯特",2],["斯特大",2],["特大学",2],["发表",2],["无法",2],["法复",2],["复现",2]],"background":"兰加·迪亚斯（Ranga Dias）为美国罗切斯特大学物理学家，因宣称实现“室温超导”而广受关注。其团队2020年10月在《自然》（Nature）发表碳质硫氢化物在约15℃下超导的封面论文；2022年9月被撤稿后，又于2023年宣称在镥氢化物中实现室温超导，相关论文于2023年11月再被《自然》撤回，成为其第三篇高关注度撤稿。","stances":"研究界担忧此类争议损害超导领域的整体声誉；迪亚斯本人多次对撤稿表示异议、坚持其工作。2024年11月，罗切斯特大学确认已不再聘用被认定存在数据造假行为的迪亚斯。围绕“重大突破的 hype 与证据标准”“期刊审稿把关”的争论持续。","impact":"迪亚斯被解雇、多项论文被撤，事件促使超导界对非常规超导声明加强复核与数据公开要求。","discussion":"该事件呈现“突破叙事的吸引力”与“可重复证据”之间的张力。室温超导若成真将颠覆能源格局，正因 stakes 极高，更须以严苛的数据可核查为前提；而高产、高光环下的数据伪造，也暴露同行评议在“惊人结论”面前的薄弱。辩证综合：科学共识只能建立在可独立复现之上，自我纠错机制是领域健康的最后防线。","deepdive":"## 一、事件全貌：两篇「室温超导」与三次撤稿\n\n美国罗切斯特大学助理教授兰加·迪亚斯（Ranga Dias）于2020年10月在《自然》发表封面论文，宣称碳质硫氢化物在约15℃实现室温超导，引发全球轰动；该文2022年9月被撤。2023年他又宣称镥氢化物实现室温超导，相关《自然》论文于2023年11月再被撤回——这是其第三篇高关注度撤稿。调查认定论文存在数据操纵与图谱伪造，迪亚斯于2023年被解雇，2024年11月罗切斯特大学确认不再聘用。室温超导若成真将颠覆能源格局，正因 stakes 极高，该案的冲击也格外剧烈。\n\n## 二、逐层深挖：hype、复核与「惊人结论」的薄弱审阅\n\n第一，**数据捷径**：在「颠覆性发现」的诱惑下，用伪造数据换取封面与声誉，是经典的「捷径型不端」。第二，**顶刊的复核压力**：《自然》以封面刊发轰动结果，反映期刊对「突破性叙事」的偏好可能压过审慎复核——多个团队无法复现却仍先发表。第三，**复现失败的社会成本**：虚假声明消耗同行大量复现精力、误导青年研究者方向、损害整个超导领域的公共信誉。第四，**同行评议的盲区**：在「惊人结论」面前，审稿人难以仅凭方法识别被操纵的数据，凸显原始数据公开的必要。\n\n## 三、合理性与不合理性辨析\n\n合理：追求室温超导是正当且重要的科学目标，社会对突破的期待可以理解。不合理：其一，以伪造换取个人光环，是对科学共同体的欺骗，也是对真正在该领域耕耘者的不公；其二，封面级声明的仓促发表，把期刊的声望借给了未成熟结论；其三，长期不撤、反复发文，拖延了领域纠偏，扩大了声誉损害。科学的雄心，必须以可核查的证据为前提。\n\n## 四、科研伦理与哲学维度\n\n知识论上，这是「**单一声称 ≠ 知识**」的教科书案例：一个结论要成为科学知识，必须经独立复现；未复现的「突破」只是主张。哲学上，涉及**hype 与证据标准**的张力——越是改变世界的命题，越须承受最严苛的验证。责任伦理上，研究者对**领域与后学**负有责任：一次虚假突破的代价，由整个共同体分摊。这也表明，科学的自我修正（撤稿、复现失败的反驳）是领域健康的最后防线，但防线应前移，而非总在事后。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「**可公开、可复现**」成为惊人结论的发表门槛。实际：①要求突破性声明**公开原始测量数据、处理代码与材料配方**，供独立复现；②期刊对封面级/颠覆性结果实行**强化复核与独立验证**前置；③建立领域数据标准与「复现优先」的发表激励；④对数据操纵者严肃问责并追回荣誉与经费；⑤鼓励复现研究，把「证伪」视为与「发现」同等重要的贡献。唯有让证据跑在叙事前面，室温超导的梦想才不会沦为信用泡沫。","phases":{"cause":[{"date":"2020-10","desc":"迪亚斯发表室温超导论文，后被《自然》撤稿。","idx":0},{"date":"2020-10","desc":"迪亚斯团队在《自然》发表室温超导（碳质硫氢化物）封面论文。","idx":1}],"process":[{"date":"2022-09","desc":"该论文被《自然》撤回。","idx":2},{"date":"2023-03","desc":"第二篇室温超导论文被《自然》撤稿；同年迪亚斯被罗切斯特大学解雇。","idx":3}],"result":[{"date":"2023-11","desc":"其第二篇室温超导论文再被《自然》撤回，为第三起高关注度撤稿。","idx":4},{"date":"2024-11","desc":"罗切斯特大学确认不再聘用被认定数据造假的迪亚斯。","idx":5}]},"related":[{"slug":"jonathan-pruitt","name":"麦克马斯特大学普鲁伊特蜘蛛行为数据造假","score":74,"region":"国际"},{"slug":"surgisphere-covid","name":"美国Surgisphere公司新冠数据造假致顶刊撤稿事件","score":89,"region":"国际"},{"slug":"victor-ninov","name":"伯克利实验室尼诺夫伪造超重元素事件","score":76,"region":"国际"},{"slug":"michael-lacour","name":"UCLA拉考尔同性婚姻研究数据伪造案","score":79,"region":"国际"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"lancet-covid-outcomes","name":"《柳叶刀》新冠出院后6个月结局论文撤稿","score":84,"region":"国际"},{"slug":"jasti-rao","name":"伊利诺伊大学拉奥神经外科手术论文撤稿潮","score":76,"region":"国际"},{"slug":"francesca-gino","name":"哈佛商学院吉诺行为学研究数据造假","score":87,"region":"国际"}]},{"key":"yoshihiro_sato_2018","name":"日本骨骼研究者佐藤能启大规模论文造假","slug":"yoshihiro-sato","region":"国际","keywords":["Yoshihiro Sato","佐藤能启","骨科","骨质疏松","数据伪造","撤稿","日本","2018","流行病学"],"summary":"**1993–2018年**，日本骨骼健康研究者**佐藤能启（Yoshihiro Sato）**被查出在 1993–2013 年间伪造、篡改大量骨折与骨质疏松研究的受试者数据与统计结果，涉及论文逾百篇（部分来源称逾 200 篇），其结论曾被临床指南与荟萃分析引用。2018年《科学》（Science）专题报道其'史诗级欺诈'，相关论文被大规模撤稿。该案是医学领域除藤井善隆外又一位'以数量著称'的造假者。","timeline":[{"date":"2018-08","desc":"《科学》刊文揭露佐藤能启逾百篇论文涉嫌数据造假，引发大规模撤稿。"}],"ethics":"核心问题：1）流行病学/临床试验数据的系统性伪造；2）被撤稿数据已渗入临床指南的危害；3）长期、高产造假为何多年未被发现。","sources":[{"title":"Science: Researcher at the center of an epic fraud remains an enigma","url":"https://www.science.org/content/article/researcher-center-epic-fraud-remains-enigma-those-who-exposed-him"},{"title":"知乎：佐藤科研造假案反思","url":"https://zhuanlan.zhihu.com/p/81407485"}],"placements":[{"year":2018,"month":8}],"severity":82,"popularity":70,"score":77,"wordcloud":[["撤稿",6],["日本",4],["数据",4],["佐藤能启",3],["骨科",3],["骨质疏松",3],["数据伪造",3],["流行病学",3],["论文",3],["临床",3],["造假",3],["研究",2],["佐藤",2],["藤能",2],["能启",2],["佐藤能",2],["藤能启",2],["伪造",2],["逾百",2],["百篇",2],["逾百篇",2],["床指",2],["指南",2],["临床指",2],["床指南",2],["科学",2],["大规",2],["规模",2]],"deepdive":"## 一、事件全貌：日本骨骼研究者佐藤能启大规模论文造假\n\n1993–2018年，日本骨骼健康研究者佐藤能启（Yoshihiro Sato）被查出在 1993–2013 年间伪造、篡改大量骨折与骨质疏松研究的受试者数据与统计结果，涉及论文逾百篇（部分来源称逾 200 篇），其结论曾被临床指南与荟萃分析引用。2018年《科学》（Science）专题报道其'史诗级欺诈'，相关论文被大规模撤稿。该案是医学领域除藤井善隆外又一位'以数量著称'的造假者。 事件时间线上的关键节点包括：2018-08：《科学》刊文揭露佐藤能启逾百篇论文涉嫌数据造假，引发大规模撤稿。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**流行病学/临床试验数据的系统性伪造**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**被撤稿数据已渗入临床指南的危害**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**长期、高产造假为何多年未被发现**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与德国麻醉学家博尔特大规模撤稿事件、日本理化学研究所小保方晴子STAP细胞论文造假事件、挪威医生苏德伯伪造口腔癌研究数据事件、美国麻醉学家鲁本数据伪造入狱案等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2018-08","desc":"《科学》刊文揭露佐藤能启逾百篇论文涉嫌数据造假，引发大规模撤稿。","idx":0}],"process":[],"result":[]},"related":[{"slug":"joachim-boldt","name":"德国麻醉学家博尔特大规模撤稿事件","score":80,"region":"国际"},{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"scott-reuben","name":"美国麻醉学家鲁本数据伪造入狱案","score":75,"region":"国际"},{"slug":"luk-van-parijs","name":"MIT 教授范帕里斯数据造假被解雇事件","score":75,"region":"国际"},{"slug":"michael-lacour","name":"UCLA拉考尔同性婚姻研究数据伪造案","score":79,"region":"国际"},{"slug":"fujii-retractions","name":"日本麻醉医生藤井善隆创纪录撤稿事件","score":78,"region":"国际"},{"slug":"dan-ariely","name":"杜克行为经济学家阿里埃利数据造假质疑","score":81,"region":"国际"}]},{"key":"naoki_mori_2014","name":"日本琉球大学森直树图像操纵撤稿案","slug":"naoki-mori","region":"国际","keywords":["Naoki Mori","森直树","琉球大学","病毒学","图像操纵","撤稿","日本","2014","Western blot"],"summary":"**2013–2014年**，日本琉球大学病毒学家**森直树（Naoki Mori）**被认定在多篇论文中操纵 Western blot 等图像（图片复制、拼接），导致数十篇论文被撤稿。其案例与藤井善隆、加藤茂明等共同构成日本'图像诚信危机'的典型，也是撤稿排行榜上长期居前的日本学者之一。","timeline":[{"date":"2014-01","desc":"森直树多篇论文因图像操纵被陆续撤稿。"}],"ethics":"核心问题：1）Western blot 图像的系统操纵；2）日本生命科学界的图片诚信危机；3）撤稿对病毒学领域证据的冲击。","sources":[{"title":"Retraction Watch: Naoki Mori retractions","url":"https://retractionwatch.com/category/by-author/naoki-mori-retractions/"},{"title":"NCBI: Case study 4, Naoki Mori","url":"https://www.ncbi.nlm.nih.gov/books/NBK519803/box/box004/?report=objectonly"}],"placements":[{"year":2014,"month":1}],"severity":78,"popularity":66,"score":73,"wordcloud":[["撤稿",7],["日本",7],["森直树",5],["病毒学",5],["图像",4],["琉球大学",3],["图像操纵",3],["篇论",3],["论文",3],["操纵",3],["篇论文",3],["病毒",2],["毒学",2],["森直",2],["直树",2],["多篇",2],["多篇论",2],["图片",2],["诚信",2],["信危",2],["危机",2],["诚信危",2],["信危机",2],["本琉",1],["琉球",1],["球大",1],["大学",1],["学病",1]],"deepdive":"## 一、事件全貌：日本琉球大学森直树图像操纵撤稿案\n\n2013–2014年，日本琉球大学病毒学家森直树（Naoki Mori）被认定在多篇论文中操纵 Western blot 等图像（图片复制、拼接），导致数十篇论文被撤稿。其案例与藤井善隆、加藤茂明等共同构成日本'图像诚信危机'的典型，也是撤稿排行榜上长期居前的日本学者之一。 事件时间线上的关键节点包括：2014-01：森直树多篇论文因图像操纵被陆续撤稿。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**Western blot 图像的系统操纵**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**日本生命科学界的图片诚信危机**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**撤稿对病毒学领域证据的冲击**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与伊利诺伊大学拉奥神经外科手术论文撤稿潮、日本内分泌学家加藤茂明图片操纵撤稿、南开大学校长曹雪涛论文图片造假质疑事件、韦恩州立大学萨尔卡癌症论文批量撤稿等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2014-01","desc":"森直树多篇论文因图像操纵被陆续撤稿。","idx":0}],"process":[],"result":[]},"related":[{"slug":"jasti-rao","name":"伊利诺伊大学拉奥神经外科手术论文撤稿潮","score":76,"region":"国际"},{"slug":"shigeaki-kato","name":"日本内分泌学家加藤茂明图片操纵撤稿","score":74,"region":"国际"},{"slug":"cao-xuetao","name":"南开大学校长曹雪涛论文图片造假质疑事件","sc

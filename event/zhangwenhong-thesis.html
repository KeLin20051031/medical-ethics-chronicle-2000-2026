筛查才是把住关的前置条件。 第三、**合作者与学生的连带影响**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与罗切斯特大学迪亚斯室温超导造假案、俄亥俄州立大学克罗齐癌症实验室不端事件、UCLA拉考尔同性婚姻研究数据伪造案、天津大学张裕卿教授被学生123页PDF举报学术造假事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2020-02","desc":"麦克马斯特大学确认调查普鲁伊特数据异常，后续多篇论文撤稿。","idx":0}],"process":[],"result":[{"date":"2022-01","desc":"普鲁伊特从麦克马斯特大学辞职。","idx":1}]},"related":[{"slug":"ranga-dias","name":"罗切斯特大学迪亚斯室温超导造假案","score":85,"region":"国际"},{"slug":"carlo-croce","name":"俄亥俄州立大学克罗齐癌症实验室不端事件","score":80,"region":"国际"},{"slug":"michael-lacour","name":"UCLA拉考尔同性婚姻研究数据伪造案","score":79,"region":"国际"},{"slug":"zhang-yuqing","name":"天津大学张裕卿教授被学生123页PDF举报学术造假事件","score":85,"region":"中国"},{"slug":"stapel-psychology","name":"荷兰蒂尔堡大学斯塔佩尔心理学数据造假事件","score":79,"region":"国际"},{"slug":"xu-zhongmin","name":"中科院徐中民'赞导师师娘'论文事件","score":82,"region":"中国"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"milena-penkowa","name":"丹麦神经科学家彭科娃数据造假获刑案","score":74,"region":"国际"}]},{"key":"jesse_gelsinger_2000","name":"盖尔辛格基因治疗死亡事件与伦理调查","slug":"jesse-gelsinger","region":"国际","keywords":["Jesse Gelsinger","盖尔辛格","基因治疗","宾大","知情同意","伦理审查","美国","2000","FDA"],"summary":"**1999–2000年**，18岁患者**杰西·盖尔辛格（Jesse Gelsinger）**在宾夕法尼亚大学一项基因治疗试验中死亡，成为首例公开记录的基因治疗致死案例。事后调查发现试验存在知情同意不充分、受试者入组标准被放宽、研究者与商业公司存在利益冲突等问题，FDA 于2000年叫停并展开调查。该案深刻重塑了人体试验的伦理审查与知情同意规范。","timeline":[{"date":"1999-09","desc":"盖尔辛格在宾大基因治疗试验中死亡。"},{"date":"1999-09-13","desc":"杰西作为受试者接受高剂量腺病毒载体基因治疗输注。"},{"date":"1999-09-17","desc":"杰西因严重免疫反应、多器官衰竭不幸离世。"},{"date":"1999-11-04","desc":"FDA公开指称宾夕法尼亚大学团队在试验中存在过失。"},{"date":"2000","desc":"基因治疗领域研究大幅收缩，监管与伦理规范启动改革。"},{"date":"2000-01","desc":"FDA 介入调查，叫停相关试验，推动人体试验伦理规范改革。"}],"ethics":"核心问题：1）人体试验知情同意的充分性；2）受试者准入标准的坚守；3）研究者与商业公司的利益冲突；4）高风险试验的风险告知。","sources":[{"title":"Science History: The Death of Jesse Gelsinger, 20 Years Later","url":"https://www.sciencehistory.org/stories/magazine/the-death-of-jesse-gelsinger-20-years-later/"},{"title":"PMC: Death but one unintended consequence of gene-therapy trial","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC81135/"},{"title":"The Death of Jesse Gelsinger, 20 Years Later (Science History Institute)","url":"https://www.sciencehistory.org/distillations/the-death-of-jesse-gelsinger-20-years-later"},{"title":"F.D.A. Officials Fault Penn Team in Gene Therapy Death (NYT archive)","url":"https://archive.nytimes.com/www.nytimes.com/library/national/science/health/120999hth-gene-therapy.html"}],"placements":[{"year":2000,"month":1}],"severity":88,"popularity":85,"score":87,"wordcloud":[["试验",8],["宾大",4],["盖尔辛格",3],["基因治疗",3],["知情同意",3],["伦理审查",3],["美国",3],["治疗",3],["调查",3],["知情",3],["情同",3],["同意",3],["知情同",3],["情同意",3],["人体",3],["体试",3],["人体试",3],["体试验",3],["盖尔",2],["尔辛",2],["辛格",2],["盖尔辛",2],["尔辛格",2],["疗试",2],["死亡",2],["治疗试",2],["疗试验",2],["充分",2]],"background":"杰西·格尔辛格（Jesse Gelsinger）是一名患有鸟氨酸氨甲酰基转移酶（OTC）缺乏症的美国少年。1999年9月，18岁的他参与宾夕法尼亚大学詹姆斯·威尔逊（James Wilson）实验室主导的一项基因治疗临床试验，接受高剂量重组腺病毒载体注射后产生剧烈免疫反应、多器官衰竭，于9月17日死亡，被认为是全球首例直接由基因治疗临床试验导致的死亡案例。","stances":"事后FDA调查发现，试验在知情同意、方案执行上存在缺陷，且试验负责人威尔逊与承接该技术的公司存在股权等利益冲突；试验在已有动物数据示警的情况下仍继续推进，引发公众对受试者安全与科研伦理的强烈质疑。该事件成为医学研究伦理失败的标志性悲剧。","impact":"事件导致全球基因治疗研究在1999—2000年间立项锐减约80%，并推动FDA加强对基因治疗试验的审查、受试者保护与知情同意制度的改革。","discussion":"该事件浓缩了“医学突破的希望”与“受试者安全的底线”之间的尖锐张力。当研究者兼具科学雄心与商业利益，而受试者多为满怀期待的脆弱个体时，知情同意的充分性与利益冲突的隔离便关乎生死。它深刻提示：前沿疗法的探索，必须以不可逾越的安全与伦理护栏为前提。","deepdive":"## 一、事件全貌：首例基因治疗致死\n\n1999年9月，18岁、患有鸟氨酸氨甲酰基转移酶（OTC）缺乏症的杰西·盖尔辛格，在宾夕法尼亚大学詹姆斯·威尔逊实验室主导的基因治疗试验中，接受**高剂量重组腺病毒载体**输注，数日后因剧烈免疫反应与多器官衰竭于9月17日死亡，被视为全球首例由基因治疗临床试验直接导致的死亡。随后美国FDA调查指出试验在**知情同意与方案执行**上存在缺陷，且研究负责人与承接该技术的公司存在股权等**利益冲突**；在已有动物（猴）死亡等风险信号的情况下，试验仍在推进。事件导致基因治疗研究在1999—2000年间大幅收缩。\n\n## 二、逐层深挖：同意、准入与利益冲突\n\n其一，**知情同意不充分**：同意书未如实、充分地揭示风险（包括此前动物实验的死亡信号），也未充分说明研究者与公司之间的经济利益。其二，**受试者准入被放宽**：按照方案，其血氨水平本不应入组，却仍被纳入，安全护栏被突破。其三，**利益冲突未被隔离**：研究者持有公司股权，存在推动试验的财务动机。其四，**风险告知不足**：高剂量腺病毒的免疫风险此前已有前兆，却未被充分预警。\n\n## 三、合理性与不合理性辨析\n\n合理：OTC缺乏症严重威胁生命，患者与家庭对「治愈」抱有真切期待，探索新疗法的动机正当。不合理：当研究者的**财务利益**与受试者的**生命安全**发生冲突时，未被隔离；当既有风险信号出现时，选择了**继续推进而非中止**；当知情同意被简化为形式签字时，受试者的自主与安全被架空。\n\n## 四、科研伦理与哲学维度\n\n伦理上，这是**尊重自主（知情同意）**、**不伤害**、**有利**与**公正**被同时挑战的经典案例，凸显**利益冲突管理制度**的必要性。哲学上，它拷问「医学进步的希望」与「受试者不可被工具化」的边界：个体不能仅仅作为实现科学目标的手段（康德意义上的目的—手段原则）。此外，高风险试验中的**预防原则**要求「举证责任在推进方」。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「**受试者安全优先于研究进度与商业利益**」成为不可让渡的原则。实际：①强化知情同意的实质性与动态更新，确保风险（含动物数据）如实告知；②严格执行准入标准，杜绝为凑数而放宽；③强制披露并隔离研究者与资助方/企业的利益冲突；④对高风险首次人体试验实行独立的数据安全监查与中止规则；⑤完善受试者赔偿与问责制度。本案推动了美国受试者保护与伦理审查制度的改革，正是一份「以生命换来的制度」样本。","phases":{"cause":[{"date":"1999-09","desc":"盖尔辛格在宾大基因治疗试验中死亡。","idx":0},{"date":"1999-09-13","desc":"杰西作为受试者接受高剂量腺病毒载体基因治疗输注。","idx":1}],"process":[{"date":"1999-09-17","desc":"杰西因严重免疫反应、多器官衰竭不幸离世。","idx":2},{"date":"1999-11-04","desc":"FDA公开指称宾夕法尼亚大学团队在试验中存在过失。","idx":3}],"result":[{"date":"2000","desc":"基因治疗领域研究大幅收缩，监管与伦理规范启动改革。","idx":4},{"date":"2000-01","desc":"FDA 介入调查，叫停相关试验，推动人体试验伦理规范改革。","idx":5}]},"related":[{"slug":"phase1-volunteer-2016","name":"健康受试者（试药人）药物临床试验安全争议","score":69,"region":"中国"},{"slug":"genetic-company-2023","name":"2023年基因测序企业违规采集遗传资源案例","score":65,"region":"中国"},{"slug":"huada-gene-2018","name":"华大基因14万孕妇基因数据争议","score":75,"region":"中国"},{"slug":"macchiarini-trachea","name":"瑞典卡罗林斯卡医学院马基亚里尼合成气管移植丑闻","score":92,"region":"国际"},{"slug":"irb-fabrication-2023","name":"2023年医疗机构伦理审查材料造假曝光","score":72,"region":"中国"},{"slug":"sabine-hazan","name":"哈赞粪便移植与伊维菌素新冠论文撤稿","score":71,"region":"国际"},{"slug":"golden-rice","name":"黄金大米事件","score":86,"region":"中国"},{"slug":"bio-qian","name":"钱某基因治疗临床试验数据造假案","score":81,"region":"中国"}]},{"key":"seralini_gmo_2012","name":"塞拉利尼转基因玉米大鼠致癌争议撤稿","slug":"seralini-gmo","region":"国际","keywords":["Séralini","塞拉利尼","转基因","大鼠","肿瘤","撤稿","争议","法国","2012"," reproducibility"],"summary":"**2012–2014年**，法国卡昂大学学者**吉勒-埃里克·塞拉利尼（Gilles-Eric Séralini）**在《食品与化学毒理学》发表转基因玉米（抗除草剂）长期喂养致大鼠肿瘤的研究，引发全球对转基因食品安全性的激烈争论。该文因实验设计（大鼠品系、样本量）受质疑，于2013年被撤稿；2014年又在另一期刊重新发表。该案是'争议性撤稿'与'学术自由/出版伦理'博弈的代表，并非确证造假，但凸显可重复性与同行评议争议。","timeline":[{"date":"2012-09","desc":"塞拉利尼发表转基因玉米致大鼠肿瘤研究，引发全球争议。"},{"date":"2013-11","desc":"原期刊以'结论不可靠'为由撤稿；2014年另刊重新发表。"}],"ethics":"核心问题：1）实验设计与统计效力的争议；2）高关注度研究的撤稿边界；3）出版伦理与'反击性重新发表'；4）科学传播的公众误导风险。","sources":[{"title":"果壳：转基因玉米致癌研究撤稿","url":"https://m.guokr.com/article/437869"},{"title":"Antpedia：受争议转基因论文再获发表","url":"https://www.antpedia.com/viewspace-423188"}],"placements":[{"year":2012,"month":9}],"severity":80,"popularity":78,"score":79,"wordcloud":[["撤稿",7],["争议",7],["大鼠",6],["肿瘤",5],["发表",5],["法国",4],["塞拉利尼",3],["转基因",3],["转基",3],["研究",3],["重新",3],["新发",3],["重新发",3],["新发表",3],["塞拉",2],["拉利",2],["利尼",2],["塞拉利",2],["拉利尼",2],["食品",2],["表转",2],["玉米",2],["发表转",2],["表转基",2],["致大",2],["鼠肿",2],["致大鼠",2],["大鼠肿",2]],"deepdive":"## 一、事件全貌：一张\"大鼠肿瘤\"照片引发的全球反转基因浪潮\r\n2012年9月19日，法国卡昂大学分子生物学教授塞拉利尼（Gilles-Éric Séralini）团队在《食品与化学毒理学》（Food and Chemical Toxicology）发表研究，称长期喂食抗草甘膦转基因\"农达\"玉米的大鼠，肿瘤发生率显著升高，并配发大鼠浑身长满巨大肿瘤的照片。论文迅速被反转基因阵营奉为\"圣经\"。但2013年11月28日，该刊在作者拒绝撤回的情况下主动撤稿，引发巨大争议；2014年论文改在《环境与毒理化学》重新发表。\n\n## 二、具体争议：是\"造假\"还是\"设计缺陷\"\r\n严格说，此案并非图像PS造假，而是实验设计与统计方法的严重缺陷：①所用Sprague-Dawley大鼠本身高发肿瘤，对照组晚年本就易长瘤；②每组仅10只、样本量过小，统计不足以支撑\"致癌\"结论；③刻意选用最戏剧性的肿瘤照片作宣传。即结论被\"放大\"且方法不可靠，被科学界普遍认定为\"劣质研究\"而非蓄意伪造——但那张肿瘤照片确在中文互联网反复\"复活\"，误导公众。\n\n## 三、如何被发现的：同行复核与期刊撤稿\r\n发现机制是科学共同体的质疑：论文一出，毒理与统计学者即指出样本量小、选种偏倚、统计不当；欧洲食品安全局（EFSA）等机构评估后认为\"结论不成立\"。《食品与化学毒理学》在作者拒撤后于2013年主动撤稿（理由：结论不确定性、无法满足可靠结论标准）。值得注意的是，撤稿也引发\"期刊受压\"的争论。\n\n## 四、背后的利益关系与舆论武器化\r\n塞拉利尼研究被反转基因运动、有机食品产业用作\"证据\"，而转基因支持方与农化企业则力主撤稿。事件凸显：一项方法存疑的研究，如何被立场双方\"武器化\"。作者2014年改投他刊重发，坚持己见；其研究资助与立场也遭对方质疑。\n\n## 五、媒体与舆论：各方看法\r\n舆论两极：反转基因者视其为\"真相\"；科学界与监管机构（EFSA、WHO等后续评估）认为证据不足。中文互联网上那张肿瘤图长期流传，成为\"转基因有毒\"的视觉符号。媒体（环球网、知乎科普等）持续辨析。\n\n## 六、科研伦理与哲学维度\r\n核心是证据标准与传播责任：即便研究动机非造假，用缺陷方法得出耸动结论并配图宣传，仍违背负责任的传播。知识论上，结论须来自充分、可重复的证据；统计缺陷使结论无效。公正层面，科学结论不应被立场裹挟。\n\n## 七、从底层到实际：如何入手解决\r\n①期刊对结论耸动的研究实行更严统计审查与样本量要求；②区分\"撤稿因缺陷\"与\"撤稿因造假\"，透明说明；③科普须标注证据等级，避免单张图误导；④鼓励独立复现；⑤监管基于多机构综合评估而非单篇研究。","phases":{"cause":[{"date":"2012-09","desc":"塞拉利尼发表转基因玉米致大鼠肿瘤研究，引发全球争议。","idx":0}],"process":[],"result":[{"date":"2013-11","desc":"原期刊以'结论不可靠'为由撤稿；2014年另刊重新发表。","idx":1}]},"related":[{"slug":"didier-raoult","name":"法国学者拉乌尔羟氯喹论文撤稿事件","score":87,"region":"国际"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"lancet-covid-outcomes","name":"《柳叶刀》新冠出院后6个月结局论文撤稿","score":84,"region":"国际"},{"slug":"dirk-smeesters","name":"伊拉斯谟大学斯梅斯特营销数据操纵案","score":74,"region":"国际"},{"slug":"visfatin","name":"《科学》Visfatin蛋白论文撤稿","score":75,"region":"国际"},{"slug":"predimed","name":"《新英格兰医学杂志》地中海饮食研究撤稿","score":80,"region":"国际"},{"slug":"covid-retraction-2020","name":"2020年新冠相关论文全球撤稿潮","score":89,"region":"国际"}]},{"key":"dirk_smeesters_2012","name":"伊拉斯谟大学斯梅斯特营销数据操纵案","slug":"dirk-smeesters","region":"国际","keywords":["Dirk Smeesters","斯梅斯特","伊拉斯谟大学","市场营销","数据操纵","撤稿","荷兰","2012","心理学"],"summary":"**2012年**，荷兰伊拉斯谟大学鹿特丹分校市场营销心理学家**德克·斯梅斯特（Dirk Smeesters）**被美国匿名'数据侦探'通过统计手段揭发，其在多项研究中通过'美化'数据（将结果向假设方向调整）获得过于完美的结果。多篇论文被撤稿，斯梅斯特于同年辞职。该案是行为/营销科学中'可疑研究实践'被统计识别的早期代表。","timeline":[{"date":"2012-06","desc":"匿名统计核查揭露斯梅斯特数据操纵，校方启动调查。"},{"date":"2012-07","desc":"斯梅斯特辞职，相关论文陆续撤稿。"}],"ethics":"核心问题：1）'数据粉饰'（data massage）与 p-hacking 的边界；2）统计异常作为造假识别信号；3）营销/心理学中的可疑研究实践。","sources":[{"title":"Science: Rotterdam marketing psychologist resigns after data investigation","url":"https://www.science.org/content/article/rotterdam-marketing-psychologist-resigns-after-university-investigates-his-data"},{"title":"Stanford BPS: Dirk Smeesters","url":"https://bps.stanford.edu/home/instances-scientific-misconduct/instances-scientific-misconduct-dirk-smeesters"}],"placements":[{"year":2012,"month":6}],"severity":76,"popularity":70,"score":74,"wordcloud":[["撤稿",5],["心理学",5],["荷兰",4],["斯梅",4],["梅斯",4],["斯特",4],["斯梅斯",4],["梅斯特",4],["数据",4],["统计",4],["斯梅斯特",3],["伊拉斯谟大学",3],["市场营销",3],["数据操纵",3],["营销",3],["研究",3],["心理",2],["理学",2],["匿名",2],["论文",2],["辞职",2],["可疑",2],["疑研",2],["究实",2],["实践",2],["可疑研",2],["疑研究",2],["研究实",2]],"deepdive":"## 一、事件全貌：伊拉斯谟大学斯梅斯特营销数据操纵案\n\n2012年，荷兰伊拉斯谟大学鹿特丹分校市场营销心理学家德克·斯梅斯特（Dirk Smeesters）被美国匿名'数据侦探'通过统计手段揭发，其在多项研究中通过'美化'数据（将结果向假设方向调整）获得过于完美的结果。多篇论文被撤稿，斯梅斯特于同年辞职。该案是行为/营销科学中'可疑研究实践'被统计识别的早期代表。 事件时间线上的关键节点包括：2012-06：匿名统计核查揭露斯梅斯特数据操纵，校方启动调查。；2012-07：斯梅斯特辞职，相关论文陆续撤稿。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**'数据粉饰'（data massage）与 p-hacking 的边界**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**统计异常作为造假识别信号**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**营销/心理学中的可疑研究实践**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与荷兰社会心理学家福斯特数据异常事件、荷兰蒂尔堡大学斯塔佩尔心理学数据造假事件、哈佛心理学家豪泽灵长类认知数据造假、康奈尔万辛克食品心理学p值操纵撤稿等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2012-06","desc":"匿名统计核查揭露斯梅斯特数据操纵，校方启动调查。","idx":0}],"process":[],"result":[{"date":"2012-07","desc":"斯梅斯特辞职，相关论文陆续撤稿。","idx":1}]},"related":[{"slug":"jens-forster","name":"荷兰社会心理学家福斯特数据异常事件","score":76,"region":"国际"},{"slug":"stapel-psychology","name":"荷兰蒂尔堡大学斯塔佩尔心理学数据造假事件","score":79,"region":"国际"},{"slug":"marc-hauser","name":"哈佛心理学家豪泽灵长类认知数据造假","score":79,"region":"国际"},{"slug":"brian-wansink","name":"康奈尔万辛克食品心理学p值操纵撤稿","score":79,"region":"国际"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"lancet-covid-outcomes","name":"《柳叶刀》新冠出院后6个月结局论文撤稿","score":84,"region":"国际"},{"slug":"a-salar-elahi","name":"研究者A·萨拉·埃拉希高产撤稿","score":66,"region":"国际"}]},{"key":"adrian_maxim_2024","name":"工程师阿德里安·马克西姆批量撤稿事件","slug":"adrian-maxim","region":"国际","keywords":["Adrian Maxim","马克西姆","电子工程","图像重复","撤稿","论文工厂","美国","2024","48篇"],"summary":"**2024年前后**，电气工程师**阿德里安·马克西姆（Adrian Maxim）**（曾任职 Silicon Labs 等）被查出约 **48 篇**论文存在图像重复、不当操纵等问题，且部分与论文工厂（paper mill）活动相关，成为近年撤稿数量突出的工程领域案例。该案显示图像诚信问题已蔓延至工程与信号处理领域。","timeline":[{"date":"2024-12","desc":"马克西姆约48篇论文因图像问题被大规模撤稿/标记。"}],"ethics":"核心问题：1）工程领域图像重复的系统性；2）论文工厂向工程学科渗透；3）高撤稿量对学科文献基础的冲击。","sources":[{"title":"Stanford BPS: Adrian Maxim","url":"https://bps.stanford.edu/home/instances-scientific-misconduct/instances-scientific-misconduct-adrian-maxim"},{"title":"Retraction Watch 2024","url":"https://retractionwatch.com/2024/"}],"placements":[{"year":2024,"month":12}],"severity":74,"popularity":62,"score":69,"wordcloud":[["撤稿",6],["工程",5],["论文",4],["图像",4],["问题",4],["马克西姆",3],["电子工程",3],["图像重复",3],["论文工厂",3],["美国",3],["领域",3],["马克",2],["克西",2],["西姆",2],["马克西",2],["克西姆",2],["像重",2],["重复",2],["图像重",2],["像重复",2],["文工",2],["工厂",2],["论文工",2],["文工厂",2],["程领",2],["工程领",2],["程领域",2],["学科",2]],"deepdive":"## 一、事件全貌：工程师阿德里安·马克西姆批量撤稿事件\n\n2024年前后，电气工程师阿德里安·马克西姆（Adrian Maxim）（曾任职 Silicon Labs 等）被查出约 48 篇论文存在图像重复、不当操纵等问题，且部分与论文工厂（paper mill）活动相关，成为近年撤稿数量突出的工程领域案例。该案显示图像诚信问题已蔓延至工程与信号处理领域。 事件时间线上的关键节点包括：2024-12：马克西姆约48篇论文因图像问题被大规模撤稿/标记。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**工程领域图像重复的系统性**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**论文工厂向工程学科渗透**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**高撤稿量对学科文献基础的冲击**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与计算机学者沙姆希尔班德论文工厂式撤稿、研究者罗山·普拉萨德高产撤稿、研究者费萨尔·哈瓦杰高产撤稿、研究者普加真迪高产撤稿等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2024-12","desc":"马克西姆约48篇论文因图像问题被大规模撤稿/标记。","idx":0}],"process":[],"result":[]},"related":[{"slug":"shahaboddin-shamshirband","name":"计算机学者沙姆希尔班德论文工厂式撤稿","score":68,"region":"国际"},{"slug":"roshan-prasad","name":"研究者罗山·普拉萨德高产撤稿","score":66,"region":"国际"},{"slug":"faisal-al-hawaj","name":"研究者费萨尔·哈瓦杰高产撤稿","score":66,"region":"国际"},{"slug":"arivalagan-pugazhendhi","name":"研究者普加真迪高产撤稿","score":66,"region":"国际"},{"slug":"guilherme-malafaia","name":"巴西毒理学家马拉法亚批量撤稿","score":68,"region":"国际"},{"slug":"jose-calvo-guirado","name":"西班牙种植学家卡尔沃-希拉多批量撤稿","score":68,"region":"国际"},{"slug":"mdpi-retraction-2024","name":"2024年MDPI等开放获取期刊大规模撤稿","score":72,"region":"中国"},{"slug":"hitler-louis","name":"尼日利亚化学家路易斯论文工厂式撤稿","score":73,"region":"国际"}]},{"key":"zhou_yezhong_2006","name":"武汉大学周叶中教材抄袭风波","slug":"zhou-yezhong","region":"中国","keywords":["周叶中","武汉大学","教材抄袭","共和主义之宪政解读","王天成","2006","学术不端","法学","诉诸司法"],"summary":"**2006年**，武汉大学副校长、博士生导师**周叶中**与合作者所著《共和主义之宪政解读》被原北京大学教师**王天成**举报多处抄袭其论文。王天成向法院提起诉讼，北京市第二中级人民法院受理。该案成为国内'学术抄袭诉诸司法'的标志性事件，引发学界对学术规范与法律救济的讨论。","timeline":[{"date":"2006-03","desc":"王天成在新语丝等平台公开举报周叶中著作抄袭。"},{"date":"2006-07","desc":"王天成正式起诉周叶中等，法院受理。"}],"ethics":"核心问题：1）学术著作的抄袭认定；2）学术不端诉诸司法救济；3）高校对知名学者抄袭的处理透明度。","sources":[{"title":"大众网：武汉大学博导涉嫌抄袭原北大教师论文被起诉","url":"https://www.dzwww.com/dzwfz/fzyw/t20060320_1391413.htm"},{"title":"法搜：周叶中教授事件及其他","url":"http://www.fsou.com/html/text/art/3355763/335576336.html"}],"placements":[{"year":2006,"month":3}],"severity":76,"popularity":72,"score":74,"wordcloud":[["王天成",7],["抄袭",5],["王天",4],["天成",4],["学术",4],["周叶中",3],["武汉大学",3],["教材抄袭",3],["共和主义之宪政解读",3],["学术不端",3],["法学",3],["诉诸司法",3],["周叶",3],["法院",3],["大学",2],["北京",2],["举报",2],["起诉",2],["院受",2],["受理",2],["法院受",2],["院受理",2],["诉诸",2],["诸司",2],["司法",2],["诉诸司",2],["诸司法",2],["救济",2]],"deepdive":"## 一、事件全貌：一本教材引发的宪政学界公案\r\n2005年11月，宪政学者王天成发表文章，指控武汉大学教授、博导周叶中（时任中国宪法学研究会副会长）与戴激涛合著的《共和主义之宪政解读》（人民出版社2005年9月出版）严重抄袭其《论共和国》《再论共和国》。北大法学院教授贺卫方随后写《周叶中教授及其他》列详细证据，认为剽窃成立。但王天成起诉后，法院最终判决周叶中\"没有抄袭\"，成为学界一大争议公案。\n\n## 二、抄袭的具体对象：抄了哪篇、抄了多少\r\n据王天成公开的《致周叶中教授的公开信》：该书共四章268页，\"从前言到最后一章，每一章都抄袭了我的文字\"，被抄袭文字\"成为你们在书中立论的基础、阐释的对象和贯穿全书的一根主线\"；他\"没有彻底查验，就挑出了36处成段抄袭、剽窃\"。即大段文字直接搬用其《论共和国》《再论共和国》而未注明。\n\n## 三、如何被发现的：受害者本人公开举证\r\n发现者是原作者王天成：他逐章比对后写出公开信与文章，列出36处成段抄袭并附证据；贺卫方等学者跟进佐证。这是\"被侵权人主动维权\"的典型。但案件进入司法后，法院以\"未抄袭\"判决，结果与学界多数指认形成反差。\n\n## 四、背后的利益关系与司法反转\r\n争议焦点：①学界（贺卫方等）基于文本比对认为剽窃成立，司法却判\"未抄袭\"，凸显\"学术认定\"与\"法律认定\"的标准落差；②周叶中身居高位（后任武大副校长、曾进中南海讲课），使事件更具公共性；③\"每一章都抄\"的强烈指控与\"无抄袭\"判决，让公众难以信服，被称为\"公案\"。\n\n## 五、媒体与舆论：各方看法\r\n舆论普遍倾向\"抄袭成立\"（基于贺卫方列出的比对），对法院判决颇多质疑；法学界借此讨论\"著作权法上的抄袭\"与\"学术规范上的抄袭\"是否应区分。事件成为\"学术打假遇司法软着陆\"的代表案例。\n\n## 六、科研伦理与哲学维度\r\n核心是原创与署名责任：合著教材大量成段搬用他人文字而不注，违背学术诚信。公正层面，司法\"未抄袭\"判决与学界文本证据的反差，暴露法律与学术双重标准的张力。制度正义要求学术不端认定独立于身份与司法结果。\n\n## 七、从底层到实际：如何入手解决\r\n①学术不端与著作权侵权应分别由学术机构与司法并行认定；②高校学术委员会须主动、独立调查知名教授案件；③明确合著中的署名与引用规范；④把查重与比对常态化；⑤保护原作者的举证与维权通道。","phases":{"cause":[{"date":"2006-03","desc":"王天成在新语丝等平台公开举报周叶中著作抄袭。","idx":0}],"process":[],"result":[{"date":"2006-07","desc":"王天成正式起诉周叶中等，法院受理。","idx":1}]},"related":[{"slug":"wang-mingming","name":"王铭铭《想象的异邦》剽窃事件","score":73,"region":"中国"},{"slug":"liangying","name":"南京大学梁莹学术不端事件","score":79,"region":"中国"},{"slug":"wei-yuquan","name":"四川大学魏于全院士论文举报风波","score":81,"region":"中国"},{"slug":"zhai-tianlin","name":"翟天临'学术门'事件","score":79,"region":"中国"},{"slug":"wang-can-2025","name":"王灿系统性抄袭台湾学人论著事件","score":72,"region":"中国"},{"slug":"scu-wangzhuqing","name":"四川大学王竹卿被硕博生集体举报事件","score":79,"region":"中国"},{"slug":"jiangsu-keji-guo","name":"江苏科技大学郭某简历造假事件","score":74,"region":"中国"},{"slug":"ecust-hu-liming","name":"华东理工大学胡黎明博士论文抄袭事件","score":66,"region":"中国"}]},{"key":"wang_hui_2010","name":"清华教授汪晖博士论文抄袭争议","slug":"wang-hui","region":"中国","keywords":["汪晖","清华大学","反抗绝望","抄袭","王彬彬","2010","博士论文","学风","争议"],"summary":"**2010年**，南京大学王彬彬在《文艺研究》《南方周末》发文，指称清华大学教授**汪晖**写于20多年前的博士论文《反抗绝望——鲁迅及其文学世界》存在多处抄袭。随后数十名学者就此发表公开信，形成关于'学术不规范'与'抄袭'界定、以及'当年规范较宽松'的大讨论。该案属争议性学风事件，未形成官方'抄袭'定论。","timeline":[{"date":"2010-03","desc":"王彬彬发文指称汪晖博士论文存在抄袭。"},{"date":"2010-07","desc":"数十名学者就汪晖事件发表公开信，引发学风大讨论。"}],"ethics":"核心问题：1）不同时期学术规范的适用；2）'引用不当'与'抄袭'的界定；3）公开信/舆论在学术争议中的角色。","sources":[{"title":"百度百科：汪晖事件","url":"https://baike.baidu.com/item/%E6%B1%AA%E6%99%96%E4%BA%8B%E4%BB%B6/5816277"},{"title":"环球网：清华大学教授汪晖博士论文被指存在多处抄袭","url":"https://m.huanqiu.com/article/9CaKrnJnat4"}],"placements":[{"year":2010,"month":3}],"severity":74,"popularity":75,"score":74,"wordcloud":[["抄袭",8],["汪晖",6],["王彬彬",5],["学风",5],["争议",5],["清华大学",3],["反抗绝望",3],["博士论文",3],["公开",3],["开信",3],["公开信",3],["学术",3],["规范",3],["大学",2],["王彬",2],["彬彬",2],["发文",2],["指称",2],["博士",2],["士论",2],["论文",2],["博士论",2],["士论文",2],["数十",2],["十名",2],["名学",2],["发表",2],["表公",2]],"deepdive":"## 一、事件全貌：一场持续多年的\"抄袭\"公案\r\n2010年3月，南京大学文学院教授王彬彬在《文艺研究》发文，指清华大学人文学院教授汪晖1988年博士论文兼成名作《反抗绝望——鲁迅及其文学世界》存在抄袭中外学者专著的嫌疑。此事经《南方周末》等全文刊载后，成为海内外学者争论的公共话题；清华称\"高度关注\"但长期未给出定论，汪晖本人称\"疏失与抄袭剽窃不同\"。\n\n## 二、抄袭的具体对象：抄了哪几本书、怎么抄的\r\n王彬彬列举汪晖至少抄袭5部中外专著：李泽厚《中国现代思想史论》《中国近代思想史论》、[美]勒文森《梁启超与中国近代思想》、[美]林毓生《中国意识的危机》、张汝伦《意义的探索》等。他归纳出四种抄袭方式：\"搅拌式\"（把多人观点搅在一起）、\"组装式\"、\"掩耳盗铃式\"、\"老老实实式\"（整段照抄不注）。即大段文字与结构直接搬用他人，未注明出处。\n\n## 三、如何被发现的：一篇书评式长文引爆\r\n发现者是同行王彬彬：他\"根据手头几本书简单比对\"后写成指控长文，由《文艺研究》首发、《南方周末》转载，随即引发网友与学者逐段比对、补充证据。整个过程由学术圈内部质疑推动，而非机构自查——也正因为是\"成名作+大牌教授\"，定性与处理迟迟未决。\n\n## 四、背后的利益关系与定性难题\r\n争议核心在于：①思想史写作的\"引用边界\"——哪些是合理化用、哪些是抄袭，学界分歧巨大；②当事人身居清华教授、《读书》前主编高位，使调查与定性承受压力；③最终无官方定性，凸显\"大牌学者抄袭难追责\"的尴尬。支持者认为属\"文献不规范/时代局限\"，反对者（如诸多联名信学者）认为构成抄袭。\n\n## 五、媒体与舆论：各方看法\r\n舆论两极：一方（王彬彬、方舟子及众多联名学者）认为证据清楚、应认定抄袭；另一方强调应区分\"1988年的学术规范\"与今日标准，认为属\"学风问题\"而非蓄意剽窃。网友戏称\"搅拌式抄袭\"。此案成为\"学术规范代际差异\"与\"名人豁免\"讨论的典型。\n\n## 六、科研伦理与哲学维度\r\n核心是原创与规范引用：即便讨论\"时代规范差异\"，大段未注搬用他人文字仍违背学术诚信底线。公正层面，\"名人+成名作\"不应成为免责理由；定性的迟疑损害制度公信力。知识论上，学术贡献须可追溯独创。\n\n## 七、从底层到实际：如何入手解决\r\n①建立独立、有时限的学术不端认定程序，不因病人因时悬而不决；②明确\"合理引用\"与\"抄袭\"的边界并公开标准；③期刊与学位环节强制查重；④把诚信记录与职称、招生挂钩；⑤鼓励同行监督，但须以证据与程序为准。","phases":{"cause":[{"date":"2010-03","desc":"王彬彬发文指称汪晖博士论文存在抄袭。","idx":0}],"process":[],"result":[{"date":"2010-07","desc":"数十名学者就汪晖事件发表公开信，引发学风大讨论。","idx":1}]},"related":[{"slug":"zhangwenhong-thesis","name":"张文宏博士论文被举报抄袭事件","score":73,"region":"中国"},{"slug":"swjtu-huang-qing","name":"西南交通大学黄庆博士论文抄袭案","score":71,"region":"中国"},{"slug":"ecust-hu-liming","name":"华东理工大学胡黎明博士论文抄袭事件","score":66,"region":"中国"},{"slug":"yu-yanru","name":"北京大学于艳茹博士论文抄袭被撤销学位事件","score":74,"region":"中国"},{"slug":"zhai-tianlin","name":"翟天临'学术门'事件","score":79,"region":"中国"},{"slug":"liangying","name":"南京大学梁莹学术不端事件","score":79,"region":"中国"},{"slug":"shu-chen-zhanyun","name":"上海大学陈湛匀博士论文抄袭事件","score":60,"region":"中国"},{"slug":"wang-zhengmin","name":"复旦大学王正敏院士被学生举报论文造假事件","score":81,"region":"中国"}]},{"key":"xu_zhongmin_2020","name":"中科院徐中民'赞导师师娘'论文事件","slug":"xu-zhongmin","region":"中国","keywords":["徐中民","中国科学院","冰川冻土","赞导师","师娘","撤稿","2020","学术不端","生态经济学","基金委"],"summary":"**2020年**，中国科学院西北生态环境资源研究院研究员**徐中民**在中文核心期刊《冰川冻土》发表两篇以'赞导师与师娘'为主题的生态经济学论文，引发舆论哗然。期刊作撤稿处理，国家自然科学基金委通报认定不端并追回已拨资金，徐中民被处理。该案成为'论文注水、学术资源滥用'的典型反面教材。","timeline":[{"date":"2020-01","desc":"《冰川冻土》对徐中民相关'赞导师师娘'文章作撤稿处理。"},{"date":"2020-09","desc":"基金委通报处理决定，追回已拨项目资金。"}],"ethics":"核心问题：1）科研项目经费的合规使用；2）学术期刊的审稿与内容把关；3）'注水论文'对学术资源的浪费；4）导师权力与学术依附关系。","sources":[{"title":"央视网：赞导师与师娘论文作者被处理","url":"https://news.cctv.com/2020/09/18/ARTIgUMSZhV3hioIL6ruMxDn200918.shtml"},{"title":"人民网：赞导师与师娘论文作者被处理：追回已拨项目资金","url":"https://www.peopleapp.com/column/30037636349-500002669336"}],"placements":[{"year":2020,"month":1}],"severity":80,"popularity":85,"score":82,"wordcloud":[["赞导师",5],["师娘",5],["撤稿",5],["基金委",5],["处理",4],["学术",4],["徐中民",3],["中国科学院",3],["冰川冻土",3],["学术不端",3],["生态经济学",3],["资源",3],["期刊",3],["导师",3],["论文",3],["科学",2],["生态",2],["研究",2],["核心",2],["冰川",2],["川冻",2],["冻土",2],["冰川冻",2],["川冻土",2],["赞导",2],["作撤",2],["稿处",2],["作撤稿",2]],"deepdive":"## 一、事件全貌：中科院徐中民'赞导师师娘'论文事件\n\n2020年，中国科学院西北生态环境资源研究院研究员徐中民在中文核心期刊《冰川冻土》发表两篇以'赞导师与师娘'为主题的生态经济学论文，引发舆论哗然。期刊作撤稿处理，国家自然科学基金委通报认定不端并追回已拨资金，徐中民被处理。该案成为'论文注水、学术资源滥用'的典型反面教材。 事件时间线上的关键节点包括：2020-01：《冰川冻土》对徐中民相关'赞导师师娘'文章作撤稿处理。；2020-09：基金委通报处理决定，追回已拨项目资金。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**科研项目经费的合规使用**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**学术期刊的审稿与内容把关**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**'注水论文'对学术资源的浪费**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**导师权力与学术依附关系**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与日本理化学研究所小保方晴子STAP细胞论文造假事件、中南大学章忠强谭笑论文学术不端通报、内蒙古医科大学李春阳代写代投撤稿、朱斌Science论文撤稿事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2020-01","desc":"《冰川冻土》对徐中民相关'赞导师师娘'文章作撤稿处理。","idx":0}],"process":[],"result":[{"date":"2020-09","desc":"基金委通报处理决定，追回已拨项目资金。","idx":1}]},"related":[{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"},{"slug":"zhang-zhongqiang-tanxiao","name":"中南大学章忠强谭笑论文学术不端通报","score":67,"region":"中国"},{"slug" 刊撤稿中国作者等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2023-02","desc":"基金委通报李春阳论文存在代写代投等不端，作撤稿与处理。","idx":0}],"process":[],"result":[]},"related":[{"slug":"chen-lei-chen-kebin","name":"陈磊陈可斌论文买卖案（Medicine期刊）","score":71,"region":"中国"},{"slug":"li-ze","name":"李泽买卖实验研究数据案","score":65,"region":"中国"},{"slug":"springer-retraction-2021","name":"2021年施普林格旗下期刊批量撤稿中国作者","score":74,"region":"中国"},{"slug":"springer-2019","name":"2019年施普林格旗下期刊撤稿中国作者","score":70,"region":"中国"},{"slug":"ningxia-chengjiang","name":"宁夏医科大学成江买卖实验数据案","score":67,"region":"中国"},{"slug":"zhang-zhongqiang-tanxiao","name":"中南大学章忠强谭笑论文学术不端通报","score":67,"region":"中国"},{"slug":"wei-chengxi","name":"内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格","score":70,"region":"中国"},{"slug":"tan-qingkun","name":"谭清坤研究院学术不端案","score":65,"region":"中国"}]},{"key":"lopez_otin_daley_2018","name":"洛佩斯-奥廷与戴利干细胞论文撤稿","slug":"lopez-otin-daley","region":"国际","keywords":["Carlos Lopez-Otin","George Daley","洛佩斯-奥廷","戴利","Nature Cell Biology","干细胞","数据造假","撤稿","西班牙","美国","2018"],"summary":"**2018年**，一篇发表于《自然-细胞生物学》（Nature Cell Biology）的干细胞论文被撤稿。该文由西班牙肿瘤学家**卡洛斯·洛佩斯-奥廷（Carlos Lopez-Otin）**与美国干细胞领域权威、哈佛医学院院长**乔治·戴利（George Q. Daley）**合作，第一作者（Lopez-Otin 的学生）被认定伪造数据。戴利系干细胞领域泰斗级人物，此事凸显'通讯作者/实验室负责人'对合作论文数据的监督责任。","timeline":[{"date":"2018-12","desc":"Nature Cell Biology 撤稿，认定第一作者伪造数据。"}],"ethics":"核心问题：1）跨国合作中数据监督的真空；2）通讯作者的把关责任；3）高影响力干细胞论文的诚信风险。","sources":[{"title":"For Better Science: Lopez-Otin and Daley retract Nature Cell Biology paper","url":"https://forbetterscience.com/2018/12/17/lopez-otin-and-daley-retract-nature-cell-biology-paper/"},{"title":"Retraction Watch: Lopez-Otin Daley","url":"https://retractionwatch.com/?s=Lopez-Otin+Daley"}],"placements":[{"year":2018,"month":12}],"severity":80,"popularity":72,"score":77,"wordcloud":[["干细胞",7],["戴利",5],["撤稿",5],["细胞",5],["西班牙",4],["美国",4],["干细",4],["数据",4],["数据造假",3],["论文",3],["合作",3],["胞论",2],["细胞论",2],["胞论文",2],["胞领",2],["领域",2],["细胞领",2],["胞领域",2],["认定",2],["伪造",2],["造数",2],["伪造数",2],["造数据",2],["讯作",2],["监督",2],["责任",2],["篇发",1],["发表",1]],"deepdive":"## 一、事件全貌：洛佩斯-奥廷与戴利干细胞论文撤稿\n\n2018年，一篇发表于《自然-细胞生物学》（Nature Cell Biology）的干细胞论文被撤稿。该文由西班牙肿瘤学家卡洛斯·洛佩斯-奥廷（Carlos Lopez-Otin）与美国干细胞领域权威、哈佛医学院院长乔治·戴利（George Q. Daley）合作，第一作者（Lopez-Otin 的学生）被认定伪造数据。戴利系干细胞领域泰斗级人物，此事凸显'通讯作者/实验室负责人'对合作论文数据的监督责任。 事件时间线上的关键节点包括：2018-12：Nature Cell Biology 撤稿，认定第一作者伪造数据。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**跨国合作中数据监督的真空**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**通讯作者的把关责任**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**高影响力干细胞论文的诚信风险**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与美国哈佛医学院安维萨心脏干细胞论文撤稿事件、哈佛心理学家豪泽灵长类认知数据造假、纽约市立大学王浩彦阿尔茨海默论文撤稿、美国Surgisphere公司新冠数据造假致顶刊撤稿事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2018-12","desc":"Nature Cell Biology 撤稿，认定第一作者伪造数据。","idx":0}],"process":[],"result":[]},"related":[{"slug":"anversa-cardiac","name":"美国哈佛医学院安维萨心脏干细胞论文 核与问责的制度薄弱。 第四、**撤稿与问责**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与内蒙古医科大学李春阳代写代投撤稿、李泽买卖实验研究数据案、内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格、宁夏医科大学成江买卖实验数据案等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-04","desc":"基金委通报陈磊、陈可斌论文存在买卖、代写代投等不端，予以处理。","idx":0}],"process":[],"result":[]},"related":[{"slug":"li-chunyang","name":"内蒙古医科大学李春阳代写代投撤稿","score":70,"region":"中国"},{"slug":"li-ze","name":"李泽买卖实验研究数据案","score":65,"region":"中国"},{"slug":"wei-chengxi","name":"内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格","score":70,"region":"中国"},{"slug":"ningxia-chengjiang","name":"宁夏医科大学成江买卖实验数据案","score":67,"region":"中国"},{"slug":"tan-qingkun","name":"谭清坤研究院学术不端案","score":65,"region":"中国"},{"slug":"xu-ji","name":"徐继学术不端案","score":65,"region":"中国"},{"slug":"qi-aixue","name":"齐爱学计算机领域学术不端案","score":66,"region":"中国"},{"slug":"li-wenyan","name":"李文彦工程领域学术不端案","score":65,"region":"中国"}]},{"key":"tongji_wang_2026","name":"同济大学生命学院院长王某Nature论文图表不端","slug":"tongji-wang-2026","region":"中国","keywords":["同济大学","王某","金某某","院长","Nature","图表不端","γH2AX","2026","免疫荧光","学术不端"],"summary":"**2026年**，同济大学通报，针对网络反映该校生命科学与技术学院院长王某（金某某）相关论文数据存疑一事，经核查确认其发表于《自然》（Nature）的论文中 **14 张图表存在学术不端**（含 γH2AX 免疫荧光实验未客观计数、3张图片误用）。学校依规对王某作出处理。该案是顶尖高校院长级学者在顶刊论文中被认定图表不端的代表性事件。","timeline":[{"date":"2026-05","desc":"同济大学发布通报，认定王某Nature论文14张图表存在学术不端并予处理。"}],"ethics":"核心问题：1）顶刊论文的图表诚信；2）院长级学者的数据把关；3）公开举报驱动的机构调查；4）免疫荧光等图像实验的客观计数规范。","sources":[{"title":"安庆师大纪检监察：同济大学王某涉嫌学术不端通报","url":"https://jw.aqnu.edu.cn/info/1016/36881.htm"},{"title":"某高校警示教育：同济大学王某Nature论文不端","url":"https://kjc.luas.edu.cn/2026/0509/c2785a133953/page.htm"}],"placements":[{"year":2026,"month":5}],"severity":84,"popularity":78,"score":82,"wordcloud":[["王某",6],["院长",6],["论文",5],["金某某",4],["图表",4],["同济大学",3],["图表不端",3],["免疫荧光",3],["学术不端",3],["张图",3],["不端",3],["同济",2],["济大",2],["大学",2],["同济大",2],["济大学",2],["数据",2],["表存",2],["学术",2],["术不",2],["张图表",2],["图表存",2],["学术不",2],["术不端",2],["免疫",2],["疫荧",2],["荧光",2],["实验",2]],"deepdive":"## 一、事件全貌：一篇登顶Nature的论文如何\"数错细胞\"\r\n2026年4月，博主\"耿同学讲故事\"（耿洪伟）质疑同济大学特聘教授、生命科学与技术学院院长王平团队两篇Nature论文涉嫌原始数据造假；涉事论文2024年11月发表于《自然》。5月6日，同济通报：被质疑的14张图表所涉实验由第一作者金某某完成，其中10张涉及γH2AX免疫荧光染色实验，在获取数据未对样本总细胞数与γH2AX阳性细胞数作客观计数，构成学术不端。王某被免去院长职务，金某某被解聘。\n\n## 二、造假的具体手法：哪些图、怎么造的\r\n问题集中在γH2AX免疫荧光染色图（用于显示DNA损伤标志物）：规范做法是客观计数每张图的总细胞数与阳性细胞数，再计算比例。但调查发现，这10张图在获取与处理数据时，未对细胞作客观计数——即直接\"看一眼\"给出结论、选择性呈现符合预期的结果，而非基于真实计数。通俗说，是用\"不计数/挑图\"的方式，制造出漂亮的DNA损伤表型，属于数据造假而非图像PS。\n\n## 三、如何被发现的：打假博主逐图质疑\r\n发现机制是学术打假博主\"耿同学\"在社交平台逐张比对论文图表的异常（如细胞计数缺失、图片重复），并向校方与期刊举报；随后《自然》与同济启动调查，通过查验原始实验数据、访谈确认。此案是\"网红打假+机构调查\"合力的样本——外部监督先于内部自查。\n\n## 四、背后的利益关系与帽子驱动\r\n王平身兼院长、国家重点研发计划首席、自然基金委创新群体负责人等多顶\"帽子\"，团队头顶Nature光环与巨额资源。争议指向：在\"帽子+经费+顶刊\"压力下，第一作者可能为达标而\"挑图不计数\"，通讯作者（院长）未尽把关之责。通报将责任主要归于第一作者、对通讯作者免职，引发\"连带责任\"讨论。\n\n## 五、媒体与舆论：各方看法\r\n《新京报》等深度跟进，追问\"一篇Nature如何造假\"。舆论支持严惩，但也讨论：通讯作者该不该连带？\"挑图\"算不算造假？网友将其与\"耿同学\"系列打假并列，视为青年学者监督顶刊的正面力量。同济的快速通报被视为积极回应。\n\n## 六、科研伦理与哲学维度\r\n核心是诚实计数与可复现：免疫荧光结论必须来自客观计数，而非主观挑选。\"不计数\"即人为操纵证据，违背科研诚信。知识论上，结论正当性来自可核查的数据，缺失计数使结果不可验证。公正层面，通讯作者对团队数据负有最终责任。\n\n## 七、从底层到实际：如何入手解决\r\n①原始图像与细胞计数数据强制公开，期刊引入图像+统计核查；②对\"挑图/不计数\"等隐性操纵明确认定为不端；③通讯作者连带问责，落实把关责任；④鼓励独立打假与举报保护；⑤顶刊评价去\"唯影响因子\"，弱化帽子驱动。","phases":{"cause":[{"date":"2026-05","desc":"同济大学发布通报，认定王某Nature论文14张图表存在学术不端并予处理。","idx":0}],"process":[],"result":[]},"related":[{"slug":"chongqing-liuhua","name":"重庆大学刘某华学术不端通报","score":71,"region":"中国"},{"slug":"zhang-zhongqiang-tanxiao","name":"中南大学章忠强谭笑论文学术不端通报","score":67,"region":"中国"},{"slug":"just-keji-guo","name":"江苏科技大学'郭某'学术不端与学历造假事件","score":74,"region":"中国"},{"slug":"jiangsu-keji-guo","name":"江苏科技大学郭某简历造假事件","score":74,"region":"中国"},{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"},{"slug":"hzau-student-whistleblow","name":"1·16华中农业大学学生举报导师学术造假事件","score":84,"region":"中国"},{"slug":"tan-qingkun","name":"谭清坤研究院学术不端案","score":65,"region":"中国"},{"slug":"xu-ji","name":"徐继学术不端案","score":65,"region":"中国"}]},{"key":"ningxia_chengjiang_2025","name":"宁夏医科大学成江买卖实验数据案","slug":"ningxia-chengjiang","region":"中国","keywords":["成江","宁夏医科大学","买卖实验数据","国家自然科学基金","2025","学术不端","不当署名"],"summary":"**2025年**，国家自然科学基金委通报**宁夏医科大学成江**发表的论文存在买卖实验研究数据、未经同意使用他人署名、在无关基金成果中标注基金项目等问题，并列入基金项目进展报告；决定撤销其基金项目、追回已拨资金、取消申请资格 5 年。该案是'买卖实验数据'这一新型不端形态的典型。","timeline":[{"date":"2025-01","desc":"基金委通报成江论文存在买卖实验数据等不端，撤销项目并追回资金。"}],"ethics":"核心问题：1）实验数据买卖；2）署名规范；3）基金标注造假；4）项目资金的追回机制。","sources":[{"title":"齐鲁工大纪检监察：典型案例二（学术不端类·成江）","url":"https://jsgzb.qlu.edu.cn/2026/0831/c12498a283103/page.htm"},{"title":"宁夏医科大学：2024年不端行为案件处理结果通报（第一批次，含成江）","url":"https://www.nxmu.edu.cn/kxjsc/info/1177/3493.htm"},{"title":"宁夏医科大学：2025年学术不端行为案件处理结果通报（第一批次）","url":"https://www.nxmu.edu.cn/kxjsc/info/1177/3569.htm"},{"title":"搜狐：重磅！基金委通报2024年不端行为案件处理结果（第一批次）","url":"https://www.sohu.com/a/771237382_121124308"}],"placements":[{"year":2025,"month":1}],"severity":72,"popularity":60,"score":67,"wordcloud":[["基金",7],["成江",5],["项目",5],["买卖",4],["实验",4],["数据",4],["宁夏医科大学",3],["买卖实验数据",3],["国家自然科学基金",3],["学术不端",3],["不当署名",3],["卖实",3],["买卖实",3],["卖实验",3],["金项",3],["基金项",3],["金项目",3],["追回",3],["资金",3],["验数",3],["实验数",3],["验数据",3],["金委",2],["基金委",2],["论文",2],["文存",2],["论文存",2],["署名",2]],"deepdive":"## 一、事件全貌：宁夏医科大学成江买卖实验数据案\n\n2025年，国家自然科学基金委通报宁夏医科大学成江发表的论文存在买卖实验研究数据、未经同意使用他人署名、在无关基金成果中标注基金项目等问题，并列入基金项目进展报告；决定撤销其基金项目、追回已拨资金、取消申请资格 5 年。该案是'买卖实验数据'这一新型不端形态的典型。 事件时间线上的关键节点包括：2025-01：基金委通报成江论文存在买卖实验数据等不端，撤销项目并追回资金。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**实验数据买卖**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**署名规范**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**基金标注造假**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**项目资金的追回机制**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格、马泓买卖实验研究数据案、贺聚良买卖实验研究数据案、李泽买卖实验研究数据案等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-01","desc":"基金委通报成江论文存在买卖实验数据等不端，撤销项目并追回资金。","idx":0}],"process":[],"result":[]},"related":[{"slug":"wei-chengxi","name":"内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格","score":70,"region":"中国"},{"slug":"ma-hong","name":"马泓买卖实验研究数据案","score":65,"region":"中国"},{"slug":"he-juliang","name":"贺聚良买卖实验研究数据案","score":67,"region":"中国"},{"slug":"li-ze","name":"李泽买卖实验研究数据案","score":65,"region":"中国"},{"slug":"zhong-wen","name":"钟文论文抄袭剽窃伪造篡改案","score":69,"region":"中国"},{"slug":"li-chunyang","name":"内蒙古医科大学李春阳代写代投撤稿","score":70,"region":"中国"},{"slug":"chen-lei-chen-kebin","name":"陈磊陈可斌论文买卖案（Medicine期刊）","score":71,"region":"中国"},{"slug":"zhang-zhongqiang-tanxiao","name":"中南大学章忠强谭笑论文学术不端通报","score":67,"region":"中国"}]},{"key":"jining_hospital_papermill_2025","name":"山东济宁第一人民医院论文工厂撤稿事件","slug":"jining-hospital-papermill","region":"中国","keywords":["济宁第一人民医院","论文工厂","撤稿","山东","2025","批量撤稿","医院","图片重复"],"summary":"**2025年**，《自然》（Nature）报道的全球撤稿分析显示，中国**山东济宁第一人民医院（Jining First People's Hospital）**在 Retraction Watch 数据库统计中撤稿论文数量位居全球机构前列，大量撤稿与'论文工厂'（paper mill）产出的批量造假论文相关。该案集中体现了中国基层医疗机构'论文工厂'泛滥与医生评价机制的深层矛盾。","timeline":[{"date":"2025-02","des ":"## 一、事件全貌：国家卫健委2026年通报胡凡李萍等论文造假\n\n2026年，国家卫健委通报多批医学科研失信行为，其中胡凡（第一作者）、李萍（通讯作者）等被认定存在数据造假、论文买卖、代写代投等科研失信行为，被责令撤稿、追回奖励与版面费资助、记入严重失信数据库。该案是卫健委常态化'零容忍'查处医学科研失信的代表。 事件时间线上的关键节点包括：2026-07：卫健委通报28起医学论文造假违规案例，胡凡、李萍等被处理。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**医学论文数据造假**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**通讯作者主体责任**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**失信联合惩戒（追回奖励、记入数据库）**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**常态化通报震慑**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与江西省人民医院邵靓多篇论文失信被终身禁研、李锄云涉'论文工厂'严重学术造假被通报、四川某高校赵某数据造假撤销教授职称、2020年刑法修正案（十一）增设注册数据造假罪等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2026-07","desc":"卫健委通报28起医学论文造假违规案例，胡凡、李萍等被处理。","idx":0}],"process":[],"result":[]},"related":[{"slug":"shao-liang","name":"江西省人民医院邵靓多篇论文失信被终身禁研","score":76,"region":"中国"},{"slug":"li-chuyun","name":"李锄云涉'论文工厂'严重学术造假被通报","score":72,"region":"中国"},{"slug":"sichuan-zhao","name":"四川某高校赵某数据造假撤销教授职称","score":74,"region":"中国"},{"slug":"crime-law-2020","name":"2020年刑法修正案（十一）增设注册数据造假罪","score":72,"region":"中国"},{"slug":"covid-paper-retraction-2020","name":"2020年新冠相关论文集中撤稿事件","score":75,"region":"中国"},{"slug":"khalid-shah","name":"哈佛医学院沙阿图像剽窃与数据造假质疑","score":75,"region":"国际"},{"slug":"surgisphere-covid","name":"美国Surgisphere公司新冠数据造假致顶刊撤稿事件","score":89,"region":"国际"},{"slug":"lopez-otin-daley","name":"洛佩斯-奥廷与戴利干细胞论文撤稿","score":77,"region":"国际"}]},{"key":"nankai_chen_2026","name": 受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2026-05","desc":"南开大学发布通报，认定陈某相关Nature Cancer论文存在学术不端并予处理。","idx":0}],"process":[],"result":[]},"related":[{"slug":"chongqing-liuhua","name":"重庆大学刘某华学术不端通报","score":71,"region":"中国"},{"slug":"dan-ariely","name":"杜克行为经济学家阿里埃利数据造假质疑","score":81,"region":"国际"},{"slug":"zhang-zhongqiang-tanxiao","name":"中南大学章忠强谭笑论文学术不端通报","score":67,"region":"中国"},{"slug":"tongji-wang-2026","name":"同济大学生命学院院长王某Nature论文图表不端","score":82,"region":"中国"},{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"},{"slug":"zhai-tianlin","name":"翟天临'学术门'事件","score":79,"region":"中国"},{"slug":"zhangwenhong-thesis","name":"张文宏博士论文被举报抄袭事件","score":73,"region":"中国"},{"slug":"rao-yi-whistleblow","name":"饶毅实名举报曹雪涛李红良裴钢耿美玉风波","score":87,"region":"中国"}]},{"key":"jiangsu_keji_guo_2026","name":"江苏科技大学郭某简历造假事件","slug":"jiangsu-keji-guo","region":"中国","keywords":["江苏科技大学","郭某","简历造假","高考状元","德国国家科学院","SCI","2025","学术不端","履历"],"summary":"**2025–2026年**，江苏科技大学教师**郭某**被举报并查实公开简历存在多处不实：自称'1994年陕西省高考状元'（当年理科状元另有其人）、宣称'在德国国家科学院任职'（官网无记录）、声称发表SCI论文170余篇（国际平台查无此人）等。校方据此认定学术不端并作处理。该案是高校教师履历系统性造假的又一标本。","timeline":[{"date":"2025-09","desc":"江苏科技大学收到郭某涉嫌学术不端举报并启动调查。"},{"date":"2026-09","desc":"社科网等刊发案例详情，简历造假事实被确认。"}],"ethics":"核心问题：1）教师公开履历的诚信；2）招聘与考核中的背景核验；3）'帽子/头衔'注水对学术评价体系的侵蚀。","sources":[{"title":"哲学社会科学科研诚信网：江苏科技大学郭某学术不端事件","url":"http://index.cassrio.cn/sxal/gn/202609/t20260903_6065709.shtml"},{"title":"新京报：江苏科大“首席科学家”郭伟的假面人生","url":"https://www.bjnews.com.cn/detail/1764032968168810.html"},{"title":"百度百科：2025年江苏高校教授学术造假事件","url":"https://baike.baidu.com/item/2025%E5%B9%B4%E6%B1%9F%E8%8B%8F%E9%AB%98%E6%A0%A1%E6%95%99%E6%8E%88%E5%AD%A6%E6%9C%AF%E9%80%A0%E5%81%87%E4%BA%8B%E4%BB%B6/67002980"},{"title":"羊城晚报：大骗子成了首席科学家，起底郭某","url":"https://edu.ycwb. {"slug":"xu-ji","name":"徐继学术不端案","score":65,"region":"中国"},{"slug":"tan-qingkun","name":"谭清坤研究院学术不端案","score":65,"region":"中国"},{"slug":"qi-aixue","name":"齐爱学计算机领域学术不端案","score":66,"region":"中国"},{"slug":"li-wenyan","name":"李文彦工程领域学术不端案","score":65,"region":"中国"},{"slug":"wang-jinjin","name":"王进进工程领域学术不端案","score":65,"region":"中国"}]},{"key":"wang_can_2025","name":"王灿系统性抄袭台湾学人论著事件","slug":"wang-can-2025","region":"中国","keywords":["王灿","复旦大学","武汉轻工大学","抄袭","台湾学人","博士后","2025","学术不端","新闻学院"],"summary":"**2020–2025年**，复旦大学新闻学院博士后研究员、武汉轻工大学副教授**王灿**被台湾政治大学博士候选人叶霑等联名指控，在2020–2024年间'系统性抄袭'台湾学人论著。2025年相关高校调查后作出处理（退站/处分）。该案凸显跨海峡学术交流中的抄袭识别与学术规范问题。","timeline":[{"date":"2025-02","desc":"台湾学人联名声明指控王灿系统性抄袭，高校启动调查。"},{"date":"2025-10","desc":"相关高校将王灿案列为2025年学术不端典型案例予以通报。"}],"ethics":"核心问题：1）跨机构学术抄袭的认定；2）博士后/青年教师学术规范；3）被举报后的调查与处理透明度。","sources":[{"title":"延安大学：2025年学术不端（第三批）王灿抄袭案","url":"https://jgxy.yau.edu.cn/info/1235/20391.htm"},{"title":"江汉大学警示教育案例集：王某抄袭台湾学人","url":"http://jsgzb.jci.edu.cn/info/1093/2005.htm"}],"placements":[{"year":2025,"month":2}],"severity":74,"popularity":68,"score":72,"wordcloud":[["抄袭",7],["王灿",6],["博士后",5],["学术",5],["复旦大学",3],["武汉轻工大学",3],["台湾学人",3],["学术不端",3],["新闻学院",3],["大学",3],["博士",3],["台湾",3],["高校",3],["调查",3],["士后",2],["联名",2],["指控",2],["系统",2],["统性",2],["性抄",2],["系统性",2],["统性抄",2],["性抄袭",2],["湾学",2],["学人",2],["台湾学",2],["湾学人",2],["处理",2]],"deepdive":"## 一、事件全貌：复旦博士后的\"繁转简\"抄袭术\r\n2025年2月，台湾政治大学中文系博士候选人叶霑与台湾学人张桓溢、王秀如联名发表声明，指控复旦大学新闻学院博士后研究员、武汉轻工大学副教授王灿在2020—2024年间\"系统性抄袭\"台湾学者的学位论文。经查，王灿至少4篇发表于大陆核心期刊（C刊）的论文几乎全文抄袭台湾大学、台湾师范大学、彰化师范大学、中央大学等校硕士论文，注脚与图表\"一字不漏\"照搬。复旦大学对其作出退站处理。\n\n## 二、抄袭的具体对象：抄了谁、怎么抄的\r\n被抄的是4篇台湾高校硕士论文，涉及台湾非虚构写作、近现代京剧美学、北宋阅读史、边疆艺术调查等方向——而王灿本人研究方向为新闻学，跨领域照搬更显荒诞。其手法有三：①\"繁体转简体\"：把公开的台湾硕士论文转为简体后当自己成果；②整篇复制：注脚、图表、正文几乎一字不差；③利用两岸查重系统不互通的漏洞——大陆查重库搜不到台湾学位论文，使其长期未被发现。\n\n## 三、如何被发现的：被抄袭者的联名声明\r\n发现者是原作者叶霑等人：他们在比对中发现自己的硕士论文被几乎原样发表在大陸C刊上，遂于2024年12月向复旦学术委员会举报，2025年2月公开发表联名声明并逐篇举证。这是\"受害者反查\"而非系统把关发现的典型——期刊审稿与查重均未拦下。\n\n## 四、背后的利益关系与制度漏洞\r\n核心漏洞是\"两岸查重不互通\"：台湾学位论文公开可查，却不在大陆查重库覆盖范围内，被王灿当作\"免费素材库\"。更深层是C刊（核心期刊）对青年学者的硬性压力——为凑发表量，有人走向\"跨海搬运\"。事件也暴露期刊审稿的形式化：注脚图表一字不差竟能过审。\n\n## 五、媒体与舆论：各方看法\r\n舆论哗然，\"脸都不要了\"\"丢人丢到台湾\"成热梗；学界批评其\"低端抄袭\"。争议点在于：如何堵住两岸查重漏洞、期刊该如何复核。王灿被退站后，相关C刊启动撤稿并登道歉声明。网友呼吁把\"繁转简\"式抄袭纳入查重与诚信档案。\n\n## 六、科研伦理与哲学维度\r\n核心是原创与署名责任：把他人学位论文整篇搬用，是对智力劳动的公然窃取。公正层面，利用系统漏洞\"套利\"仍属欺骗，不能因\"没被查重到\"而正当化。制度正义要求堵住查重盲区，让跨域抄袭无处遁形。\n\n## 七、从底层到实际：如何入手解决\r\n①查重系统覆盖港澳台及境外学位论文库，打通\"繁简\"比对；②期刊审稿强化跨库比对与注脚/图表核查；③对\"系统性抄袭\"加重处理（退站、撤稿、诚信黑名单）；④把被抄袭者举报通道制度化；⑤对C刊发表实行更严原创性审查，弱化\"唯数量\"压力。","phases":{"cause":[{"date":"2025-02","desc":"台湾学人联名声明指控王灿系统性抄袭，高校启动调查。","idx":0}],"process":[],"result":[{"date":"2025-10","desc":"相关高校将王灿案列为2025年学术不端典型案例予以通报。","idx":1}]},"related":[{"slug":"chongqing-liuhua","name":"重庆大学刘某华学术不端通报","score":71,"region":"中国"},{"slug":"wang-mingming","name":"王铭铭《想象的异邦》剽窃事件","score":73,"region":"中国"},{"slug":"zhai-tianlin","name":"翟天临'学术门'事件","score":79,"region":"中国"},{"slug":"zhangwenhong-thesis","name":"张文宏博士论文被举报抄袭事件","score":73,"region":"中国"},{"slug":"swjtu-huang-qing","name":"西南交通大学黄庆博士论文抄袭案","score":71,"region":"中国"},{"slug":"caas-wang","name":"中国农业科学院王某基因编辑数据造假撤稿","score":82,"region":"中国"},{"slug":"gztcm-lai-wen","name":"广州中医药大学赖文论文抄袭事件","score":56,"region":"中国"},{"slug":"shu-chen-zhanyun","name":"上海大学陈湛匀博士论文抄袭事件","score":60,"region":"中国"}]},{"key":"sabine_hazan_2023","name":"哈赞粪便移植与伊维菌素新冠论文撤稿","slug":"sabine-hazan","region":"国际","keywords":["Sabine Hazan","哈赞","粪便移植","伊维菌素","新冠","FDA警告","撤稿","美国","2023","微生物组"],"summary":"**2023年**，《科学》（Science）旗下博客与期刊披露，美国加州消化科医生、**萨宾·哈赞（Sabine Hazan）**声称用肠道菌群（粪便移植）治疗自闭症、并发表论文支持伊维菌素治疗新冠，但其一篇支持伊维菌素的论文被撤稿；FDA 警告信指出其自营临床试验存在多项违规（如未经伦理审批征召志愿者），所谓'7项试验无死亡'被指虚假宣传。该案是'未验证疗法+自媒体造势+监管警告'的典型。","timeline":[{"date":"2023-05","desc":"哈赞支持伊维菌素的论文被撤稿，FDA 发出违规警告信。"}],"ethics":"核心问题：1）未经验证疗法的过度宣称；2）研究者自营临床试验的伦理合规；3）社交媒体时代的虚假健康信息传播。","sources":[{"title":"科普中国：2023科学界十大学术不端（含哈赞）","url":"https://www.kepuchina.cn/article/articleinfo?business_type=100&ar_id=473188"},{"title":"Retraction Watch: Sabine Hazan","url":"https://retractionwatch.com/?s=Sabine+Hazan"}],"placements":[{"year":2023,"month":5}],"severity":74,"popularity":66,"score":71,"wordcloud":[["哈赞",5],["撤稿",5],["新冠",4],["美国",4],["粪便移植",3],["伊维菌素",3],["微生物组",3],["论文",3],["支持",3],["持伊",3],["伊维",3],["维菌",3],["菌素",3],["支持伊",3],["持伊维",3],["伊维菌",3],["维菌素",3],["警告",3],["试验",3],["治疗",2],["告信",2],["自营",2],["营临",2],["临床",2],["床试",2],["违规",2],["警告信",2],["自营临",2]],"deepdive":"## 一、事件全貌：哈赞粪便移植与伊维菌素新冠论文撤稿\n\n2023年，《科学》（Science）旗下博客与期刊披露，美国加州消化科医生、萨宾·哈赞（Sabine Hazan）声称用肠道菌群（粪便移植）治疗自闭症、并发表论文支持伊维菌素治疗新冠，但其一篇支持伊维菌素的论文被撤稿；FDA 警告信指出其自营临床试验存在多项违规（如未经伦理审批征召志愿者），所谓'7项试验无死亡'被指虚假宣传。该案是'未验证疗法+自媒体造势+监管警告'的典型。 事件时间线上的关键节点包括：2023-05：哈赞支持伊维菌素的论文被撤稿，FDA 发出违规警告信。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**未经验证疗法的过度宣称**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**研究者自营临床试验的伦理合规**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**社交媒体时代的虚假健康信息传播**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与杜克肿瘤学家波蒂癌症基因组预测造假、《柳叶刀》新冠出院后6个月结局论文撤稿、罗切斯特大学迪亚斯室温超导造假案、哈佛商学院吉诺行为学研究数据造假等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2023-05","desc":"哈赞支持伊维菌素的论文被撤稿，FDA 发出违规警告信。","idx":0}],"process":[],"result":[]},"related":[{"slug":"anil-potti","name":"杜克肿瘤学家波蒂癌症基因组预测造假","score":79,"region":"国际"},{"slug":"lancet-covid-outcomes","name":"《柳叶刀》新冠出院后6个月结局论文撤稿","score":84,"region":"国际"},{"slug":"ranga-dias","name":"罗切斯特大学迪亚斯室温超导造假案","score":85,"region":"国际"},{"slug":"francesca-gino","name":"哈佛商学院吉诺行为学研究数据造假","score":87,"region":"国际"},{"slug":"thomas-sudhof","name":"诺奖得主祖德霍夫论文数据错误","score":82,"region":"国际"},{"slug":"hoau-yan-wang","name":"纽约市立大学王浩彦阿尔茨海默论文撤稿","score":78,"region":"国际"},{"slug":"didier-raoult","name":"法国学者拉乌尔羟氯喹论文撤稿事件","score":87,"region":"国际"},{"slug":"surgisphere-covid","name":"美国Surgisphere公司新冠数据造假致顶刊撤稿事件","score":89,"region":"国际"}]},{"key":"thomas_sudhof_2023","name":"诺奖得主祖德霍夫论文数据错误","slug":"thomas-sudhof","region":"国际","keywords":["Thomas C. Südhof","祖德霍夫","诺奖","斯坦福","PNAS","数据错误","撤稿","美国","2023","神经科学"],"summary":"**2023年**，2013年诺贝尔生理学或医学奖得主、斯坦福教授**托马斯·祖德霍夫（Thomas C. Südhof）**有 14 篇论文被 PubPeer 质疑；其中一篇 2023 年发表于《PNAS》的论文因数据问题被统计学家质疑后，祖德霍夫本人最终承认存在'重大数据错误'，期刊挂出编辑关注，第一作者（博士后 Pei-Yi Lin）受校方调查。该案是诺奖得主再次卷入数据诚信争议。","timeline":[{"date":"2023-10","desc":"Südhof 的 PNAS 论文因数据问题被质疑，其本人承认重大数据错误。"}],"ethics":"核心问题：1）诺奖得主的数据诚信；2）'错误'与'造假'的界定；3）统计复核在识别数据问题中的作用。","sources":[{"title":"科普中国：2023科学界十大学术不端（含祖德霍夫）","url":"https://www.kepuchina.cn/article/articleinfo?business_type=100&ar_id=473188"},{"title":"Retraction Watch: Thomas Südhof","url":"https://retractionwatch.com/?s=Thomas+Sudhof"}],"placements":[{"year":2023,"month":10}],"severity":84,"popularity":80,"score":82,"wordcloud":[["数据",7],["诺奖",5],["斯坦福",4],["问题",4],["祖德霍夫",3],["数据错误",3],["撤稿",3],["美国",3],["神经科学",3],["奖得",3],["得主",3],["奖得主",3],["论文",3],["质疑",3],["据问",3],["数据问",3],["据问题",3],["错误",3],["祖德",2],["德霍",2],["霍夫",2],["祖德霍",2],["德霍夫",2],["统计",2],["本人",2],["承认",2],["重大",2],["大数",2]],"deepdive":"## 一、事件全貌：诺奖得主祖德霍夫论文数据错误\n\n2023年，2013年诺贝尔生理学或医学奖得主、斯坦福教授托马斯·祖德霍夫（Thomas C. Südhof）有 14 篇论文被 PubPeer 质疑；其中一篇 2023 年发表于《PNAS》的论文因数据问题被统计学家质疑后，祖德霍夫本人最终承认存在'重大数据错误'，期刊挂出编辑关注，第一作者（博士后 Pei-Yi Lin）受校方调查。该案是诺奖得主再次卷入数据诚信争议。 事件时间线上的关键节点包括：2023-10：Südhof 的 PNAS 论文因数据问题被质疑，其本人承认重大数据错误。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**诺奖得主的数据诚信**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**'错误'与'造假'的界定**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**统计复核在识别数据问题中的作用**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与日本麻醉科医生上岛宏信批量撤稿、诺奖得主塞门扎论文图片问题撤稿、研究者A·萨拉·埃拉希高产撤稿、《科学》Visfatin蛋白论文撤稿等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2023-10","desc":"Südhof 的 PNAS 论文因数据问题被质疑，其本人承认重大数据错误。","idx":0}],"process":[],"result":[]},"related":[{"slug":"hironobu-ueshima","name":"日本麻醉科医生上岛宏信批量撤稿","score":70,"region":"国际"},{"slug":"gregg-semenza","name":"诺奖得主塞门扎论文图片问题撤稿","score":86,"region":"国际"},{"slug":"a-salar-elahi","name":"研究者A·萨拉·埃拉希高产撤稿","score":66,"region":"国际"},{"slug":"visfatin","name":"《科学》Visfatin蛋白论文撤稿","score":75,"region":"国际"},{"slug":"ali-nazari","name":"研究者阿里·纳扎里高产撤稿","score":66,"region":"国际"},{"slug":"tessier-lavigne","name":"斯坦福校长泰西耶-拉维涅论文调查辞职事件","score":89,"region":"国际"},{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"},{"slug":"khalid-shah","name":"哈佛医学院沙阿图像剽窃与数据造假质疑","score":75,"region":"国际"}]},{"key":"fazlul_sarkar_2018","name":"韦恩州立大学萨尔卡癌症论文批量撤稿","slug":"fazlul-sarkar","region":"国际","keywords":["Fazlul Sarkar","萨尔卡","韦恩州立大学","癌症生物学","图像操纵","撤稿","美国","2018","PubPeer"],"summary":"**2014–2020年**，美国韦恩州立大学（Wayne State University）病理学研究者**法兹卢尔·萨尔卡（Fazlul Sarkar）**被 PubPeer 等平台持续举报多篇癌症生物学论文存在图像操纵（图片复制、拼接）。校方调查后数十篇论文被撤稿（撤稿观察排行榜约 41 篇），他本人还曾起诉 PubPeer 用户，引发'举报者与造假者'之争。","timeline":[{"date":"2018-01","desc":"Sarkar 多篇论文因图像问题被陆续撤稿，其 2014 年起诉 PubPeer 用户一事广受关注。"}],"ethics":"核心问题：1）图像操纵在癌症生物学中的多发；2）研究者对公开举报者的反诉（寒蝉效应）；3）撤稿对下游研究的影响。","sources":[{"title":"文汇网：那些举报论文造假的人（提及萨尔卡）","url":"https://wenhui.whb.cn/zhuzhan/xue/20181023/219577.html"},{"title":"Retraction Watch: Fazlul Sarkar","url":"https://retractionwatch.com/?s=Fazlul+Sarkar"}],"placements":[{"year":2018,"month":1}],"severity":80,"popularity":72,"score":77,"wordcloud":[["撤稿",7],["萨尔卡",4],["美国",4],["韦恩州立大学",3],["癌症生物学",3],["图像操纵",3],["研究",3],["举报",3],["论文",3],["图像",3],["多篇",2],["癌症",2],["症生",2],["生物",2],["物学",2],["像操",2],["操纵",2],["癌症生",2],["症生物",2],["生物学",2],["图像操",2],["像操纵",2],["篇论",2],["篇论文",2],["起诉",2],["用户",2],["问题",2],["国韦",1]],"deepdive":"## 一、事件全貌：韦恩州立大学萨尔卡癌症论文批量撤稿\n\n2014–2020年，美国韦恩州立大学（Wayne State University）病理学研究者法兹卢尔·萨尔卡（Fazlul Sarkar）被 PubPeer 等平台持续举报多篇癌症生物学论文存在图像操纵（图片复制、拼接）。校方调查后数十篇论文被撤稿（撤稿观察排行榜约 41 篇），他本人还曾起诉 PubPeer 用户，引发'举报者与造假者'之争。 事件时间线上的关键节点包括：2018-01：Sarkar 多篇论文因图像问题被陆续撤稿，其 2014 年起诉 PubPeer 用户一事广受关注。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**图像操纵在癌症生物学中的多发**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**研究者对公开举报者的反诉（寒蝉效应）**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**撤稿对下游研究的影响**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与康奈尔万辛克食品心理学p值操纵撤稿、伊利诺伊大学拉奥神经外科手术论文撤稿潮、研究者安娜·洛帕京娜高产撤稿、日本琉球大学森直树图像操纵撤稿案等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2018-01","desc":"Sarkar 多篇论文因图像问题被陆续撤稿，其 2014 年起诉 PubPeer 用户一事广受关注。","idx":0}],"process":[],"result":[]},"related":[{"slug":"brian-wansink","name":"康奈尔万辛克食品心理学p值操纵撤稿","score":79,"region":"国际"},{"slug":"jasti-rao","name":"伊利诺伊大学拉奥神经外科手术论文撤稿潮","score":76,"region":"国际"},{"slug" 规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2018-01","desc":"Ueshima 多篇麻醉学论文因图像/数据问题被陆续撤稿。","idx":0}],"process":[],"result":[]},"related":[{"slug":"yuhji-saitoh","name":"研究者斋藤裕司高产撤稿","score":66,"region":"国际"},{"slug":"ali-nazari","name":"研究者阿里·纳扎里高产撤稿","score":66,"region":"国际"},{"slug":"naohiro-kameta","name":"研究者龟田直宏高产撤稿","score":66,"region":"国际"},{"slug":"swen-piper","name":"研究者斯文·派珀高产撤稿","score":68,"region":"国际"},{"slug":"a-salar-elahi","name":"研究者A·萨拉·埃拉希高产撤稿","score":66,"region":"国际"},{"slug":"visfatin","name":"《科学》Visfatin蛋白论文撤稿","score":75,"region":"国际"},{"slug":"thomas-sudhof","name":"诺奖得主祖德霍夫论文数据错误","score":82,"region":"国际"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"}]},{"key":"jose_calvo_guirado_2020","name":"西班牙种植学家卡尔沃-希拉多批量撤稿","slug":"jose-calvo-guirado","region":"国际","keywords":["Jose L Calvo-Guirado","卡尔沃-希拉多","牙科","种植体","撤稿","西班牙","图像问题","2020","撤稿观察排行榜"],"summary":"**西班牙牙科/种植体研究者何塞·L·卡尔沃-希拉多（Jose L. Calvo-Guirado）**因大量论文存在图像重复与数据问题，被撤稿观察排行榜列为撤稿数量最高的学者之一（约 46 篇）。其案例是牙科/口腔种植领域图像诚信问题的代表。","timeline":[{"date":"2020-01","desc":"Calvo-Guirado 多篇牙科种植论文因图像问题被撤稿。"}],"ethics":"核心问题：1）牙科领域的图像重复；2）高产临床学者的数据监督；3）撤稿对临床指南的证据影响。","sources":[{"title":"撤稿观察排行榜","url":"https://retractionwatch.com/the-retraction-watch-leaderboard/"},{"title":"Retraction Watch: Calvo-Guirado","url":"https://retractionwatch.com/?s=Calvo-Guirado"}],"placements":[{"year":2020,"month":1}],"severity":74,"popularity":60,"score":68,"wordcloud":[["牙科",7],["撤稿",7],["种植体",4],["西班牙",4],["图像",4],["问题",4],["图像问题",3], 的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2021-01","desc":"Prasad 大量环境工程论文被集中撤稿。","idx":0}],"process":[],"result":[]},"related":[{"slug":"faisal-al-hawaj","name":"研究者费萨尔·哈瓦杰高产撤稿","score":66,"region":"国际"},{"slug":"arivalagan-pugazhendhi","name":"研究者普加真迪高产撤稿","score":66,"region":"国际"},{"slug":"hua-zhong","name":"研究者钟华高产撤稿","score":66,"region":"国际"},{"slug":"ashok-pandey","name":"研究者阿肖克·潘迪高产撤稿","score":66,"region":"国际"},{"slug":"ayman-atta","name":"研究者艾曼·阿塔高产撤稿","score":66,"region":"国际"},{"slug":"jun-iwamoto","name":"研究者岩本淳高产撤稿","score":66,"region":"国际"},{"slug":"a-salar-elahi","name":"研究者A·萨拉·埃拉希高产撤稿","score":66,"region":"国际"},{"slug":"ali-nazari","name":"研究者阿里·纳扎里高产撤稿","score":66,"region":"国际"}]},{"key":"lancet_covid_outcomes_2023","name":"《柳叶刀》新冠出院后6个月结局论文撤稿","slug":"lancet-covid-outcomes","region":"国际","keywords":["Lancet","柳叶刀","新冠","出院后结局","撤稿","2023","队列研究","数据担忧","中国作者"],"summary":"**2021–2023年**，一篇由中国团队发表于《柳叶刀》（Lancet）的'新冠患者出院后6个月结局'队列研究（被引逾2800次）因数据与同期另一篇同名论文的一致性受到质疑，期刊调查后以'撤稿再发表'流程撤回原版、发表更正版。该案是新冠疫情中又一篇高被引撤稿论文，凸显大样本真实世界研究的数据核查难题。","timeline":[{"date":"2023-01","desc":"Lancet 对新冠出院后6个月结局论文启动撤稿/更正流程。"}],"ethics":"核心问题：1）高被引真实世界研究的数据一致性；2）'撤稿再发表'的透明处理；3）疫情研究的复核压力。","sources":[{"title":"网易：被引次数最多的10篇撤稿论文（含该Lancet文）","url":"https://m.163.com/dy/article/JLQCDMJE0514AGEL.html"},{"title":"Retraction Watch: Lancet COVID-19 outcomes","url":"https://retractionwatch.com/?s=Lancet+COVID-19+outcomes+retraction"}],"placements":[{"year":2023,"month":1}],"severity":86,"popularity":82,"score":84,"wordcloud":[["撤稿",7],["新冠",6],["柳叶刀",4],["发表",4],["研究",4],["出院后结局",3],["队列研究",3],["数据担忧",3],["中国作者",3],["数据",3],["论文",3],["出院",2],["院后",2],["出院后",2],["月结",2],["结局",2],["月结局",2],["致性",2],["稿再",2],["再发",2],["撤稿再",2],["稿再发",2],["再发表",2],["流程",2],["更正",2],["疫情",2],["真实",2],["实世",2]],"deepdive":"## 一、事件全貌：被引2800次后的「撤稿再发表」\n\n2021—2023年，一篇由中国团队发表于《柳叶刀》（Lancet）的「新冠患者出院后6个月结局」队列研究（被引逾2800次）因数据与同期另一篇同名论文的数据一致性受到质疑；期刊调查后于2023年1月启动「撤稿—再发表」流程：撤回原版、发表更正版。该案是新冠大流行中又一篇高被引撤稿论文，凸显大样本真实世界研究的数据核查难题。\n\n## 二、逐层深挖：高被引、数据一致性与透明纠错\n\n第一，**高被引背后的数据隐忧**：一篇被引逾2800次的真实世界研究，却在数据一致性上出问题，说明「影响力」与「可靠性」并不等价。第二，**同名论文的重复**：与同期另一篇「同名」论文存在数据一致性疑问，指向数据复用或管理混乱。第三，**「撤稿再发表」的透明处理**：以撤回原版、发表更正版的方式保留纠错轨迹，相较「悄悄更正」更透明，但也引发「是否构成实质撤稿」的讨论。第四，**大样本队列的核查难**：真实世界数据体量巨大、来源分散，传统评审难以覆盖，需专门的数据审计。第五，**疫情复核压力**：在紧急期，复核资源被压缩，错误更易流入顶刊。\n\n## 三、合理性与不合理性辨析\n\n合理：主动更正并以「撤稿再发表」保留完整记录，体现了对透明的追求；期刊启动调查而非装聋，值得肯定。不合理：其一，高被引论文的数据疑点竟由外部比对发现，反映顶刊对大样本真实世界研究的**数据审计能力不足**；其二，同名论文的数据重复，提示研究管理与投稿规范存在疏漏；其三，若仅以「再发表」淡化，可能弱化对数据失范的问责。\n\n## 四、科研伦理与哲学维度\n\n知识论上，真实世界证据（RWE）的正当性同样来自数据可核查、可复现；当底层数据存疑，高被引只是放大了不确定性。伦理上，涉及**科研信用**与**纠正的透明**：承认错误并公开更正，是诚实的体现，但前提是核查不依赖外部偶然。哲学上，这是「**证成强度 vs 传播强度**」的分离——被引量不能替代证据等级。科学的公信力，来自「错了就公开改」的机制，而非「看起来权威」。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「**真实世界研究的数据可审计**」成为发表硬条件。实际：①对大样本队列研究实行**数据登记与独立审计**，原始数据可核查；②规范同名/关联研究的去重与披露，防止数据复用；③对高被引论文建立**定期复核**与重点核查；④推广「撤稿—更正」的透明流程与公开记录；⑤强制原始数据（含元数据）公开，使质疑可被独立验证。让真实世界证据，先经得起数据的检验。","phases":{"cause":[{"date":"2023-01","desc":"Lancet 对新冠出院后6个月结局论文启动撤稿/更正流程。","idx":0}],"process":[],"result":[]},"related":[{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"covid-retraction-2020","name":"2020年新冠相关论文全球撤稿潮","score":89,"region":"国际"},{"slug":"didier-raoult","name":"法国学者拉乌尔羟氯喹论文撤稿事件","score":87,"region":"国际"},{"slug":"surgisphere-covid","name":"美国Surgisphere公司新冠数据造假致顶刊撤稿事件","score":89,"region":"国际"},{"slug":"covid-paper-retraction-2020","name":"2020年新冠相关论文集中撤稿事件","score":75,"region":"中国"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"},{"slug":"cams-nature-2020","name":"中国医学科学院新冠Nature论文图片造假质疑","score":74,"region":"中国"},{"slug":"visfatin","name":"《科学》Visfatin蛋白论文撤稿","score":75,"region":"国际"}]},{"key":"predimed_2018","name":"《新英格兰医学杂志》地中海饮食研究撤稿","slug":"predimed","region":"国际","keywords":["PREDIMED","地中海饮食","新英格兰医学杂志","NEJM","撤稿","西班牙","2018","随机化","营养"],"summary":"**2013–2018年**，西班牙 PREDIMED 研究关于'地中海饮食预防心血管疾病'的论文发表于《新英格兰医学杂志》（NEJM，被引逾2600次），后因随机化流程不规范（基线变量分布与随机化不一致、部分标准误误报为标准差）被撤稿，作者随后发表修正版、结论表述更温和。该案是高被引营养流行病学研究因方法学问题撤稿的代表。","timeline":[{"date":"2018-06","desc":"NEJM 撤稿 PREDIMED 地中海饮食论文，作者发表修正版。"}],"ethics":"核心问题：1）随机化与统计分析的规范性；2）高被引营养研究的结论强度；3）撤稿后修正版的透明处理。","sources":[{"title":"网易：被引次数最多的10篇撤稿论文（PREDIMED）","url":"https://m.163.com/dy/article/JLQCDMJE0514AGEL.html"},{"title":"Retraction Watch: PREDIMED","url":"https://retractionwatch.com/?s=PREDIMED"}],"placements":[{"year":2018,"month":6}],"severity":82,"popularity":78,"score":80,"wordcloud":[["撤稿",7],["随机化",6],["营养",5],["西班牙",4],["地中海饮食",3],["新英格兰医学杂志",3],["研究",3],["发表",3],["随机",3],["机化",3],["修正",3],["正版",3],["修正版",3],["海饮",2],["饮食",2],["海饮食",2],["论文",2],["规范",2],["标准",2],["表修",2],["发表修",2],["表修正",2],["结论",2],["引营",2],["问题",2],["引营养",2],["西班",1],["班牙",1]],"deepdive":"## 一、事件全貌：《新英格兰医学杂志》地中海饮食研究撤稿\n\n2013–2018年，西班牙 PREDIMED 研究关于'地中海饮食预防心血管疾病'的论文发表于《新英格兰医学杂志》（NEJM，被引逾2600次），后因随机化流程不规范（基线变量分布与随机化不一致、部分标准误误报为标准差）被撤稿，作者随后发表修正版、结论表述更温和。该案是高被引营养流行病学研究因方法学问题撤稿的代表。 事件时间线上的关键节点包括：2018-06：NEJM 撤稿 PREDIMED 地中海饮食论文，作者发表修正版。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**随机化与统计分析的规范性**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**高被引营养研究的结论强度**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**撤稿后修正版的透明处理**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与西班牙种植学家卡尔沃-希拉多批量撤稿、挪威医生苏德伯伪造口腔癌研究数据事件、朱斌Science论文撤稿事件、刘光慧团队Nature论文'误录'争议等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2018-06","desc":"NEJM 撤稿 PREDIMED 地中海饮食论文，作者发表修正版。","idx":0}],"process":[],"result":[]},"related":[{"slug":"jose-calvo-guirado","name":"西班牙种植学家卡尔沃-希拉多批量撤稿","score":68,"region":"国际"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"},{"slug":"liuguanghui-nature","name":"刘光慧团队Nature论文'误录'争议","score":71,"region":"中国"},{"slug":"visfatin","name":"《科学》Visfatin蛋白论文撤稿","score":75,"region":"国际"},{"slug":"fazlul-sarkar","name":"韦恩州立大学萨尔卡癌症论文批量撤稿","score":77,"region":"国际"},{"slug":"didier-raoult","name":"法国学者拉乌尔羟氯喹论文撤稿事件","score":87,"region":"国际"},{"slug":"brian-wansink","name":"康奈尔万辛克食品心理学p值操纵撤稿","score":79,"region":"国际"}]},{"key":"visfatin_2007","name":"《科学》Visfatin蛋白论文撤稿","slug":"visfatin","region":"国际","keywords":["Visfatin","科学","Science","撤稿","大阪大学","2007","数据问题","肥胖","胰岛素"],"summary":"**2005–2007年**，一篇发表于《科学》（Science）的 Visfatin 蛋白'模拟胰岛素作用'论文（被引逾1500次）因大阪大学医学研究生院研究诚信委员会调查建议，于2007年撤稿；作者同意撤稿但仍坚持结论。该案是代谢/肥胖领域高被引论文因数据问题撤稿的早期代表。","timeline":[{"date":"2007-01","desc":"Science 撤稿 Visfatin 论文，大阪大学调查认定数据问题。"}],"ethics":"核心问题：1）高被引代谢论文的数据诚信；2）机构调查与作者态度的张力；3）撤稿对后续研究的阻断。","sources":[{"title":"网易：被引次数最多的10篇撤稿论文（Visfatin）","url":"https://m.163.com/dy/article/JLQCDMJE0514AGEL.html"},{"title":"Retraction Watch: Visfatin","url":"https://retractionwatch.com/?s=Visfatin"}],"placements":[{"year":2007,"month":1}],"severity":78,"popularity":70,"score":75,"wordcloud":[["撤稿",8],["科学",4],["肥胖",4],["胰岛素",4],["论文",4],["大阪大学",3],["数据问题",3],["研究",3],["调查",3],["数据",3],["问题",3],["大阪",2],["阪大",2],["大学",2],["诚信",2],["大阪大",2],["阪大学",2],["代谢",2],["据问",2],["数据问",2],["据问题",2],["篇发",1],["发表",1],["篇发表",1],["蛋白",1],["模拟",1],["拟胰",1],["胰岛",1]],"deepdive":"## 一、事件全貌：《科学》Visfatin蛋白论文撤稿\n\n2005–2007年，一篇发表于《科学》（Science）的 Visfatin 蛋白'模拟胰岛素作用'论文（被引逾1500次）因大阪大学医学研究生院研究诚信委员会调查建议，于2007年撤稿；作者同意撤稿但仍坚持结论。该案是代谢/肥胖领域高被引论文因数据问题撤稿的早期代表。 事件时间线上的关键节点包括：2007-01：Science 撤稿 Visfatin 论文，大阪大学调查认定数据问题。。 该案发生于国际，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**高被引代谢论文的数据诚信**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**机构调查与作者态度的张力**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**撤稿对后续研究的阻断**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与华盛顿大学方 ferric 实验室系列撤稿事件、朱斌Science论文撤稿事件、研究者A·萨拉·埃拉希高产撤稿、日本麻醉科医生上岛宏信批量撤稿等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2007-01","desc":"Science 撤稿 Visfatin 论文，大阪大学调查认定数据问题。","idx":0}],"process":[],"result":[]},"related":[{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"},{"slug":"a-salar-elahi","name":"研究者A·萨拉·埃拉希高产撤稿","score":66,"region":"国际"},{"slug":"hironobu-ueshima","name":"日本麻醉科医生上岛宏信批量撤稿","score":70,"region":"国际"},{"slug":"ali-nazari","name":"研究者阿里·纳扎里高产撤稿","score":66,"region":"国际"},{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"thomas-sudhof","name":"诺奖得主祖德霍夫论文数据错误","score":82,"region":"国际"},{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"}]},{"key":"chongqing_liuhua_2025","name":"重庆大学刘某华学术不端通报","slug":"chongqing-liuhua","region":"中国","keywords":["刘某华","重庆大学","研究生院副院长","学术不端","2025","通报","论文","高校"],"summary":"**2025年**，重庆大学通报，针对网络反映该校研究生院副院长刘某华相关学术不端问题，学校调查后认定属实并作出处理（免去职务、取消导师资格等）。该案是教育部常态化公开曝光高校教师学术不端典型案例之一，体现对中层管理岗学者学术诚信的同等要求。","timeline":[{"date":"2025-05","desc":"重庆大学发布通报，认定刘某华学术不端并予处理。"}],"ethics":"核心问题：1）高校管理岗学者的学术诚信；2）举报驱动的校内调查；3）典型案例的公开警示作用。","sources":[{"title":"南京邮电大学：重庆大学刘某华学术不端问题","url":"https://simp.njupt.edu.cn/2025/0908/c13432a288278/page.htm"},{"title":"教育部公开曝光高校教师学术不端典型案例","url":"https://fgc.uestc.edu.cn/info/1073/2838.htm"}],"placements":[{"year":2025,"month":5}],"severity":74,"popularity":66,"score":71,"wordcloud":[["刘某华",5],["高校",5],["学术",5],["重庆大学",3],["研究生院副院长",3],["学术不端",3],["通报",3],["论文",3],["术不",3],["不端",3],["学术不",3],["术不端",3],["重庆",2],["庆大",2],["大学",2],["重庆大",2],["庆大学",2],["刘某",2],["某华",2],["问题",2],["调查",2],["认定",2],["处理",2],["公开",2],["典型",2],["型案",2],["案例",2],["典型案",2]],"deepdive":"## 一、事件全貌：重庆大学刘某华学术不端通报\n\n2025年，重庆大学通报，针对网络反映该校研究生院副院长刘某华相关学术不端问题，学校调查后认定属实并作出处理（免去职务、取消导师资格等）。该案是教育部常态化公开曝光高校教师学术不端典型案例之一，体现对中层管理岗学者学术诚信的同等要求。 事件时间线上的关键节点包括：2025-05：重庆大学发布通报，认定刘某华学术不端并予处理。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**高校管理岗学者的学术诚信**——导师权力须与指导责任对称；当资源与评价高度依附于个人，内部纠错失灵，举报人需要制度化保护。 第二、**举报驱动的校内调查**——集体、以学业为赌注才撬动系统，恰恰说明常规监督通道长期失灵。 第三、**典型案例的公开警示作用**——顶刊论文的牵连提示，机构自查与期刊复核都不足，必须把把关责任落到署名与数据上。 此外，该案与中南大学章忠强谭笑论文学术不端通报、江苏科技大学郭某简历造假事件、徐继学术不端案、同济大学生命学院院长王某Nature论文图表不端等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出导师权力制衡与举报保护的失灵；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n制度正义——当个人须以巨大代价履行本属机构的监督职能，制度即已失职；署名须严格对应真实贡献。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「制衡导师权力、建立反报复举报保护、委员会申诉通道、独立调查、强制原始数据留存」成为硬框架。实际：制衡导师权力、建立反报复举报保护、委员会申诉通道、独立调查、强制原始数据留存，把诚信与招生资格挂钩。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-05","desc":"重庆大学发布通报，认定刘某华学术不端并予处理。","idx":0}],"process":[],"result":[]},"related":[{"slug":"zhang-zhongqiang-tanxiao","name":"中南大学章忠强谭笑论文学术不端通报","score":67,"region":"中国"},{ 业链**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**出版商同行评议漏洞**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**'撤稿数'作为学术生态健康指标的意义**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与2023年Hindawi与Wiley大规模撤稿（论文工厂）、尼日利亚化学家路易斯论文工厂式撤稿、施普林格撤回64篇疑似论文工厂论文、山东济宁第一人民医院论文工厂撤稿事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2023-12","desc":"Retraction Watch 统计确认2023年全球撤稿首破1万篇。","idx":0}],"process":[],"result":[]},"related":[{"slug":"hindawi-2023","name":"2023年Hindawi与Wiley大规模撤稿（论文工厂）","score":84,"region":"国际"},{"slug":"hitler-louis","name":"尼日利亚化学家路易斯论文工厂式撤稿","score":73,"region":"国际"},{"slug":"springer-papermill","name":"施普林格撤回64篇疑似论文工厂论文","score":80,"region":"国际"},{"slug":"jining-hospital-papermill","name":"山东济宁第一人民医院论文工厂撤稿事件","score":78,"region":"中国"},{"slug":"mdpi-retraction-2024","name":"2024年MDPI等开放获取期刊大规模撤稿","score":72,"region":"中国"},{"slug":"springer-retraction-2021","name":"2021年施普林格旗下期刊批量撤稿中国作者","score":74,"region":"中国"},{"slug":"shahaboddin-shamshirband","name":"计算机学者沙姆希尔班德论文工厂式撤稿","score":68,"region":"国际"},{"slug":"li-chuyun","name":"李锄云涉'论文工厂'严重学术造假被通报","score":72,"region":"中国"}]},{"key":"drug_trial_722_2015","name":"2015年药物临床试验数据自查核查（722公告）","slug":"drug-trial-722-2015","keywords":["722公告","药物临床试验","数据自查","CFDA","注册申请","撤回","数据真实性","临床试验伦理"],"summary":"**2015年7月22日**，国家食药监总局发布《关于开展药物临床试验数据自查核查工作的公告》（业界称'**722公告**'），要求已申报生产/进口的药品注册申请人对临床试验数据**全面自查**，数据不真实的须主动撤回。这一行动导致**大量注册申请撤回**，掀起中国药物临床试验**数据真实性**风暴。","timeline":[{"date":"2015-07-22","desc":"CFDA发布722公告，启动药物临床试验数据自查核查。"},{"date":"2015-12","desc":"自查期间大量注册申请被主动撤回或不予批准，行业震动。"},{"date":"2016","desc":"建立临床试验数据核查常态化机制，多起数据造假被曝光。"}],"ethics":"核心意义：1）首次系统性揭开中国药物临床试验**数据失真**问题；2）强化受试者数据真实性与可核查性；3）与GCP、刑法修正案共同构成临床试验诚信防线。是涉及人的研究伦理的关键治理事件。","sources":[{"title":"国家药监局：药物临床试验数据自查核查公告（722公告）","url":"https://www.nmpa.gov.cn/ylqx/ylqxggtg/"},{"title":"国家药监局：关于开展药物临床试验数据自查核查工作的公告（2015年第117号，官方）","url":"https://www.nmpa.gov.cn/xxgk/ggtg/ypggtg/ypqtggtg/20150722173601172.html"},{"title":"国家卫健委：关于配合做好药物临床试验数据自查核查工作的通知","url":"https://www.nhc.gov.cn/yzygj/c100068/201601/91ca027f38794b889eec2da85afe1577.shtml"},{"title":"网易：何为“722事件”——2015年临床试验数据核查改革","url":"https://3g.163.com/dy/article_cambrian/HQBBDP4A055616L2.html"}],"placements":[{"year":2015,"month":7},{"year":2015,"month":12}],"severity":82,"popularity":70,"region":"中国","score":77,"wordcloud":[["数据",9],["临床",7],["床试",7],["试验",7],["临床试",7],["床试验",7],["撤回",6],["药物",4],["物临",4],["验数",4],["自查",4],["核查",4],["药物临",4],["物临床",4],["试验数",4],["验数据",4],["药物临床试验",3],["数据自查",3],["注册申请",3],["数据真实性",3],["临床试验伦理",3],["公告",3],["注册",3],["册申",3],["申请",3],["注册申",3],["册申请",3],["真实",3]],"deepdive":"## 一、事件全貌：2015年药物临床试验数据自查核查（722公告）\n\n2015年7月22日，国家食药监总局发布《关于开展药物临床试验数据自查核查工作的公告》（业界称'722公告'），要求已申报生产/进口的药品注册申请人对临床试验数据全面自查，数据不真实的须主动撤回。这一行动导致大量注册申请撤回，掀起中国药物临床试验数据真实性风暴。 事件时间线上的关键节点包括：2015-07-22：CFDA发布722公告，启动药物临床试验数据自查核查。；2015-12：自查期间大量注册申请被主动撤回或不予批准，行业震动。；2016：建立临床试验数据核查常态化机制，多起数据造假被曝光。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**核心意义：**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**首次系统性揭开中国药物临床试验**数据失真**问题**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**强化受试者数据真实性与可核查性**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**与GCP、刑法修正案共同构成临床试验诚信防线。是涉及人的研究伦理的关键治理事件**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与广东和信健康临床试验数据造假事件、易慕峰生物CAR-T临床试药受试者死亡事件、健康受试者（试药人）药物临床试验安全争议、杜克肿瘤学家波蒂癌症基因组预测造假等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界

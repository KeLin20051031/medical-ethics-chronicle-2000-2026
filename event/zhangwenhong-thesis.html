—数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**'水会议'成为论文工厂的会议渠道**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**揭示会议论文把关缺失**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**提示评价体系对'数量'的盲目接纳助长此类不端**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与武汉理工大学周祖德论文抄袭事件、2024年MDPI等开放获取期刊大规模撤稿、2021年施普林格旗下期刊批量撤稿中国作者、山东济宁第一人民医院论文工厂撤稿事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2016","desc":"多家出版平台对可疑国际会议论文集集中撤稿。","idx":0}],"process":[],"result":[{"date":"2016-12","desc":"学术界呼吁规范会议论文评价与收录。","idx":1}]},"related":[{"slug":"whut-zhou-zude","name":"武汉理工大学周祖德论文抄袭事件","score":65,"region":"中国"},{"slug":"mdpi-retraction-2024","name":"2024年MDPI等开放获取期刊大规模撤稿","score":72,"region":"中国"},{"slug":"springer-retraction-2021","name":"2021年施普林格旗下期刊批量撤稿中国作者","score":74,"region":"中国"},{"slug":"jining-hospital-papermill","name":"山东济宁第一人民医院论文工厂撤稿事件","score":78,"region":"中国"},{"slug":"qingdao-li","name":"青岛大学李某购买SCI论文被撤学位","score":80,"region":"中国"},{"slug":"shahaboddin-shamshirband","name":"计算机学者沙姆希尔班德论文工厂式撤稿","score":68,"region":"国际"},{"slug":"hitler-louis","name":"尼日利亚化学家路易斯论文工厂式撤稿","score":73,"region":"国际"},{"slug":"global-retraction-2023","name":"2023年全球年度撤稿首破一万篇","score":81,"region":"国际"}]},{"key":"sars_2003_research","name":"2003年非典期间科研协作与数据共享争议","slug":"sars-2003-research","keywords":["SARS","非典","科研协作","数据共享","论文抢发","2003年","公共卫生伦理","科研规范"],"summary":"**2003年**非典（SARS）疫情期间，国内科研力量在病原鉴定、试剂与疫苗研发上快速响应，但也暴露**数据共享不畅、各自为战、论文抢发先于公共受益**等问题，引发对突发公卫事件中**科研协作与数据开放**伦理的早期反思。","timeline":[{"date":"2003-04","desc":"多机构并行开展SARS病原与检测研究。"},{"date":"2003-06","desc":"疫情后对科研协作机制与数据共享展开反思。"}],"ethics":"核心意义：1）突发公卫事件中科研资源与数据应服务公共健康；2）抢发论文与公共受益的优先级之辩；3）为后续（如新冠）科研应急协作提供前车之鉴。","sources":[{"title":"Science：SARS科研响应回顾","url":"https://www.science.org/"},{"title":"中国科学院：一篇《科学》论文53位作者，如何署名？——2003年SARS科研大协作","url":"https://www.ipe.cas.cn/dzqk/2022/201601_146993/ztjj/202206/t20220628_6467519.html"},{"title":"中国科学数据：SARS十年·传染病研究 让科研还原“本色”","url":"https://www.phsciencedata.cn/Share/jsp/PublishManager/foregroundView/1/3ffb07d0-0398-4663-9e9b-0684c74423fa.html"},{"title":"北京大学科学研究部：北京大学牵头启动高校网上SARS合作研究中心","url":"https://www.research.pku.edu.cn/bdkyjz/1201829kxyjb1213543.htm"}],"placements":[{"year":2003,"month":4},{"year":2003,"month":6}],"severity":60,"popularity":64,"region":"中国","score":62,"wordcloud":[["科研",5],["非典",4],["数据",4],["科研协作",3],["数据共享",3],["论文抢发",3],["公共卫生伦理",3],["科研规范",3],["公共",3],["协作",3],["疫情",2],["病原",2],["据共",2],["共享",2],["数据共",2],["据共享",2],["论文",2],["抢发",2],["共受",2],["受益",2],["公共受",2],["共受益",2],["突发",2],["发公",2],["公卫",2],["卫事",2],["事件",2],["突发公",2]],"deepdive":"## 一、事件全貌：2003年非典期间科研协作与数据共享争议\n\n2003年非典（SARS）疫情期间，国内科研力量在病原鉴定、试剂与疫苗研发上快速响应，但也暴露数据共享不畅、各自为战、论文抢发先于公共受益等问题，引发对突发公卫事件中科研协作与数据开放伦理的早期反思。 事件时间线上的关键节点包括：2003-04：多机构并行开展SARS病原与检测研究。；2003-06：疫情后对科研协作机制与数据共享展开反思。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**核心意义：**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**突发公卫事件中科研资源与数据应服务公共健康**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**抢发论文与公共受益的优先级之辩**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**为后续（如新冠）科研应急协作提供前车之鉴**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与2020年新冠相关论文集中撤稿事件、英国医生韦克菲尔德麻疹疫苗-自闭症造假论文事件、日本理化学研究所小保方晴子STAP细胞论文造假事件、国家卫健委2026年通报胡凡李萍等论文造假等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2003-04","desc":"多机构并行开展SARS病原与检测研究。","idx":0}],"process":[],"result":[{"date":"2003-06","desc":"疫情后对科研协作机制与数据共享展开反思。","idx":1}]},"related":[{"slug":"covid-paper-retraction-2020","name":"2020年新冠相关论文集中撤稿事件","score":75,"region":"中国"},{"slug":"wakefield-mmr","name":"英国医生韦克菲尔德麻疹疫苗-自闭症造假论文事件","score":95,"region":"国际"},{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"},{"slug":"hu-fan-liping-2026","name":"国家卫健委2026年通报胡凡李萍等论文造假","score":74,"region":"中国"},{"slug":"cams-nature-2020","name":"中国医学科学院新冠Nature论文图片造假质疑","score":74,"region":"中国"},{"slug":"lancet-covid-outcomes","name":"《柳叶刀》新冠出院后6个月结局论文撤稿","score":84,"region":"国际"},{"slug":"marc-hauser","name":"哈佛心理学家豪泽灵长类认知数据造假","score":79,"region":"国际"},{"slug":"jgsu-zhong-liu","name":"井冈山大学钟华刘涛论文造假事件","score":67,"region":"中国"}]},{"key":"irb_fabrication_2023","name":"2023年医疗机构伦理审查材料造假曝光","slug":"irb-fabrication-2023","keywords":["伦理审查","IRB","材料造假","医疗机构","2023年","知情同意","形式审查","科研伦理"],"summary":"**2023年前后**，多起案例暴露部分医疗机构的**伦理委员会（IRB）审查流于形式**，甚至出现**伦理审查申请表、知情同意书代填或事后补造**等违规。国家卫健委随后强化对涉及人的研究伦理审查的专项治理。","timeline":[{"date":"2023","desc":"媒体与监管披露部分机构伦理审查材料不实问题。"},{"date":"2023-02","desc":"《涉及人的生命科学和医学研究伦理审查办法》施行，强化审查责任。"}],"ethics":"核心问题：1）'重材料、轻实质'的伦理审查使受试者保护失效；2）知情同意形式化甚至造假；3）伦理委员会独立性与能力亟待提升。是涉及人的研究伦理的核心痛点。","sources":[{"title":"国家卫健委：涉及人的生命科学和医学研究伦理审查办法","url":"http://www.nhc.gov.cn/"},{"title":"哲学社会科学科研诚信网：国家卫健委通报部分科研失信行为（第一批，含伪造伦理审查批准）","url":"http://index.cassrio.cn/sxal/gn/202609/t20260903_6065720.shtml"},{"title":"湘潭市卫健委：【以案释法】某医院将未通过技术评估和伦理审查的医疗新技术应用于临床","url":"https://wsjkw.xiangtan.gov.cn/5148/23469/content_1348049.html"}],"placements":[{"year":2023,"month":2}],"severity":76,"popularity":66,"region":"中国","score":72,"wordcloud":[["伦理",8],["审查",7],["理审",5],["伦理审",5],["理审查",5],["伦理审查",3],["材料造假",3],["医疗机构",3],["知情同意",3],["形式审查",3],["科研伦理",3],["研究",3],["究伦",3],["研究伦",3],["究伦理",3],["露部",2],["部分",2],["机构",2],["露部分",2],["理委",2],["委员",2],["员会",2],["伦理委",2],["理委员",2],["委员会",2],["形式",2],["甚至",2],["知情",2]],"deepdive":"## 一、事件全貌：2023年医疗机构伦理审查材料造假曝光\n\n2023年前后，多起案例暴露部分医疗机构的伦理委员会（IRB）审查流于形式，甚至出现伦理审查申请表、知情同意书代填或事后补造等违规。国家卫健委随后强化对涉及人的研究伦理审查的专项治理。 事件时间线上的关键节点包括：2023：媒体与监管披露部分机构伦理审查材料不实问题。；2023-02：《涉及人的生命科学和医学研究伦理审查办法》施行，强化审查责任。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**'重材料、轻实质'的伦理审查使受试者保护失效**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**知情同意形式化甚至造假**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**伦理委员会独立性与能力亟待提升。是涉及人的研究伦理的核心痛点**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与2021年人类遗传资源违规处罚案例、广州医科大学范勇人类胚胎基因编辑研究、中山大学黄军就人类胚胎基因编辑研究、华大基因14万孕妇基因数据争议等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2023","desc":"媒体与监管披露部分机构伦理审查材料不实问题。","idx":0}],"process":[],"result":[{"date":"2023-02","desc":"《涉及人的生命科学和医学研究伦理审查办法》施行，强化审查责任。","idx":1}]},"related":[{"slug":"human-genetic-penalty-2021","name":"2021年人类遗传资源违规处罚案例","score":66,"region":"中国"},{"slug":"gzhmc-fan-yong","name":"广州医科大学范勇人类胚胎基因编辑研究","score":84,"region":"中国"},{"slug":"sysu-huang-junjiu","name":"中山大学黄军就人类胚胎基因编辑研究","score":88,"region":"中国"},{"slug":"huada-gene-2018","name":"华大基因14万孕妇基因数据争议","score":75,"region":"中国"},{"slug":"genetic-company-2023","name":"2023年基因测序企业违规采集遗传资源案例","score":65,"region":"中国"},{"slug":"phase1-volunteer-2016","name":"健康受试者（试药人）药物临床试验安全争议","score":69,"region":"中国"},{"slug":"jesse-gelsinger","name":"盖尔辛格基因治疗死亡事件与伦理调查","score":87,"region":"国际"},{"slug":"macchiarini-trachea","name":"瑞典卡罗林斯卡医学院马基亚里尼合成气管移植丑闻","score":92,"region":"国际"}]},{"key":"phase1_volunteer_2016","name":"健康受试者（试药人）药物临床试验安全争议","slug":"phase1-volunteer-2016","keywords":["健康受试者","试药人","I期临床试验","受试者保护","2016年","知情同意","药物安全","科研伦理"],"summary":"**2016—2022年间**，多起健康志愿者在**I期药物临床试验**中出现严重不良反应乃至死亡的报道，引发对**临床试验受试者（尤其健康受试者）权益保护、知情同意与风险收益评估**的关注。部分事件暴露试验方案与监护不足。","timeline":[{"date":"2016","desc":"媒体关注健康受试者参与I期试验的安全与报酬问题。"},{"date":"2020","desc":"新版GCP强化受试者权益与风险管控。"}],"ethics":"核心问题：1）健康受试者在低风险收益权衡中的脆弱性；2）知情同意与赔偿机制；3）申办方与机构的风险管控责任。是涉及人的研究伦理的常态化议题。","sources":[{"title":"新华社：试药人权益调查","url":"https://news.cctv.com/"},{"title":"百度百科：健康试药人","url":"https://baike.baidu.com/item/%E5%81%A5%E5%BA%B7%E8%AF%95%E8%8D%AF%E4%BA%BA/12777288"},{"title":"搜狐：《Ⅰ期/BE临床试验健康受试者/参与者管理·专家共识》发布","url":"https://www.sohu.com/a/860703257_776163"},{"title":"搜狐：健康受试者I期临床试验不良事件分级标准专家共识（2024年版）","url":"https://www.sohu.com/a/812768950_121123705"}],"placements":[{"year":2016,"month":1},{"year":2020,"month":7}],"severity":72,"popularity":64,"region":"中国","score":69,"wordcloud":[["受试",5],["健康",4],["试验",4],["风险",4],["健康受试者",3],["试药人",3],["受试者保护",3],["知情同意",3],["药物安全",3],["科研伦理",3],["康受",3],["健康受",3],["康受试",3],["临床",2],["床试",2],["临床试",2],["床试验",2],["权益",2],["知情",2],["情同",2],["同意",2],["险收",2],["收益",2],["知情同",2],["情同意",2],["风险收",2],["险收益",2],["问题",2]],"deepdive":"## 一、事件全貌：健康受试者（试药人）药物临床试验安全争议\n\n2016—2022年间，多起健康志愿者在I期药物临床试验中出现严重不良反应乃至死亡的报道，引发对临床试验受试者（尤其健康受试者）权益保护、知情同意与风险收益评估的关注。部分事件暴露试验方案与监护不足。 事件时间线上的关键节点包括：2016：媒体关注健康受试者参与I期试验的安全与报酬问题。；2020：新版GCP强化受试者权益与风险管控。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**健康受试者在低风险收益权衡中的脆弱性**——受试者权益优先于研究便利与商业利益；知情同意、风险收益比与来源可追溯，是不能妥协的底线。 第二、**知情同意与赔偿机制**——以「救人」为名的违规，不能凌驾于受试者的安全与知情之上，否则便背叛了医学伦理初心。 第三、**申办方与机构的风险管控责任。是涉及人的研究伦理的常态化议题**——来源不明或假冒的干预措施，既无效又可能带来未知风险，是对公共健康的直接伤害。 此外，该案与盖尔辛格基因治疗死亡事件与伦理调查、易慕峰生物CAR-T临床试药受试者死亡事件、华大基因14万孕妇基因数据争议、2023年基因测序企业违规采集遗传资源案例等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出受试者保护与来源追溯的缺位；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n不伤害与尊重自主是生命伦理的基石——任何以「救人」为名的违规，都不能凌驾于受试者的安全与知情之上。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强化知情同意与伦理审批、疫苗/疗法全程可追溯与批号核验、惩罚与违法所得挂钩、畅通投诉维权与赔偿通道。」成为硬框架。实际：强化知情同意与伦理审批、疫苗/疗法全程可追溯与批号核验、惩罚与违法所得挂钩、畅通投诉维权与赔偿通道。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2016","desc":"媒体关注健康受试者参与I期试验的安全与报酬问题。","idx":0}],"process":[],"result":[{"date":"2020","desc":"新版GCP强化受试者权益与风险管控。","idx":1}]},"related":[{"slug":"jesse-gelsinger","name":"盖尔辛格基因治疗死亡事件与伦理调查","score":87,"region":"国际"},{"slug":"yimufeng-cart-death","name":"易慕峰生物CAR-T临床试药受试者死亡事件","score":87,"region":"中国"},{"slug":"huada-gene-2018","name":"华大基因14万孕妇基因数据争议","score":75,"region":"中国"},{"slug":"genetic-company-2023","name":"2023年基因测序企业违规采集遗传资源案例","score":65,"region":"中国"},{"slug":"gd-hexin-2024","name":"广东和信健康临床试验数据造假事件","score":78,"region":"中国"},{"slug":"drug-trial-722-2015","name":"2015年药物临床试验数据自查核查（722公告）","score":77,"region":"中国"},{"slug":"anil-potti","name":"杜克肿瘤学家波蒂癌症基因组预测造假","score":79,"region":"国际"},{"slug":"irb-fabrication-2023","name":"2023年医疗机构伦理审查材料造假曝光","score":72,"region":"中国"}]},{"key":"human_genetic_penalty_2021","name":"2021年人类遗传资源违规处罚案例","slug":"human-genetic-penalty-2021","keywords":["人类遗传资源","违规处罚","科技部","2021年","生物样本","出境","伦理审查","科研合规"],"summary":"**2021年**，科技部对违反《人类遗传资源管理条例》的行为作出**行政处罚**，涉及未获批擅自采集/出境人类遗传资源、研究活动未通过伦理与安全审查等。这些案例凸显生命科学研究中遗传资源合规与伦理审查的刚性要求。","timeline":[{"date":"2021","desc":"科技部公布多起人类遗传资源违规行政处罚案例。"},{"date":"2021-12","desc":"合规与伦理审查要求进一步收紧。"}],"ethics":"核心意义：1）遗传资源采集与出境须依法审批；2）研究须通过伦理与安全审查；3）违规处罚形成震慑，守护生物安全与科研合规。","sources":[{"title":"科技部：人类遗传资源管理违规处罚信息","url":"https://www.most.gov.cn/kjbgz/"},{"title":"腾讯新闻：施贵宝违反人类遗传资源管理规定案件调查出炉，科技部停止相关项目","url":"https://news.qq.com/rain/a/20210102A0CRXO00"},{"title":"大数医达：那些年人遗办给出的罚单——违反人类遗传资源管理法规的经典案例","url":"http://www.dashoo.cn/industry/renyinews69.html"}],"placements":[{"year":2021,"month":12}],"severity":72,"popularity":58,"region":"中国","score":66,"wordcloud":[["科技部",5],["出境",5],["遗传",5],["传资",5],["资源",5],["遗传资",5],["传资源",5],["伦理",4],["审查",4],["人类遗传资源",3],["违规处罚",3],["生物样本",3],["伦理审查",3],["科研合规",3],["人类",3],["类遗",3],["人类遗",3],["类遗传",3],["处罚",3],["研究",3],["安全",3],["合规",3],["科技",2],["技部",2],["政处",2],["政处罚",2],["采集",2],["全审",2]],"deepdive":"## 一、事件全貌：2021年人类遗传资源违规处罚案例\n\n2021年，科技部对违反《人类遗传资源管理条例》的行为作出行政处罚，涉及未获批擅自采集/出境人类遗传资源、研究活动未通过伦理与安全审查等。这些案例凸显生命科学研究中遗传资源合规与伦理审查的刚性要求。 事件时间线上的关键节点包括：2021：科技部公布多起人类遗传资源违规行政处罚案例。；2021-12：合规与伦理审查要求进一步收紧。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**核心意义：**——伦理审查的前置、可追溯与实质性把关，是任何人体/前沿研究的底线；缺位即意味着把风险转嫁给受试者与公众。 第二、**遗传资源采集与出境须依法审批**——「先做后审」的失序，使探索凌驾于程序正当之上，也架空了遗体或受试者的知情同意。 第三、**研究须通过伦理与安全审查**——审查委员会的责任必须被压实，否则「未审查」与「假审查」会成为违规的掩体。 第四、**违规处罚形成震慑，守护生物安全与科研合规**——伦理审查的前置、可追溯与实质性把关，是任何人体/前沿研究的底线；缺位即意味着把风险转嫁给受试者与公众。 此外，该案与阿斯利康违规转移人类遗传资源被处罚、2023年基因测序企业违规采集遗传资源案例、中山大学黄军就人类胚胎基因编辑研究、2023年医疗机构伦理审查材料造假曝光等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出伦理审查与前置把关的缺失；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n涉及尊重自主与不伤害原则——程序性的伦理审查不是形式，而是对「人」的尊严的最后一道闸。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「把伦理审查前置并独立、可追溯」成为硬框架。实际：把伦理审查前置并独立、可追溯，明确审查委员会的责任；对缺失审查的研究实行一票否决与追责。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2021","desc":"科技部公布多起人类遗传资源违规行政处罚案例。","idx":0}],"process":[],"resu 行为，被取消国家自然科学基金项目申请和参与申请资格 3 年、通报批评。该案是基金委常态化公开通报'买卖数据'的典型。 事件时间线上的关键节点包括：2025-06：基金委通报贺聚良买卖实验数据，取消基金申请资格3年。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**实验数据买卖**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**基金项目的诚信审查**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**常态化通报批评的震慑**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格、马泓买卖实验研究数据案、杨耀工程领域学术不端案、谭清坤研究院学术不端案等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-06","desc":"基金委通报贺聚良买卖实验数据，取消基金申请资格3年。","idx":0}],"process":[],"result":[]},"related":[{"slug":"wei-chengxi","name":"内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格","score":70,"region":"中国"},{"slug":"ma-hong","name":"马泓买卖实验研究数据案","score":65,"region":"中国"},{"slug":"yang-yao","name":"杨耀工程领域学术不端案","score":65,"region":"中国"},{"slug":"tan-qingkun","name":"谭清坤研究院学术不端案","score":65,"region":"中国"},{"slug":"li-wenyan","name":"李文彦工程领域学术不端案","score":65,"region":"中国"},{"slug":"wang-jinjin","name":"王进进工程领域学术不端案","score":65,"region":"中国"},{"slug":"li-ze","name":"李泽买卖实验研究数据案","score":65,"region":"中国"},{"slug":"ningxia-chengjiang","name":"宁夏医科大学成江买卖实验数据案","score":67,"region":"中国"}]},{"key":"li_ze_2025","name":"李泽买卖实验研究数据案","slug":"li-ze","region":"中国","keywords":["李泽","吉林","医院","买卖实验数据","国家自然科学基金","2025","学术不端","通报批评"],"summary":"**2025年**，国家自然科学基金委通报**李泽**（吉林某医院）存在买卖实验研究数据等学术不端行为，予以通报批评。该案反映医生群体'买卖数据'在基金申报中的多发。","timeline":[{"date":"2025-06","desc":"基金委通报李泽买卖实验数据，通报批评。"}],"ethics":"核心问题：1）医生群体数据买卖； ,["请资",3],["资格",3],["申请资",3],["请资格",3],["国家",2],["家自",2],["科学",2],["学基",2],["金委",2],["国家自",2],["科学基",2],["学基金",2],["基金委",2]],"deepdive":"## 一、事件全貌：杨耀工程领域学术不端案\n\n2025年，国家自然科学基金委通报杨耀（工程学水产养殖与水处理领域）存在学术不端行为，被取消国家自然科学基金项目申请和参与申请资格 5 年、通报批评。同领域的王进进、李文彦等一并被通报。 事件时间线上的关键节点包括：2025-06：基金委通报杨耀等工程领域学术不端，取消基金申请资格5年。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**工程应用领域的学术不端**——科研经费来自公共财政，研究者是受托人而非所有人；校企隔离、全过程留痕与审计，是防止公共资源「私有化」的关键。 第二、**同行集中被通报**——虚假票据与关联公司之所以能被反复利用，说明报销、决算与审计链条存在可被钻的缝隙。 第三、**基金申请资格的长周期取消**——评价与资源高度集中于少数「大牛」，本身就制造了寻租空间，须以对应监督去平衡。 此外，该案与李文彦工程领域学术不端案、王进进工程领域学术不端案、谭清坤研究院学术不端案、徐继学术不端案等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出经费管理与审计链条的漏洞；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n受托责任与分配正义——公共经费的挪用既失信于纳税人，也挤占诚实申请人的机会；权力须与对应监督对称。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「推行经费全过程留痕与随机审计」成为硬框架。实际：推行经费全过程留痕与随机审计，严格校企隔离，明确「尽职免责」与「恶意套取」边界，把诚信记录与申报资格挂钩。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-06","desc":"基金委通报杨耀等工程领域学术不端，取消基金申请资格5年。","idx":0}],"process":[],"result":[]},"related":[{"slug":"li-wenyan","name":"李文彦工程领域学术不端案","score":65,"region":"中国"},{"slug":"wang-jinjin","name":"王进进工程领域学术不端案","score":65,"region":"中国"},{"slug":"tan-qingkun","name":"谭清坤研究院学术不端案","score":65,"region":"中国"},{"slug":"xu-ji","name":"徐继学术不端案","score":65,"region":"中国"},{"slug":"he-juliang","name":"贺聚良买卖实验研究数据案","score":67,"region":"中国"},{"slug":"wei-chengxi","name":"内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格","score":70,"region":"中国"},{"slug":"qi-aixue","name":"齐爱学计算机领域学术不端案","score":66,"region":"中国"},{"slug":"yue-fucai","name":"月福财论文抄袭剽窃伪造篡改案","score":67,"region":"中国"}]},{"key":"wang_jinjin_2025","name":"王进进工程领域学术不端案","slug":"wang-jinjin","region":"中国","keywords":["王进进","工程","水产养殖","国家自然科学基金","2025","学术不端" 件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出经费管理与审计链条的漏洞；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n受托责任与分配正义——公共经费的挪用既失信于纳税人，也挤占诚实申请人的机会；权力须与对应监督对称。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「推行经费全过程留痕与随机审计」成为硬框架。实际：推行经费全过程留痕与随机审计，严格校企隔离，明确「尽职免责」与「恶意套取」边界，把诚信记录与申报资格挂钩。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-06","desc":"基金委通报谭清坤学术不端，通报批评。","idx":0}],"process":[],"result":[]},"related":[{"slug":"li-wenyan","name":"李文彦工程领域学术不端案","score":65,"region":"中国"},{"slug":"wang-jinjin","name":"王进进工程领域学术不端案","score":65,"region":"中国"},{"slug":"xu-ji","name":"徐继学术不端案","score":65,"region":"中国"},{"slug":"yang-yao","name":"杨耀工程领域学术不端案","score":65,"region":"中国"},{"slug":"qi-aixue","name":"齐爱学计算机领域学术不端案","score":66,"region":"中国"},{"slug":"yue-fucai","name":"月福财论文抄袭剽窃伪造篡改案","score":67,"region":"中国"},{"slug":"ma-hong","name":"马泓买卖实验研究数据案","score":65,"region":"中国"},{"slug":"wei-chengxi","name":"内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格","score":70,"region":"中国"}]},{"key":"caas_wang_2025","name":"中国农业科学院王某基因编辑数据造假撤稿","slug":"caas-wang","region":"中国","keywords":["王某","中国农业科学院","基因编辑","数据篡改","Nature子刊","撤稿","长江学者","2025","学术不端"],"summary":"**2025年**，中国农业科学院某团队**王某**（课题组长）为争取'十四五'重点专项结题验收，授意成员对农作物基因编辑效率数据系统性篡改、实验样本照片拼接（核查发现 23 张电泳图条带完全重复），相关论文发表于《自然》子刊后被国际同行举报并撤稿；王某被取消'长江学者'称号，5 名研究人员记入科研诚信严重失信名单。该案是'为结题而造假'并登上顶刊的典型。","timeline":[{"date":"2025-10","desc":"通报王某团队基因编辑数据造假，Nature子刊论文撤稿，取消长江学者称号。"}],"ethics":"核心问题：1）为项目结题系统性篡改数据；2）顶刊论文因图片伪造被撤；3）'长江学者'等称号的撤销。","sources":[{"title":"搜狐：2025学术不端典型案例警示录（王某基因编辑造假）","url":"https://www.sohu.com/a/945609932_100209503"},{"title":"搜狐：Nature子刊撤稿 国家重点研发计划！数据处理存储问题 作者主动撤稿","url":"https://www.sohu.com/a/825684133_121996222"},{"title":"昆明学院科技处：学术不端典型案例警示（中国农业科学院某团队基因编辑数据造假撤稿）","url":"https://kyc.kmu.edu.cn/info/1153/2146.htm"}],"placements":[{"year":2025,"month":10}],"severity":84,"popularity":78,"score":82,"wordcloud":[["王某",6],["撤稿",5],["中国农业科学院",3],["基因编辑",3],["数据篡改",3],["长江学者",3],["学术不端",3],["结题",3],["数据",3],["论文",3],["长江",3],["江学",3],["长江学",3],["称号",3],["某团",2],["团队",2],["某团队",2],["编辑",2],["系统",2],["统性",2],["性篡",2],["篡改",2],["系统性",2],["统性篡",2],["性篡改",2],["子刊",2],["取消",2],["造假",2]],"deepdive":"## 一、事件全貌：为「结题」而造假的顶刊论文\r\n2025年，中国农业科学院某团队课题组长王某，为争取「十四五」重点专项结题验收，授意成员对农作物基因编辑效率数据系统性篡改，并将实验样本照片拼接；核查发现23张电泳图条带完全重复（同一凝胶图被复制充当不同样本）。相关论文发表于《自然》子刊后被国际同行举报并撤稿；王某被取消「长江学者」称号，5名研究人员记入科研诚信严重失信名单。\n\n## 二、造假的具体手法：哪些图、怎么造的\r\n核心证据是电泳图（gel electrophoresis）：正常实验中每个样本应有独立的条带。但核查发现23张电泳图中，多条带被完全复制、平移或拼接——即把同一张凝胶图（或同一区域的条带）复制后伪装成不同基因型/不同处理的样本结果，从而「制造」出高编辑效率的假象。通俗说，是用「同一张图」假装做了很多次成功的实验。这正属于典型的图像造假（数据伪造）。\n\n## 三、如何被发现的：国际同行举报→第三方核查\r\n发现机制：论文在《自然》子刊发表后，国际同行在审稿/阅读中注意到电泳图异常（条带像素级重复），向期刊与机构举报；随后由第三方机构介入核查，通过图像比对确认23张图条带完全重复、样本照片存在拼接，坐实系统性篡改。与内部自查不同，此案由外部同行监督触发，凸显开放发表下「图像取证」的威慑。\n\n## 四、背后的利益关系与动机链\r\n直接动机是「结题验收」——重点专项到期，须拿出「成功」数据才能过关、保住经费与帽子（长江学者）。课题组长王某授意成员「技术处理」不符合预期的数据，形成「上级施压—下级操作—论文包装—顶刊发表」的链条。帽子（人才称号）与经费绑定的评价机制，是把人推向造假的现实推力。\n\n## 五、媒体与舆论：各方看法\r\n作为继「论文工厂」后又一顶刊数据造假，舆论批评集中于「为结题造假还上 Nature 子刊」的荒诞，以及人才称号评审的形式化。支持严惩的声音占主流；也有人反思：当「帽子+经费+结题」三重压力叠加，个体易沦为制度的牺牲品——但反思不等于开脱，造假仍须追责。\n\n## 六、科研伦理与哲学维度\r\n核心是诚实报告与可复现：为达结题而篡改数据，是把公共科研经费与学术声誉建立在水面上。知识论上，结论须来自真实、可独立验证的证据，图像伪造直接摧毁可复现性。公正层面，造假挤占真实研究的资源与机会。预防原则要求把「成功压力」与「数据真实」脱钩。\n\n## 七、从底层到实际：如何入手解决\r\n①原始电泳图/图像与处理记录强制公开，期刊引入图像一致性自动筛查；②结题验收实行数据抽检与独立复现，不以单篇顶刊论英雄；③人才称号与经费评审去「唯结果」，允许阴性/未达预期；④对授意造假的课题组长加重追责（连带）；⑤鼓励国际同行监督与举报保护。","phases":{"cause":[{"date":"2025-10","desc":"通报王某团队基因编辑数据造假，Nature子刊论文撤稿，取消长江学者称号。","idx":0}],"process":[],"result":[]},"related":[{"slug":"fujii-retractions","name":"日本麻醉医生藤井善隆创纪录撤稿事件","score":78,"region":"国际"},{"slug":"xjtu-li-liansheng","name":"西安交通大学李连生学术造假案","score":79,"region":"中国"},{"slug":"stapel-psychology","name":"荷兰蒂尔堡大学斯塔佩尔心理学数据造假事件","score":79,"region":"国际"},{"slug":"wang-can-2025","name":"王灿系统性抄袭台湾学人论著事件","score":72,"region":"中国"},{"slug":"covid-paper-retraction-2020","name":"2020年新冠相关论文集中撤稿事件","score":75,"region":"中国"},{"slug":"luk-van-parijs","name":"MIT 教授范帕里斯数据造假被解雇事件","score":75,"region":"国际"},{"slug":"obokata-stap","name":"日本理化学研究所小保方晴子STAP细胞论文造假事件","score":91,"region":"国际"},{"slug":"jgsu-zhong-liu","name":"井冈山大学钟华刘涛论文造假事件","score":67,"region":"中国"}]},{"key":"qingdao_li_2025","name":"青岛大学李某购买SCI论文被撤学位","slug":"qingdao-li","region":"中国","keywords":["李某","青岛大学","购买SCI论文","论文工厂","国家自然科学基金","撤销博士学位","2025","学术不端"],"summary":"**2025年**，青岛大学某医学院副教授**李某**通过中介机构购买 SCI 论文 4 篇（累计支付 28 万元），论文出自'论文工厂'套模板写作、核心数据高度雷同，并凭此获批国家自然科学基金青年项目。事发后其博士学位被撤销（2025年首个因学术不端被'追回'学位案例），代写团伙被牵出。","timeline":[{"date":"2025-10","desc":"通报李某购买SCI论文，博士学位被撤销，基金青年项目被追回。"}],"ethics":"核心问题：1）购买SCI论文/论文工厂；2）凭造假论文获批基金；3）'追回'已授学位的严厉惩戒。","sources":[{"title":"搜狐：2025学术不端典型案例警示录（李某购买论文）","url":"https://www.sohu.com/a/945609932_100209503"},{"title":"青岛大学：关于公布涉嫌造假论文调查结果的通报（二，官方）","url":"https://kjc.qdu.edu.cn/info/1023/3544.htm"},{"title":"昆明学院科技处：学术不端典型案例警示（青岛大学李某购买SCI论文被撤销学位）","url":"https://kyc.kmu.edu.cn/info/1153/2146.htm"},{"title":"人民号：撤销4人博士学位！一批科研不端案例被通报","url":"https://www.peopleapp.com/rmharticle/30025969674"}],"placements":[{"year":2025,"month":10}],"severity":82,"popularity":76,"score":80,"wordcloud":[["论文",7],["李某",5],["学位",4],["青岛大学",3],["论文工厂",3],["国家自然科学基金",3],["撤销博士学位",3],["学术不端",3],["购买",3],["基金",3],["追回",3],["文工",2],["工厂",2],["论文工",2],["文工厂",2],["核心",2],["获批",2],["金青",2],["青年",2],["年项",2],["项目",2],["基金青",2],["金青年",2],["青年项",2],["年项目",2],["博士",2],["士学",2],["撤销",2]],"deepdive":"## 一、事件全貌：青岛大学李某购买SCI论文被撤学位\n\n2025年，青岛大学某医学院副教授李某通过中介机构购买 SCI 论文 4 篇（累计支付 28 万元），论文出自'论文工厂'套模板写作、核心数据高度雷同，并凭此获批国家自然科学基金青年项目。事发后其博士学位被撤销（2025年首个因学术不端被'追回'学位案例），代写团伙被牵出。 事件时间线上的关键节点包括：2025-10：通报李某购买SCI论文，博士学位被撤销，基金青年项目被追回。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**购买SCI论文/论文工厂**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**凭造假论文获批基金**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**'追回'已授学位的严厉惩戒**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与某省属高校机械博士论文抄袭撤销学位、山东济宁第一人民医院论文工厂撤稿事件、宁夏医科大学成江买卖实验数据案、2024年MDPI等开放获取期刊大规模撤稿等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-10","desc":"通报李某购买SCI论文，博士学位被撤销，基金青年项目被追回。","idx":0}],"process":[],"result":[]},"related":[{"slug":"prov-mech-liu","name":"某省属高校机械博士论文抄袭撤销学位","score":78,"region":"中国"},{"slug":"jining-hospital-papermill","name":"山东济宁第一人民医院论文工厂撤稿事件","score":78,"region":"中国"},{"slug":"ningxia-chengjiang","name":"宁夏医科大学成江买卖实验数据案","score":67,"region":"中国"},{"slug":"mdpi-retraction-2024","name":"2024年MDPI等开放获取期刊大规模撤稿","score":72,"region":"中国"},{"slug":"springer-retraction-2021","name":"2021年施普林格旗下期刊批量撤稿中国作者","score":74,"region":"中国"},{"slug":"hitler-louis","name":"尼日利亚化学家路易斯论文工厂式撤稿","score":73,"region":"国际"},{"slug":"ecust-hu-liming","name":"华东理工大学胡黎明博士论文抄袭事件","score":66,"region":"中国"},{"slug":"swjtu-huang-qing","name":"西南交通大学黄庆博士论文抄袭案","score":71,"region":"中国"}]},{"key":"south_v_zhang_2025","name":"南方某高校张某评审舞弊案","slug":"south-v-zhang","region":"中国","keywords":["张某","科技处处长","评审舞弊","泄露专家名单","杰青","开除","2025","学术不端"],"summary":"**2023–2025年**，南方某'双一流'高校科技处处长**张某**利用职务便利，泄露 18 个国家级项目评审专家名单给其妻子（团队PI）并暗示'打点关系'，该团队获批 9 个项目中 7 个存在评审专家与申请人师承关系未回避的违规，导致 2500 余万元经费流入低水平重复研究；张某被开除公职，其妻'杰出青年科学基金'被撤销。","timeline":[{"date":"2025-10","desc":"通报张某评审舞弊，开除公职，其妻杰青被撤销。"}],"ethics":"核心问题：1）评审专家名单泄露与利益输送；2）回避制度失效；3）大额经费的违规配置；4）管理岗权力监督。","sources":[{"title":"搜狐：2025学术不端典型案例警示录（张某评审舞弊）","url":"https://www.sohu.com/a/945609932_100209503"},{"title":"国家自然科学基金委：案件通报（2025年第1批，官方，含评审违规/打探评审信息案例）","url":"https://www.nsfc.gov.cn/p1/2812/2816/83174.html"},{"title":"国家自然科学基金委员会公布2026年第一批学术不端案件（含评审违规）","url":"https://sdw.fjut.edu.cn/2026/0416/c4804a266600/page.htm"}],"placements":[{"year":2025,"month":10}],"severity":86,"popularity":80,"score":84,"wordcloud":[["张某",6],["开除",5],["杰青",4],["评审",4],["科技处处长",3],["评审舞弊",3],["泄露专家名单",3],["学术不端",3],["审专",3],["专家",3],["评审专",3],["审专家",3],["泄露",2],["项目",2],["家名",2],["名单",2],["专家名",2],["家名单",2],["团队",2],["回避",2],["违规",2],["经费",2],["除公",2],["公职",2],["开除公",2],["除公职",2],["撤销",2],["南方",1]],"deepdive":"## 一、事件全貌：掌握名单的「守门人」变现\n\n2023—2025年，南方某「双一流」高校科技处处长张某利用职务便利，**泄露18个国家级项目评审专家名单**给其妻子（团队PI），并暗示「打点关系」；其妻团队获批的9个项目中，7个存在评审专家与申请人师承关系未回避的违规，导致**2500余万元经费**流入低水平重复研究。2025年10月通报：张某被开除公职，其妻「杰出青年科学基金」被撤销。这是一起典型的**管理岗权力寻租 + 评审舞弊**。\n\n## 二、逐层深挖：保密、回避与权力的「内部人」套利\n\n第一，**管理岗的权力寻租**：科技处处长掌握评审信息这一核心资源，把公共权力转化为私人利益。第二，**回避制度失效**：师承关系本应触发回避，却形同虚设，使「自己人评自己人」成为可能。第三，**利益输送链条**：名单泄露→暗示打点→妻团队获益，是一套闭环的利益输送。第四，**大额经费违规配置**：2500余万元流入低水平重复研究，是公共资源在分配环节的失窃。第五，**「双一流」高校的内部治理**：本应具备更严的合规体系，却长期未被发现，说明内部监督存在盲区。\n\n## 三、合理性与不合理性辨析\n\n合理：开除公职、撤销杰青的「双开式」严惩，体现了问责力度，对评审舞弊形成震慑。不合理：其一，如此系统性的名单泄露与回避失效，长期未被发现，说明**评审保密与回避监督缺位**；其二，2500余万元浪费在低水平研究上，是对公共经费与诚实申请人的双重不公；其三，若将责任仅归于个人，而回避监管长期虚设，同类套利仍会复发。\n\n## 四、科研伦理与哲学维度\n\n伦理上，核心是**公职信任责任**与**程序公正**：评审者/管理者受公众托付行使公权，保密与回避是公正的最小防线。哲学上，这是**权力监督**与**分配正义**的问题——公共科研经费属全民资源，其配置须经无偏的程序；当「内部人」以信息优势套利，程序正义即被掏空，诚信申请人的努力被贬值。公正的评审制度，是科学共同体信任的基石。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「**评审保密、回避强制、权力制衡**」成为刚性规则。实际：①评审专家名单实行**严格保密与随机抽取**，接触人员留痕可溯；②强制利益关联申报与回避（师承、合作、亲属等），系统自动校验；③对获批项目实行**事后随机抽查与绩效审计**，识别低水平重复；④对管理岗权力设分权与监督（信息隔离、轮岗）；⑤畅通举报与追责，把评审舞弊与刑责、信用挂钩。让每一笔经费，都经得起无偏的程序。","phases":{"cause":[{"date":"2025-10","desc":"通报张某评审舞弊，开除公职，其妻杰青被撤销。","idx":0}],"process":[],"result":[]},"related":[{"slug":"qingdao-li","name":"青岛大学李某购买SCI论文被撤学位","score":80,"region":"中国"},{"slug":"sichuan-zhao","name":"四川某高校赵某数据造假撤销教授职称","score":74,"region":"中国"},{"slug":"prov-mech-liu","name":"某省属高校机械博士论文抄袭撤销学位","score":78,"region":"中国"},{"slug":"zhong-wen","name":"钟文论文抄袭剽窃伪造篡改案","score":69,"region":"中国"},{"slug":"ningxia-chengjiang","name":"宁夏医科大学成江买卖实验数据案","score":67,"region":"中国"},{"slug":"caas-wang","name":"中国农业科学院王某基因编辑数据造假撤稿","score":82,"region":"中国"},{"slug":"golden-rice","name":"黄金大米事件","score":86,"region":"中国"},{"slug":"gztcm-lai-wen","name":"广州中医药大学赖文论文抄袭事件","score":56,"region":"中国"}]},{"key":"prov_mech_liu_2025","name":"某省属高校机械博士论文抄袭撤销学位","slug":"prov-mech-liu","region":"中国","keywords":["刘某","机械工程","博士学位论文","抄袭","抽检","撤销学位","2025","学术不端"],"summary":"**2025年**，教育部博士学位论文抽检发现某省属高校机械工程专业近三年出现'塌方式'质量问题：12 篇问题论文中整章抄袭（5 篇重复率超40%），刘某核心章节直接翻译自德国学者未公开发表手稿却标注'自主创新成果'；学校倒查撤销 6 人博士学位（含刘某等），分管副校长被诫勉谈话。","timeline":[{"date":"2025-10","desc":"通报博士论文抽检抄袭，撤销6人博士学位，副校长被诫勉。"}],"ethics":"核心问题：1）博士学位论文抽检制度；2）整章翻译/抄袭的认定；3）'倒查撤销'的严厉惩戒；4）导师与培养单位责任。","sources":[{"title":"搜狐：2025学术不端典型案例警示录（刘某等博士论文抄袭）","url":"https://www.sohu.com/a/945609932_100209503"},{"title":"国家自然科学基金委：案件通报（2025年第1批，官方，含学位论文相关不端）","url":"https://www.nsfc.gov.cn/p1/2812/2816/83174.html"},{"title":"国家自然科学基金委：处理决定（各年度案件通报汇总）","url":"https://www.nsfc.gov.cn/p1/2812/2816/cljd.html"}],"placements":[{"year":2025,"month":10}],"severity":80,"popularity":74,"score":78,"wordcloud":[["抄袭",6],["抽检",6],["刘某",5],["博士",5],["士学",4],["学位",4],["论文",4],["博士学",4],["士学位",4],["机械工程",3],["博士学位论文",3],["撤销学位",3],["学术不端",3],["文抽",3],["论文抽",3],["文抽检",3],["问题",3],["撤销",3],["位论",2],["学位论",2],["位论文",2],["整章",2],["核心",2],["翻译",2],["倒查",2],["查撤",2],["倒查撤",2],["查撤销",2]],"deepdive":"## 一、事件全貌：某省属高校机械博士论文抄袭撤销学位\n\n2025年，教育部博士学位论文抽检发现某省属高校机械工程专业近三年出现'塌方式'质量问题：12 篇问题论文中整章抄袭（5 篇重复率超40%），刘某核心章节直接翻译自德国学者未公开发表手稿却标注'自主创新成果'；学校倒查撤销 6 人博士学位（含刘某等），分管副校长被诫勉谈话。 事件时间线上的关键节点包括：2025-10：通报博士论文抽检抄袭，撤销6人博士学位，副校长被诫勉。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**博士学位论文抽检制度**——导师权力须与指导责任对称；当资源与评价高度依附于个人，内部纠错失灵，举报人需要制度化保护。 第二、**整章翻译/抄袭的认定**——集体、以学业为赌注才撬动系统，恰恰说明常规监督通道长期失灵。 第三、**'倒查撤销'的严厉惩戒**——顶刊论文的牵连提示，机构自查与期刊复核都不足，必须把把关责任落到署名与数据上。 第四、**导师与培养单位责任**——导师权力须与指导责任对称；当资源与评价高度依附于个人，内部纠错失灵，举报人需要制度化保护。 此外，该案与东北财经大学袁博硕士论文抄袭事件、西南交通大学黄庆博士论文抄袭案、华东理工大学胡黎明博士论文抄袭事件、广州中医药大学赖文论文抄袭事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出导师权力制衡与举报保护的失灵；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n制度正义——当个人须以巨大代价履行本属机构的监督职能，制度即已失职；署名须严格对应真实贡献。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「制衡导师权力、建立反报复举报保护、委员会申诉通道、独立调查、强制原始数据留存」成为硬框架。实际：制衡导师权力、建立反报复举报保护、委员会申诉通道、独立调查、强制原始数据留存，把诚信与招生资格挂钩。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-10","desc":"通报博士论文抽检抄袭，撤销6人博士学位，副校长被诫勉。","idx":0}],"process":[],"result":[]},"related":[{"slug":"dufe-yuan-bo","name":"东北财经大学袁博硕士论文抄袭事件","score":60,"region":"中国"},{"slug":"swjtu-huang-qing","name":"西南交通大学黄庆博士论文抄袭案","score":71,"region":"中国"},{"slug":"ecust-hu-liming","name":"华东理工大学胡黎明博士论文抄袭事件","score":66,"region":"中国"},{"slug":"gztcm-lai-wen","name":"广州中医药大学赖文论文抄袭事件","score":56,"region":"中国"},{"slug":"qingdao-li","name":"青岛大学李某购买SCI论文被撤学位","score":80,"region":"中国"},{"slug":"yu-yanru","name":"北京大学于艳茹博士论文抄袭被撤销学位事件","score":74,"region":"中国"},{"slug":"zhong-wen","name":"钟文论文抄袭剽窃伪造篡改案","score":69,"region":"中国"},{"slug":"chongqing-liuhua","name":"重庆大学刘某华学术不端通报","score":71,"region":"中国"}]},{"key":"bio_qian_2025","name":"钱某基因治疗临床试验数据造假案","slug":"bio-qian","region":"中国","keywords":["钱某","首席科学家","基因治疗","临床试验","销毁数据","注册驳回","2025","学术不端"],"summary":"**2025年**，某生物医药企业联合高校的首席科学家**钱某**，在基因治疗临床试验中未充分验证安全性，篡改实验猴病理检测报告，并故意销毁 37% 原始数据记录以掩盖动物异常免疫反应；相关药品注册申请被驳回，钱某被永久取消申请科技计划资格。","timeline":[{"date":"2025-10","desc":"通报钱某基因治疗临床数据造假，药品注册被驳回，取消科技计划资格。"}],"ethics":"核心问题：1）未验证疗法的临床推进；2）原始数据销毁；3）企业-高校联合研究的监管；4）药品注册诚信。","sources":[{"title":"搜狐：2025学术不端典型案例警示录（钱某基因治疗）","url":"https://www.sohu.com/a/945609932_100209503"},{"title":"搜狐：从51人被通报到学位撤销——2025学术不端典型案例警示录（含基因治疗临床试验数据造假）","url":"https://it.sohu.com/a/945609932_100209503"},{"title":"哲学社会科学科研诚信网：国家卫健委通报部分科研失信行为（第一批，含编造研究过程/伪造研究成果）","url":"http://index.cassrio.cn/sxal/gn/202609/t20260903_6065720.shtml"}],"placements":[{"year":2025,"month":10}],"severity":84,"popularity":76,"score":81,"wordcloud":[["钱某",6],["首席科学家",3],["基因治疗",3],["临床试验",3],["销毁数据",3],["注册驳回",3],["学术不端",3],["临床",3],["数据",3],["药品",3],["品注",3],["注册",3],["药品注",3],["品注册",3],["企业",2],["联合",2],["高校",2],["治疗",2],["疗临",2],["验证",2],["治疗临",2],["疗临床",2],["销毁",2],["原始",2],["始数",2],["原始数",2],["始数据",2],["申请",2]],"deepdive":"## 一、事件全貌：钱某基因治疗临床试验数据造假案\n\n2025年，某生物医药企业联合高校的首席科学家钱某，在基因治疗临床试验中未充分验证安全性，篡改实验猴病理检测报告，并故意销毁 37% 原始数据记录以掩盖动物异常免疫反应；相关药品注册申请被驳回，钱某被永久取消申请科技计划资格。 事件时间线上的关键节点包括：2025-10：通报钱某基因治疗临床数据造假，药品注册被驳回，取消科技计划资格。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**未验证疗法的临床推进**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**原始数据销毁**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**企业-高校联合研究的监管**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**药品注册诚信**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与四川某高校赵某数据造假撤销教授职称、马泓买卖实验研究数据案、贺聚良买卖实验研究数据案、2020年刑法修正案（十一）增设注册数据造假罪等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-10","desc":"通报钱某基因治疗临床数据造假，药品注册被驳回，取消科技计划资格。","idx":0}],"process":[],"result":[]},"related":[{"slug":"sichuan-zhao","name":"四川某高校赵某数据造假撤销教授职称","score":74,"region":"中国"},{"slug":"ma-hong","name":"马泓买卖实验研究数据案","score":65,"region":"中国"},{"slug" 写代投黑产渗透主流期刊**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**凸显国际协作治理的必要性**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与2021年施普林格旗下期刊批量撤稿中国作者、2024年MDPI等开放获取期刊大规模撤稿、内蒙古医科大学李春阳代写代投撤稿、2017年Oncotarget等期刊中国作者撤稿潮等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2019","desc":"Springer Nature 部分期刊撤回可疑中国作者论文。","idx":0}],"process":[],"result":[{"date":"2019-12","desc":"出版商加强同行评审与特刊审查。","idx":1}]},"related":[{"slug":"springer-retraction-2021","name":"2021年施普林格旗下期刊批量撤稿中国作者","score":74,"region":"中国"},{"slug":"mdpi-retraction-2024","name":"2024年MDPI等开放获取期刊大规模撤稿","score":72,"region":"中国"},{"slug":"li-chunyang","name":"内蒙古医科大学李春阳代写代投撤稿","score":70,"region":"中国"},{"slug":"oncotarget-2017","name":"2017年Oncotarget等期刊中国作者撤稿潮","score":70,"region":"中国"},{"slug":"tumor-biology-107","name":"'4·20'107篇中国医学论文集中撤稿事件","score":87,"region":"中国"},{"slug":"springer-papermill","name":"施普林格撤回64篇疑似论文工厂论文","score":80,"region":"国际"},{"slug":"hindawi-2023","name":"2023年Hindawi与Wiley大规模撤稿（论文工厂）","score":84,"region":"国际"},{"slug":"paper-mill-2014","name":"2014年论文代写代发产业链曝光","score":68,"region":"中国"}]},{"key":"uni_selfretract_2023","name":"2023年高校大规模自查撤稿","slug":"uni-selfretract-2023","keywords":["高校自查","撤稿","学术不端","2023年","机构治理","诚信档案","论文造假","主体责任"],"summary":"**2023年**，在多部门通报与期刊撤稿压力下，多所高校启动**校内科研诚信自查**，一次性撤回或要求作者撤回**数十篇问题论文**，并将处理结果纳入机构与个人诚信档案。这标志着治理从'被动接通报'转向'主动自查'。","timeline":[{"date":"2023","desc":"多所高校开展科研诚信自查并集中撤回问题论文。"},{"date":"2023-12","desc":"自查结果与诚信档案、考核评聘挂钩。"}],"ethics":"核心意义：1）压实法人单位主体责任；2）自查—撤回—归档形成闭环；3）与'负责任研究行为规范指引'相配套，推动机构自治。","sources":[{"title":"教育部/科技部：高校科研诚信自查部署","url":"https://www.most.gov.cn/kjbgz/"},{"title":"搜狐：大规模撤稿后，教育部——开展撤稿论文自查！","url":"https://www.sohu.com/a/750448157_121118947"},{"title":"腾讯新闻：中国掀起撤稿自查风暴的背后","url":"https://news.qq.com/rain/a/20240228A03DBB00"},{"title":"中国新闻网：2023年全球超过1万篇研究论文被撤回","url":"https://www.chinanews.com.cn/sh/2024/01-19/10148899.shtml"}],"placements":[{"year":2023,"month":12}],"severity":70,"popularity":62,"region":"中国","score":67,"wordcloud":[["自查",5],["撤稿",4],["诚信",4],["撤回",4],["高校自查",3],["学术不端",3],["机构治理",3],["诚信档案",3],["论文造假",3],["主体责任",3],["高校",2],["科研",2],["研诚",2],["信自",2],["科研诚",2],["研诚信",2],["诚信自",2],["信自查",2],["问题",2],["题论",2],["论文",2],["问题论",2],["题论文",2],["机构",2],["信档",2],["档案",2],["诚信档",2],["信档案",2]],"deepdive":"## 一、事件全貌：2023年高校大规模自查撤稿\n\n2023年，在多部门通报与期刊撤稿压力下，多所高校启动校内科研诚信自查，一次性撤回或要求作者撤回数十篇问题论文，并将处理结果纳入机构与个人诚信档案。这标志着治理从'被动接通报'转向'主动自查'。 事件时间线上的关键节点包括：2023：多所高校开展科研诚信自查并集中撤回问题论文。；2023-12：自查结果与诚信档案、考核评聘挂钩。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**核心意义：**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**压实法人单位主体责任**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**自查—撤回—归档形成闭环**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 第四、**与'负责任研究行为规范指引'相配套，推动机构自治**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 此外，该案与2020年新冠相关论文集中撤稿事件、朱斌Science论文撤稿事件、饶毅实名举报曹雪涛李红良裴钢耿美玉风波、重庆大学刘某华学术不端通报等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：相关研究与探索本身可能具有科学或公共价值，应在合规框架下被允许；问题不在研究本身，而在边界与监督。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{" 、逐层深挖：从表象到结构性症结\n\n第一、**被指南采纳的研究结论一旦造假危害巨大**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**临床试验数据的原始可核查**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**学术不端对临床实践的连锁风险**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与挪威医生苏德伯伪造口腔癌研究数据事件、日本骨骼研究者佐藤能启大规模论文造假、俄亥俄州立大学克罗齐癌症实验室不端事件、德国麻醉学家博尔特大规模撤稿事件等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2011-11","desc":"伊拉斯谟医学中心发布初步调查报告，认定波尔德曼斯存在研究不端。","idx":0}],"process":[],"result":[{"date":"2012-10","desc":"最终报告确认欺诈指控，多篇论文被撤稿，其指南依据受到质疑。","idx":1}]},"related":[{"slug":"jon-sudbo","name":"挪威医生苏德伯伪造口腔癌研究数据事件","score":74,"region":"国际"},{"slug":"yoshihiro-sato","name":"日本骨骼研究者佐藤能启大规模论文造假","score":77,"region":"国际"},{"slug":"carlo-croce","name":"俄亥俄州立大学克罗齐癌症实验室不端事件","score":80,"region":"国际"},{"slug":"joachim-boldt","name":"德国麻醉学家博尔特大规模撤稿事件","score":80,"region":"国际"},{"slug":"hoau-yan-wang","name":"纽约市立大学王浩彦阿尔茨海默论文撤稿","score":78,"region":"国际"},{"slug":"ferric-fang","name":"华盛顿大学方 ferric 实验室系列撤稿事件","score":68,"region":"国际"},{"slug":"ynutcm-li-qingsheng","name":"云南中医学院李庆生论文抄袭事件","score":59,"region":"中国"},{"slug":"hua-zhong","name":"研究者钟华高产撤稿","score":66,"region":"国际"}]},{"key":"jon_sudbo_2006","name":"挪威医生苏德伯伪造口腔癌研究数据事件","slug":"jon-sudbo","region":"国际","keywords":["Jon Sudbø","苏德伯","口腔癌","柳叶刀","新英格兰医学杂志","数据伪造","撤稿","挪威","2006"],"summary":"**2005–2006年**，挪威奥斯陆国家医院口腔科医生**扬·苏德伯（Jon Sudbø）**发表于《柳叶刀》（Lancet）的论文（称抗炎药可降低口腔癌发生）被查出伪造患者数据与实验记录；其 2004 年发表于《新英格兰医学杂志》（NEJM）的口腔白斑研究也因同样问题撤稿。调查确认 ：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2005-10","desc":"苏德伯在《柳叶刀》发表抗炎药降低口腔癌风险的研究。","idx":0}],"process":[{"date":"2006-01","desc":"院方任命调查委员会，认定数据系伪造。","idx":1}],"result":[{"date":"2006-02","desc":"《柳叶刀》撤回该论文；同年 NEJM 等多篇论文相继撤稿。","idx":2}]},"related":[{"slug":"surgisphere-covid","name":"美国Surgisphere公司新冠数据造假致顶刊撤稿事件","score":89,"region":"国际"},{"slug":"covid-retraction-2020","name":"2020年新冠相关论文全球撤稿潮","score":89,"region":"国际"},{"slug":"scott-reuben","name":"美国麻醉学家鲁本数据伪造入狱案","score":75,"region":"国际"},{"slug":"visfatin","name":"《科学》Visfatin蛋白论文撤稿","score":75,"region":"国际"},{"slug":"zhubin-science","name":"朱斌Science论文撤稿事件","score":72,"region":"中国"},{"slug":"lancet-covid-outcomes","name":"《柳叶刀》新冠出院后6个月结局论文撤稿","score":84,"region":"国际"},{"slug":"yoshihiro-sato","name":"日本骨骼研究者佐藤能启大规模论文造假","score":77,"region":"国际"},{"slug":"anversa-cardiac","name":"美国哈佛医学院安维萨心脏干细胞论文撤稿事件","score":84,"region":"国际"}]},{"key":"ferric_fang_2009","name":"华盛顿大学方 ferric 实验室系列撤稿事件","slug":"ferric-fang","region":"国际","keywords":["Ferric Fang","方","华盛顿大学","微生物学","数据问题","撤稿","Science","PNAS","美国","2009"],"summary":"**2008–2009年**，美国华盛顿大学微生物学与实验室医学教授**费里克·方（Ferric Fang）**实验室多篇论文因数据问题被撤稿，包括一篇 2009 年《科学》（Science）关于新型酶筛选方法的论文及多篇 PNAS 等文章。美国研究诚信办公室（ORI）调查认定其实验室成员存在研究不端；方本人配合调查、主动撤稿，该案凸显资深科学家对实验室数据治理的责任。","timeline":[{"date":"2008-11","desc":"方实验室多篇论文开始因数据异常接受调查。"},{"date":"2009-12","desc":"《科学》相关论文被撤回，ORI 认定实验室成员存在不端行为。"}],"ethics":"核心问题：1）资深 PI 对原始数据的监管责任；2）高通量筛选类论文的复核；3）主动撤稿与配合调查的态度。","sources":[{"title":"Retraction Watch: ferric fang category","url":"https://retractionwatch.com/category/ferric-fang/"},{"title":"知乎：2020-2021学术不端腐败事件大盘点（含Ferric Fang实验室系列撤稿）","url":"https://zhuanlan.zhihu.com/p/389709991"},{"title":"搜狐：又是学术不端！34人，被处理！","url":"https://www.sohu.com/a/960210601_121022803"}],"placements":[{"year":2009,"month":12}],"severity":74,"popularity":60,"score 年，国家卫健委发布《关于涉'论文工厂'严重学术造假行为调查处理结果的通报（第三批）》（2026-07-30），点名李锄云作为第一作者的论文涉嫌'论文工厂'代写代发等严重学术造假。处理包括科研诚信诫勉谈话、在一定范围内公开通报、10 年内禁止承担或参与财政性资金支持的科技活动、2 年内取消科技奖励与人才称号申报资格、涉事论文终身不得用于申报课题或奖励等。该案是 2026 年卫健系统重拳整治'论文工厂'的代表。 事件时间线上的关键节点包括：2026-07-30：国家卫健委通报涉'论文工厂'第三批，李锄云作为第一作者被严肃处理。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**'论文工厂'产业链对医学学术生态的侵蚀**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**第一作者与通讯作者的连带责任**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**涉事论文'终身不可用'的惩戒边界**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与江西省人民医院邵靓多篇论文失信被终身禁研、国家卫健委2026年通报胡凡李萍等论文造假、2023年全球年度撤稿首破一万篇、施普林格撤回64篇疑似论文工厂论文等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2026-07-30","desc":"国家卫健委通报涉'论文工厂'第三批，李锄云作为第一作者被严肃处理。","idx":0}],"process":[],"result":[]},"related":[{"slug":"shao-liang","name":"江西省人民医院邵靓多篇论文失信被终身禁研","score":76,"region":"中国"},{"slug":"hu-fan-liping-2026","name":"国家卫健委2026年通报胡凡李萍等论文造假","score":74,"region":"中国"},{"slug":"global-retraction-2023","name":"2023年全球年度撤稿首破一万篇","score":81,"region":"国际"},{"slug":"springer-papermill","name":"施普林格撤回64篇疑似论文工厂论文","score":80,"region":"国际"},{"slug":"jining-hospital-papermill","name":"山东济宁第一人民医院论文工厂撤稿事件","score":78,"region":"中国"},{"slug":"mdpi-retraction-2024","name":"2024年MDPI等开放获取期刊大规模撤稿","score":72,"region":"中国"},{"slug":"springer-retraction-2021","name":"2021年施普林格旗下期刊批量撤稿中国作者","score":74,"region":"中国"},{"slug":"qingdao-li","name":"青岛大学李某购买SCI论文被撤学位","score":80,"region":"中国"}]},{"key":"wei_chengxi_2025","name":"内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格","slug":"wei-chengxi","region":"中国","keywords":["魏成喜","内蒙古民族大学","买卖实验数据","国家自然科学基金","永久取消","学术不端","2025"],"summary":"**2025年**，国家自然科学基金委员会通报 2025 年第一批科研不端案件，涉及内蒙古民族大学原医学院院长**魏成喜**等多人为相关责任作者发表的 10 篇论文（含 'miR-15b represses BACE1 expression in sporadic Alzheimer's disease' 等）存在**买卖实验数据**等不端行为。魏成喜被撤销相关基金项目、追回资金，并被**永久性取消国家自然科学基金项目申请和参与申请资格**，给予通报批评。该案是基金委对'买卖数据'顶格处理的高校领导干部案例。","timeline":[{"date":"2025-04-11","desc":"国家自然科学基金委通报 2025 年第一批案件，魏成喜等因买卖实验数据被处理。"}],"ethics":"核心问题：1）高校院系负责人带头买卖数据的危害；2）基金项目的资金追回与资格永久取消；3）'买卖实验数据'作为新型高发不端类型。","sources":[{"title":"上观新闻：内蒙古民大原医学院院长魏成喜买卖实验数据等被永久取消国自然资格","url":"https://www.jfdaily.com/wx/detail.do?id=892059"},{"title":"自然科学基金委2025年不端行为案件处理结果通报（第一批次）","url":"http://kycx.ustc.edu.cn/2025/0425/c34385a682049/"}],"placements":[{"year":2025,"month":4}],"severity":76,"popularity":60,"score":70,"wordcloud":[["魏成喜",6],["基金",6],["买卖",5],["数据",5],["内蒙古民族大学",3],["买卖实验数据",3],["国家自然科学基金",3],["永久取消",3],["学术不端",3],["国家",3],["家自",3],["科学",3],["学基",3],["金委",3],["国家自",3],["科学基",3],["学基金",3],["基金委",3],["不端",3],["魏成",3],["成喜",3],["卖实",3],["实验",3],["验数",3],["买卖实",3],["卖实验",3],["实验数",3],["验数据",3]],"deepdive":"## 一、事件全貌：内蒙古民族大学魏成喜买卖实验数据被永久取消国自然资格\n\n2025年，国家自然科学基金委员会通报 2025 年第一批科研不端案件，涉及内蒙古民族大学原医学院院长魏成喜等多人为相关责任作者发表的 10 篇论文（含 'miR-15b represses BACE1 expression in sporadic Alzheimer's disease' 等）存在买卖实验数据等不端行为。魏成喜被撤销相关基金项目、追回资金，并被永久性取消国家自然科学基金项目申请和参与申请资格，给予通报批评。该案是基金委对'买卖数据'顶格处理的高校领导干部案例。 事件时间线上的关键节点包括：2025-04-11：国家自然科学基金委通报 2025 年第一批案件，魏成喜等因买卖实验数据被处理。。 该案发生于中国，是科研伦理治理中值得深究的典型样本。\n\n## 二、逐层深挖：从表象到结构性症结\n\n第一、**高校院系负责人带头买卖数据的危害**——数据的可获取、可复现是科学结论正当性的根基；图像与数据的异常一旦被复用或捏造，整条证据链即崩塌。 第二、**基金项目的资金追回与资格永久取消**——同行评议难以仅凭方法识别被操纵的数据，原始数据公开与图像筛查才是把住关的前置条件。 第三、**'买卖实验数据'作为新型高发不端类型**——高影响力期刊同样未能挡住数据失范，说明问题不在个别作者，而在复核与问责的制度薄弱。 此外，该案与马泓买卖实验研究数据案、贺聚良买卖实验研究数据案、宁夏医科大学成江买卖实验数据案、谭清坤研究院学术不端案等事件在机理或治理上相互映照，提示同类风险并非孤例。\n\n## 三、合理性与不合理性辨析\n\n合理：事件最终触发了调查、通报、撤稿、处罚或问责等回应，体现了纠错与震慑的一面；司法或监管对不端与违规的追责，确立了不可触碰的红线。不合理：其一，问题的长期存在暴露出数据复核与同行评议的薄弱；其二，仅靠事后追责难以根治，须把防线前移；其三，若责任仅归于个人而不修补制度，同类事件必然复发。\n\n## 四、科研伦理与哲学维度\n\n知识论上，结论的正当性来自可独立验证的证据，而非期刊声誉或作者光环；自我修正依赖外部可核查的监督。 哲学上，该案折射出「能力/权力—责任」的对称命题：拥有学术权威、公共资源或技术能力的一方，须承担对应的把关与示范义务，而不能将其异化为寻租或失控的空间。公正层面，公共资源的配置与受试者的权益，都必须经无偏、可核查的程序；科学的公信力，来自可被质疑、能被验证、愿担责。\n\n## 五、从底层到实际：如何入手解决\n\n底层上，要让「强制原始数据与图像处理记录公开」成为硬框架。实际：强制原始数据与图像处理记录公开，引入图像一致性自动筛查，建立异常高产预警与独立调查，奖励复现与证伪。 同时，把个案整改上升为制度修补，建立可核查、可问责的常态化监督，让诚信成为可预期的行为激励，使同类事件在源头被阻断而非仅在事后被通报。","phases":{"cause":[{"date":"2025-04-11","desc":"国家自然科学基金委通报 2025 年第一批案件，魏成喜等因买卖实验数据被处理。","idx":0}],"process":[],"result":[]},"related":[{"slug":"ma-hong","name":"马泓买卖实验研究数据案","score":65,"region":"中国"},{"slug":"he-juliang","name":"贺聚良买卖实验研究数据案","score":67,"region":"中国"},{"slug":"ningxia-chengjiang","name":"宁夏医科大学成江买卖实验数据案","score":67,"region":"中国"},{"slug":"tan-qingkun","name":"谭清坤研究院学术不端案","score":65,"region":"中国"},{"slug":"li-wenyan","name":"李文彦工程领域学术不端案","score":65,"region":"中国"},{"slug":"wang-jinjin","name":"王进进工程领域学术不端案","score":65,"region":"中国"},{"slug":"li-ze","name":"李泽买卖实验研究数据案","score":65,"region":"中国"},{"slug":"yang-yao","name":"杨耀工程领域学术不端案","score":65,"region":"中国"}]}],"global_wordcloud":[["撤稿",533],["论文",460],["数据",269],["学术不端",177],["研究",158],["问题",138],["美国",127],["学术",120],["大学",117],["举报",91],["造假",86],["抄袭",85],["科学",85],["图像",84],["科研",83],["调查",79],["不端",76],["伦理",75],["医学",71],["实验",65],["基金",65],["撤稿观察排行榜",60],["科研诚信",57],["发表",55],["博士",52],["诚信",51],["国家自然科学基金",51],["论文工厂",48],["试验",47],["领域",46],["数据伪造",45],["数据造假",43],["临床",43],["新冠",43],["机构",41],["基金委",40],["撤销",39],["导师",37],["图片",37],["学位",36],["术不",36],["学术不",36],["术不端",36],["经费",35],["日本",35],["文工",35],["工厂",35],["论文工",35],["文工厂",35],["工程",35]],"year_wordcloud":{"2000":[["加拿大",9],["营养",8],["数据",8],["试验",8],["钱德拉",5],["调查",5],["吹哨人",5],["儿童",4],["补充剂",4],["撤稿",4],["多伦多",4],["宾大",4],["数据造假",3],["研究",3],["论文",3],["奥利维耶里",3],["临床试验",3],["数据压制",3],["学术自由",3],["诉讼",3],["机构",3],["盖尔辛格",3],["基因治疗",3],["知情同意",3],["伦理审查",3],["美国",3],["治疗",3],["知情",3],["情同",3],["同意",3 function $(s){return document.querySelector(s);}

// rich：支持 **加粗**，并把事件关键词在正文首次出现处自动加粗（重点突出）
function rich(s, boldKw){
  if(!s) return "";
  const used=new Set();
  return String(s).split(/(\*\*[^*]+\*\*)/g).map(seg=>{
    if(seg.length>=4 && seg.startsWith("**") && seg.endsWith("**")) return "<b>"+esc(seg.slice(2,-2))+"</b>";
    let t=esc(seg);
    if(boldKw){
      KW.forEach(k=>{
        if(k && k.length>=3 && !used.has(k) && !/[^一-鿿]/.test(k)){
          try{ const re=new RegExp("("+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")","g"); if(re.test(t)){ t=t.replace(re,"<b>$1</b>"); used.add(k); } }catch(e){}
        }
      });
    }
    return t;
  }).join("");
}
// richDeep：深度复盘——逐行解析，支持 **加粗**、## 小标题、![alt](url) 内嵌图片（标题/图片无需空行分隔）
function richDeep(s){
  if(!s) return "";
  const lines=String(s).replace(/\r/g,"").split("\n");
  const out=[], buf=[];
  const flush=()=>{ if(buf.length){ out.push(`<p>${buf.map(l=>rich(l,true)).join("<br>")}</p>`); buf.length=0; } };
  for(const raw of lines){
    const t=raw.trim();
    if(!t){ flush(); continue; }
    if(t.startsWith("## ")){ flush(); out.push(`<h4 class="phase">${esc(t.slice(3))}</h4>`); continue; }
    const im=t.match(/^!\[(.*?)\]\((.*?)\)\s*(.*)$/);
    if(im){ flush(); out.push(`<figure class="deepfig"><img src="${esc(im[2])}" alt="${esc(im[1])}" onerror="this.closest('figure').style.display='none'"><figcaption>${esc((im[3]||im[1]||"").trim())}</figcaption></figure>`); continue; }
    buf.push(t);
  }
  flush();
  return out.join("");
}

// 背景与脉络（来自网络扩写，附于摘要后）
const background=ev.background?`<div class="abstract" style="border-left:4px solid var(--accent2)"><span class="lab" style="color:var(--accent2)">【背景与脉络】</span>${rich(ev.background,true)}</div>`:'';
const ESEC=background?3:2;

// 事件始末（起因—经过—结果，每段均带具体时间）
const phTitle={cause:"一、起因：背景与导火索",process:"二、经过：核心事件演变",result:"三、结果：处置、影响与后续"};
const phases=ev.phases||{cause:[],process:[],result:[]};
let narr=`<div class="narr">`;
['cause','process','result'].forEach(ph=>{
  if(!phases[ph]||!phases[ph].length)return;
  narr+=`<h4 class="phase">${phTitle[ph]}</h4>`;
  phases[ph].forEach(t=>{ narr+=`<p><span class="date">${esc(t.date)}</span>${rich(t.desc,true)}${cite(t.idx)}</p>`; });
});
narr+=`</div>`;

// 伦理审查与辩证分析（仅保留事件专属内容；剔除跨事件重复的模板化长段落）
const kwTop=(ev.keywords||[]).filter(Boolean).slice(0,3);
let ethicsBlock=`<div class="dia">
<h4 class="phase">${ESEC}.1 争议焦点与事实梳理</h4>
<div class="ethics">${rich(ev.ethics,true)||"（暂无专门伦理审查说明）"}${citeAll}</div>`;
let esn=1;
if(ev.stances){esn++;ethicsBlock+=`<h4 class="phase">${ESEC}.${esn} 各方立场与舆论反响</h4><div class="ethics">${rich(ev.stances,true)}</div>`;}
if(ev.discussion){esn++;ethicsBlock+=`<h4 class="phase">${ESEC}.${esn} 延伸讨论与制度反思</h4><p>${rich(ev.discussion,true)}</p>`;}
if(ev.impact){esn++;ethicsBlock+=`<h4 class="phase">${ESEC}.${esn} 影响、处置与制度后续</h4><p>${rich(ev.impact,true)}</p>`;}
if(!ev.stances&&!ev.discussion&&!ev.impact){esn++;ethicsBlock+=`<h4 class="phase">${ESEC}.${esn} 辩证研判</h4><p>就「${esc(ev.name)}」而言，其争议集中于${kwTop.length?kwTop.map(k=>"「"+esc(k)+"」").join("、"):"伦理审查与科研诚信"}等环节：创新价值与风险防范、学术自主与公共问责、个案处置与制度治理三组张力交织其间，得失判断应回到具体事实与证据，避免以结果好坏简单倒推过程正当性。</p>`;}
ethicsBlock+=`</div>`;

// 参考文献（真实来源网址汇总）
let refsHtml=`<div class="refs">`;
if(nrefs){
  refsHtml+=`<ol>`;
  refs.forEach((r,i)=>{refsHtml+=`<li id="ref${i+1}"><a href="${esc(r.url)}" target="_blank" rel="noopener">[${i+1}] ${esc(r.title)}</a> <span class="srcurl">${esc(r.url)}</span></li>`;});
  refsHtml+=`</ol>`;
}else{
  refsHtml+=`<p>暂无来源链接，相关整理以公开报道与官方通报为准。</p>`;
}
refsHtml+=`<p class="note">说明：角标编号（上标 [n]）依次对应上述来源；文中所有人物、机构、时间、数据与因果陈述均以来源网址为准，读者可点击核对原始网页。</p></div>`;

// 相关推荐（关键词相关性，点击直接跳转）
const rel=(ev.related||[]).filter(r=>r.slug!==ev.slug);
let relHtml=`<div class="rel">`;
if(rel.length){
  relHtml+=`<div class="rel-grid">`;
  rel.forEach(r=>{
    relHtml+=`<a class="rel-card" href="${esc(r.slug)}.html">
      <span class="rel-name">${esc(r.name)}</span>
      <span class="rel-meta">评分 ${r.score}${r.region==="国际"?" · 国际":""}</span></a>`;
  });
  relHtml+=`</div>`;
}else{ relHtml+=`<p class="rel-empty">暂无关联事件。</p>`; }
relHtml+=`</div>`;

const secNarr=background?2:1, secDeep=secNarr+1, secEth=secDeep+1, secRef=secEth+1, secRel=secRef+1;
const deepHtml=ev.deepdive?`<div class="sec deep"><div class="sec-h"><span class="num">${secDeep}</span>深度复盘 · 来龙去脉</div>${richDeep(ev.deepdive)}</div>`:'';
$("#paper").innerHTML=
head+
`<div class="sec"><div class="sec-h"><span class="num">0</span>摘要与关键词</div>${abstract}${keywords}</div>`+
(background?`<div class="sec"><div class="sec-h"><span class="num">1</span>背景与脉络</div>${background}</div>`:'')+
`<div class="sec"><div class="sec-h"><span class="num">${secNarr}</span>事件始末（起因—经过—结果）</div>${narr}</div>`+
deepHtml+
`<div class="sec"><div class="sec-h"><span class="num">${secEth}</span>伦理审查与辩证分析</div>${ethicsBlock}</div>`+
`<div class="sec"><div class="sec-h"><span class="num">${secRef}</span>参考文献（真实来源网址汇总）</div>${refsHtml}</div>`+
`<div class="sec"><div class="sec-h"><span class="num">${secRel}</span>相关推荐（关键词关联）</div>${relHtml}</div>`;
</script>
</body>
</html>
